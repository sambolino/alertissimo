name: Temporary LSST semantic validation migration

on:
  push:
    branches:
      - fix/semantic-registry-lsst-validation
    paths:
      - scripts/dev/fix_lsst_semantic_validation.py
      - .github/workflows/temporary-lsst-validation-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-registry-lsst-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install migration dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Apply semantic migration
        run: python scripts/dev/fix_lsst_semantic_validation.py
      - name: Check generated diff
        run: git diff --check
      - name: Commit generated semantic fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add alertissimo/data_layer/semantic_model/ontology.yaml \
                  alertissimo/data_layer/providers/alerce/lsst/mappings.yaml \
                  alertissimo/data_layer/providers/antares/lsst/mappings.yaml \
                  alertissimo/data_layer/providers/fink/lsst/mappings.yaml \
                  alertissimo/data_layer/providers/fink/lsst/unmapped_fields.yaml \
                  tests
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Realign LSST mappings with current semantic ontology'
            git push origin HEAD:fix/semantic-registry-lsst-validation
          fi
