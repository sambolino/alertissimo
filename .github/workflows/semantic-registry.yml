name: Semantic registry

on:
  pull_request:
    paths:
      - 'alertissimo/data_layer/**'
      - 'tests/test_mapping_schema.py'
      - 'tests/test_semantic_paths.py'
      - 'tests/test_semantic_model_validation.py'
      - 'tests/test_semantic_record_builder.py'
      - 'tests/test_normalization_cardinality.py'
      - 'tests/test_payload_paths.py'
      - 'tests/test_orchestration_normalization.py'
      - 'tests/test_orchestration_ir_models.py'
      - 'tests/test_orchestration_binding.py'
      - 'tests/test_orchestration_capability_validation.py'
      - 'tests/test_orchestration_planner.py'
      - 'tests/test_orchestration_runner.py'
      - 'tests/test_capability_graph.py'
      - 'tests/test_endpoint_execution.py'
      - 'tests/test_lasair_registry_architecture.py'
      - 'tests/test_lasair_ztf_live_capture.py'
      - 'tests/test_lasair_lsst_live_capture.py'
      - 'tests/test_lasair_payload_example.py'
      - 'tests/test_alerce_classification_mappings.py'
      - 'tests/test_alerce_lsst_authoritative_payloads.py'
      - 'tests/test_alerce_ztf_authoritative_payloads.py'
      - 'tests/test_payload_mapping_coverage.py'
      - 'tests/test_ui_fixtures.py'
      - 'examples/build_lasair_portfolio_from_payload.py'
      - 'scripts/build_ui_fixtures.py'
      - 'tests/test_antares_ztf_authoritative_payloads.py'
      - 'tests/test_fink_ztf_authoritative_payloads.py'
      - 'tests/test_fink_lsst_authoritative_payloads.py'
      - 'tests/fixtures/fink/**'
      - 'tests/fixtures/antares/**'
      - 'tests/fixtures/lasair/ztf/**'
      - 'tests/fixtures/lasair/lsst/**'
      - 'tests/fixtures/alerce/**'
      - 'tests/fixtures/ui/**'
      - '.github/workflows/semantic-registry.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML 'pydantic==2.11.7'
      - name: Run semantic core and Lasair live-capture tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_mapping_schema.py \
            tests/test_semantic_paths.py \
            tests/test_semantic_model_validation.py \
            tests/test_semantic_record_builder.py \
            tests/test_normalization_cardinality.py \
            tests/test_payload_paths.py \
            tests/test_orchestration_normalization.py \
            tests/test_orchestration_ir_models.py \
            tests/test_orchestration_binding.py \
            tests/test_orchestration_capability_validation.py \
            tests/test_orchestration_planner.py \
            tests/test_orchestration_runner.py \
            tests/test_capability_graph.py \
            tests/test_endpoint_execution.py \
            tests/test_antares_ztf_authoritative_payloads.py \
            tests/test_fink_ztf_authoritative_payloads.py \
            tests/test_fink_lsst_authoritative_payloads.py \
            tests/test_lasair_registry_architecture.py \
            tests/test_lasair_ztf_live_capture.py \
            tests/test_alerce_classification_mappings.py \
            tests/test_alerce_lsst_authoritative_payloads.py \
            tests/test_alerce_ztf_authoritative_payloads.py \
            tests/test_lasair_lsst_live_capture.py \
            tests/test_lasair_payload_example.py \
            tests/test_payload_mapping_coverage.py \
            tests/test_ui_fixtures.py
      - name: Validate every provider mapping
        run: PYTHONPATH=. python -m alertissimo.data_layer.runtime.mapping_schema --all
