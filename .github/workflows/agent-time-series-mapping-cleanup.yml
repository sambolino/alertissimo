name: Agent time-series mapping cleanup

on:
  pull_request:
    branches:
      - feature/orchestration

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/time-series-mapping-rehome
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove L0 object identity from L1 time-series points
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = list(Path('alertissimo/data_layer/providers').glob('*/*/mappings.yaml'))
          pattern = re.compile(
              r'(?m)^  lightcurve@[^\n]+\.(?:points|forced_photometry_points)\.identity\.object_id:\n(?:  - [^\n]+\n)+'
          )
          changed = []
          for path in paths:
              text = path.read_text()
              updated = pattern.sub('', text)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('Expected at least one L0 point object_id mapping to remove')
          print('Removed point object_id mappings from:', *changed, sep='\n- ')
          PY
      - name: Collapse duplicated copied ALeRCE ZTF filter transform
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('alertissimo/data_layer/providers/alerce/ztf/mappings.yaml')
          text = path.read_text()
          duplicated = '''  lightcurve@ztf:alerce.forced_photometry_points.forced_photometry.{filter}:
              query_forced_photometry#fid:
                type: value_map
                map:
                  1: g
                  '1': g
                  2: r
                  '2': r
                  3: i
                  '3': i
                default: unknown
                type: value_map
                map:
                  1: g
                  '1': g
                  2: r
                  '2': r
                  3: i
                  '3': i
                default: unknown
          '''
          single = '''  lightcurve@ztf:alerce.forced_photometry_points.forced_photometry.{filter}:
              query_forced_photometry#fid:
                type: value_map
                map:
                  1: g
                  '1': g
                  2: r
                  '2': r
                  3: i
                  '3': i
                default: unknown
          '''
          if duplicated not in text:
              raise SystemExit('Expected duplicated copied ALeRCE transform not found')
          path.write_text(text.replace(duplicated, single, 1))
          PY
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML 'pydantic==2.11.7' 'python-dotenv==1.1.1'
      - name: Validate cleanup
        run: |
          git diff --check
          PYTHONPATH=. python -m alertissimo.data_layer.runtime.mapping_schema --all
          PYTHONPATH=. pytest -q \
            tests/test_mapping_schema.py \
            tests/test_semantic_paths.py \
            tests/test_semantic_model_validation.py \
            tests/test_fink_ztf_authoritative_payloads.py \
            tests/test_fink_lsst_authoritative_payloads.py \
            tests/test_alerce_ztf_authoritative_payloads.py \
            tests/test_alerce_lsst_authoritative_payloads.py \
            tests/test_lasair_ztf_authoritative_payloads.py \
            tests/test_antares_ztf_authoritative_payloads.py
      - name: Commit cleanup
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alertissimo/data_layer/providers/*/*/mappings.yaml
          git commit -m 'Tighten time-series point semantics'
          git push origin HEAD:agent/time-series-mapping-rehome
