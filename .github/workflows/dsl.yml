name: DSL compiler

on:
  pull_request:
    paths:
      - 'alertissimo/api.py'
      - 'alertissimo/dsl/**'
      - 'alertissimo/data_layer/runtime/capability_graph.py'
      - 'alertissimo/data_layer/providers/**/request_mappings.yaml'
      - 'alertissimo/orchestration/ir/**'
      - 'alertissimo/orchestration/planner/**'
      - 'alertissimo/orchestration/binding/**'
      - 'alertissimo/orchestration/runtime/**'
      - 'alertissimo/orchestration/normalization/**'
      - 'alertissimo/orchestration/results/**'
      - 'alertissimo/orchestration/validation.py'
      - 'tests/test_dsl_*.py'
      - 'tests/test_capability_graph.py'
      - 'tests/test_orchestration_*.py'
      - '.github/workflows/dsl.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused DSL dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest PyYAML 'pydantic==2.11.7' 'python-dotenv==1.1.1' 'lark==1.2.2'
      - name: Run DSL and touched orchestration contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_dsl_*.py \
            tests/test_capability_graph.py \
            tests/test_orchestration_*.py
