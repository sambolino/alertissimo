name: DSL compiler

on:
  pull_request:
    branches-ignore:
      - 'integration/discovery-completion'
    paths:
      - 'alertissimo/api.py'
      - 'alertissimo/app_dsl.py'
      - 'alertissimo/dsl/**'
      - 'alertissimo/data_layer/execution/**'
      - 'alertissimo/data_layer/runtime/capability_graph.py'
      - 'alertissimo/data_layer/runtime/recipes.py'
      - 'alertissimo/data_layer/transforms/**'
      - 'alertissimo/data_layer/providers/**/*.yaml'
      - 'alertissimo/orchestration/ir/**'
      - 'alertissimo/orchestration/incremental.py'
      - 'alertissimo/orchestration/pipeline.py'
      - 'alertissimo/orchestration/planner/**'
      - 'alertissimo/orchestration/binding/**'
      - 'alertissimo/orchestration/confirmation/**'
      - 'alertissimo/orchestration/runtime/**'
      - 'alertissimo/orchestration/normalization/**'
      - 'alertissimo/orchestration/results/**'
      - 'alertissimo/orchestration/validation.py'
      - 'tests/test_dsl_*.py'
      - 'tests/test_api_continuation.py'
      - 'tests/test_discovery_integration_acceptance.py'
      - 'tests/test_discovery_time_bindings.py'
      - 'tests/test_fink_semantic_search.py'
      - 'tests/test_alerce_semantic_search.py'
      - 'tests/test_lasair_semantic_search.py'
      - 'tests/test_antares_semantic_search.py'
      - 'tests/test_capability_graph.py'
      - 'tests/test_recipe_registry.py'
      - 'tests/test_lasair_ztf_compact_cone_summary.py'
      - 'tests/test_orchestration_*.py'
      - 'scripts/check_release_package.py'
      - 'scripts/live_dsl_complex.py'
      - 'scripts/live_dsl_continuation.py'
      - 'scripts/live_dsl_discovery.py'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/dsl.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused DSL dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest PyYAML 'pydantic==2.11.7' 'python-dotenv==1.1.1' 'lark==1.2.2'
          'setuptools>=69.5.1' wheel
      - name: Run DSL and touched orchestration contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_dsl_*.py \
            tests/test_api_continuation.py \
            tests/test_discovery_integration_acceptance.py \
            tests/test_discovery_time_bindings.py \
            tests/test_fink_semantic_search.py \
            tests/test_alerce_semantic_search.py \
            tests/test_lasair_semantic_search.py \
          tests/test_antares_semantic_search.py \
            tests/test_capability_graph.py \
            tests/test_recipe_registry.py \
            tests/test_lasair_ztf_compact_cone_summary.py \
            tests/test_orchestration_*.py
      - name: Check installed-wheel recipe contracts
        run: PYTHONPATH=. python scripts/check_release_package.py
