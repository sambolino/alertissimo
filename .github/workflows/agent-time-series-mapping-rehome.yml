name: Agent time-series mapping rehome

on:
  pull_request:
    branches:
      - feature/orchestration

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/time-series-mapping-rehome
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore provider mappings from base
        run: |
          git fetch origin feature/orchestration
          git checkout origin/feature/orchestration -- \
            alertissimo/data_layer/providers/fink/ztf/mappings.yaml \
            alertissimo/data_layer/providers/fink/lsst/mappings.yaml \
            alertissimo/data_layer/providers/alerce/ztf/mappings.yaml \
            alertissimo/data_layer/providers/alerce/lsst/mappings.yaml \
            alertissimo/data_layer/providers/lasair/ztf/mappings.yaml \
            alertissimo/data_layer/providers/antares/ztf/mappings.yaml
      - name: Apply targeted time-series mapping migration
        run: |
          python - <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from pathlib import Path
          import re

          ROOT = Path('alertissimo/data_layer/providers')
          FILES = {
              'fink_ztf': ROOT / 'fink/ztf/mappings.yaml',
              'fink_lsst': ROOT / 'fink/lsst/mappings.yaml',
              'alerce_ztf': ROOT / 'alerce/ztf/mappings.yaml',
              'alerce_lsst': ROOT / 'alerce/lsst/mappings.yaml',
              'lasair_ztf': ROOT / 'lasair/ztf/mappings.yaml',
              'antares_ztf': ROOT / 'antares/ztf/mappings.yaml',
          }

          ENTRY = re.compile(r'(?m)^  ([^\n]+):\n')
          CHILD = re.compile(r'(?m)^    ([^\n]+?):(?:\s+([&*][^\n]+))?\n')

          @dataclass
          class Entry:
              key: str
              text: str

          class Section:
              def __init__(self, body: str):
                  matches = list(ENTRY.finditer(body))
                  if not matches:
                      self.preamble = body
                      self.entries: list[Entry] = []
                      return
                  self.preamble = body[:matches[0].start()]
                  self.entries = []
                  for i, match in enumerate(matches):
                      end = matches[i + 1].start() if i + 1 < len(matches) else len(body)
                      self.entries.append(Entry(match.group(1), body[match.start():end]))

              def find(self, key: str) -> Entry | None:
                  return next((e for e in self.entries if e.key == key), None)

              def require(self, key: str) -> Entry:
                  entry = self.find(key)
                  if entry is None:
                      raise RuntimeError(f'missing semantic entry: {key}')
                  return entry

              def rename(self, old: str, new: str) -> None:
                  entry = self.require(old)
                  if self.find(new) is not None:
                      raise RuntimeError(f'destination already exists: {new}')
                  entry.text = entry.text.replace(f'  {old}:\n', f'  {new}:\n', 1)
                  entry.key = new

              def remove(self, key: str) -> None:
                  entry = self.require(key)
                  self.entries.remove(entry)

              def add_or_merge(self, key: str, lines: list[str]) -> None:
                  if not lines:
                      return
                  existing = self.find(key)
                  if existing is None:
                      text = f'  {key}:\n' + ''.join(lines)
                      if not text.endswith('\n'):
                          text += '\n'
                      self.entries.append(Entry(key, text))
                      return
                  present = set(mapping_refs(existing.text))
                  additions = [line for line in lines if raw_ref_from_mapping_line(line) not in present]
                  if not additions:
                      return
                  suffix = '' if existing.text.endswith('\n') else '\n'
                  existing.text += suffix + ''.join(additions)

              def render(self) -> str:
                  return self.preamble + ''.join(e.text for e in self.entries)

          class Document:
              def __init__(self, path: Path):
                  self.path = path
                  text = path.read_text()
                  marker_m = 'mappings:\n'
                  marker_t = 'transforms:\n'
                  m = text.index(marker_m)
                  t = text.index(marker_t, m + len(marker_m))
                  self.before = text[:m + len(marker_m)]
                  self.mappings = Section(text[m + len(marker_m):t])
                  self.transform_header = marker_t
                  self.transforms = Section(text[t + len(marker_t):])

              def rename(self, old: str, new: str) -> None:
                  self.mappings.rename(old, new)
                  if self.transforms.find(old) is not None:
                      self.transforms.rename(old, new)

              def remove(self, key: str) -> None:
                  self.mappings.remove(key)
                  if self.transforms.find(key) is not None:
                      self.transforms.remove(key)

              def save(self) -> None:
                  self.path.write_text(
                      self.before + self.mappings.render() + self.transform_header + self.transforms.render()
                  )

          def mapping_refs(block: str) -> list[str]:
              return [line[4:].strip() for line in block.splitlines() if line.startswith('  - ')]

          def raw_ref_from_mapping_line(line: str) -> str:
              return line[4:].strip() if line.startswith('  - ') else line.strip()

          def mapping_lines_for(entry: Entry, payloads: set[str]) -> list[str]:
              result = []
              for raw in mapping_refs(entry.text):
                  if raw.split('#', 1)[0] in payloads:
                      result.append(f'  - {raw}\n')
              return result

          def transform_children(block: str) -> dict[str, str]:
              matches = list(CHILD.finditer(block))
              result: dict[str, str] = {}
              for i, match in enumerate(matches):
                  end = matches[i + 1].start() if i + 1 < len(matches) else len(block)
                  raw = match.group(1)
                  marker = match.group(2)
                  child = block[match.start():end]
                  # Do not duplicate YAML anchor declarations. A copied transform can
                  # refer to the already-defined source transform by alias instead.
                  if marker and marker.startswith('&'):
                      child = f'    {raw}: *{marker[1:]}\n'
                  result[raw] = child
              return result

          def copy_refs(doc: Document, src: str, dst: str, payloads: set[str]) -> None:
              src_map = doc.mappings.require(src)
              selected = [raw for raw in mapping_refs(src_map.text) if raw.split('#', 1)[0] in payloads]
              doc.mappings.add_or_merge(dst, [f'  - {raw}\n' for raw in selected])
              src_transform = doc.transforms.find(src)
              if src_transform is None:
                  return
              children = transform_children(src_transform.text)
              chosen = [children[raw] for raw in selected if raw in children]
              if chosen:
                  doc.transforms.add_or_merge(dst, chosen)

          def copy_point_sources(
              doc: Document,
              src_record: str,
              dst_record: str,
              payloads: set[str],
              roots: set[str],
          ) -> None:
              snapshot = list(doc.mappings.entries)
              prefix = src_record + '.'
              for entry in snapshot:
                  if not entry.key.startswith(prefix):
                      continue
                  suffix = entry.key[len(prefix):]
                  if suffix.split('.', 1)[0] not in roots:
                      continue
                  selected = [raw for raw in mapping_refs(entry.text) if raw.split('#', 1)[0] in payloads]
                  if not selected:
                      continue
                  dst = dst_record + '.' + suffix
                  doc.mappings.add_or_merge(dst, [f'  - {raw}\n' for raw in selected])
                  src_transform = doc.transforms.find(entry.key)
                  if src_transform is None:
                      continue
                  children = transform_children(src_transform.text)
                  chosen = [children[raw] for raw in selected if raw in children]
                  if chosen:
                      doc.transforms.add_or_merge(dst, chosen)

          # Fink / ZTF -------------------------------------------------------
          d = Document(FILES['fink_ztf'])
          d.rename(
              'detection@ztf:fink.photometry.{filter}.limit.upper_limit',
              'detection@ztf:fink.photometry.{filter}.upper_limit',
          )
          d.rename('lightcurve@fink.g.feature_vector', 'lightcurve@fink.feature_vector.g.value')
          d.rename('lightcurve@fink.r.feature_vector', 'lightcurve@fink.feature_vector.r.value')
          d.rename(
              'summary@ztf:fink.photometry.{filter}',
              'lightcurve@fink.magnitude_rate_points.photometry.{filter}',
          )
          d.rename(
              'summary@ztf:fink.photometry.{filter}.mag.rate',
              'lightcurve@fink.magnitude_rate_points.photometry.{filter}.mag.rate',
          )
          d.rename(
              'summary@ztf:fink.photometry.{filter}.mag.rate_error',
              'lightcurve@fink.magnitude_rate_points.photometry.{filter}.mag.rate_error',
          )
          copy_refs(d, 'detection@ztf:fink.time.mjd', 'lightcurve@fink.magnitude_rate_points.time.mjd', {'objects', 'latests'})
          copy_refs(d, 'detection@ztf:fink.identity.source_id', 'lightcurve@fink.magnitude_rate_points.identity.source_id', {'objects', 'latests'})
          for tail in ('diff', 'error', 'rate', 'rate_error'):
              d.rename(
                  f'summary@ztf:fink.color.g-r.{tail}',
                  f'lightcurve@fink.color_points.color.g-r.{tail}',
              )
          copy_refs(d, 'detection@ztf:fink.time.mjd', 'lightcurve@fink.color_points.time.mjd', {'objects', 'latests'})
          copy_refs(d, 'detection@ztf:fink.identity.source_id', 'lightcurve@fink.color_points.identity.source_id', {'objects', 'latests'})
          for key in (
              'lightcurve@fink.{filter}.rate_lower_percentile',
              'lightcurve@fink.{filter}.rate_upper_percentile',
              'lightcurve@fink.{filter}.delta_time_rate',
              'lightcurve@fink.{filter}.from_upper_limit',
              'lightcurve@fink.{filter}',
              'lightcurve@fink.{filter}.magnitude_rate',
              'lightcurve@fink.{filter}.magnitude_rate_error',
          ):
              d.remove(key)
          copy_point_sources(
              d,
              'detection@ztf:fink',
              'lightcurve@ztf:fink.points',
              {'objects'},
              {'time', 'identity', 'quality', 'provenance', 'photometry'},
          )
          d.save()

          # Fink / LSST ------------------------------------------------------
          d = Document(FILES['fink_lsst'])
          copy_point_sources(
              d,
              'detection@lsst:fink',
              'lightcurve@lsst:fink.points',
              {'sources'},
              {'time', 'identity', 'quality', 'provenance', 'photometry'},
          )
          copy_point_sources(
              d,
              'detection@lsst:fink',
              'lightcurve@lsst:fink.forced_photometry_points',
              {'fp'},
              {'time', 'identity', 'quality', 'provenance', 'forced_photometry'},
          )
          d.save()

          # ALeRCE / ZTF -----------------------------------------------------
          d = Document(FILES['alerce_ztf'])
          copy_point_sources(
              d,
              'detection@ztf:alerce',
              'lightcurve@ztf:alerce.points',
              {'query_lightcurve.detections', 'query_lightcurve.non_detections'},
              {'time', 'identity', 'quality', 'provenance', 'photometry'},
          )
          copy_point_sources(
              d,
              'detection@ztf:alerce',
              'lightcurve@ztf:alerce.forced_photometry_points',
              {'query_forced_photometry'},
              {'time', 'identity', 'quality', 'provenance', 'forced_photometry'},
          )
          d.save()

          # ALeRCE / LSST ----------------------------------------------------
          d = Document(FILES['alerce_lsst'])
          copy_point_sources(
              d,
              'detection@lsst:alerce',
              'lightcurve@lsst:alerce.points',
              {'query_lightcurve.detections', 'query_lightcurve.non_detections'},
              {'time', 'identity', 'quality', 'provenance', 'photometry'},
          )
          copy_point_sources(
              d,
              'detection@lsst:alerce',
              'lightcurve@lsst:alerce.forced_photometry_points',
              {'query_forced_photometry', 'query_lightcurve.forced_photometry'},
              {'time', 'identity', 'quality', 'provenance', 'forced_photometry'},
          )
          d.save()

          # Lasair / ZTF -----------------------------------------------------
          d = Document(FILES['lasair_ztf'])
          d.remove('detection@ztf:lasair.photometry.{filter}.limit.upper_limit')
          copy_point_sources(
              d,
              'detection@ztf:lasair',
              'lightcurve@ztf:lasair.points',
              {'lightcurve_candidates'},
              {'time', 'identity', 'quality', 'provenance', 'photometry'},
          )
          d.save()

          # ANTARES / ZTF ----------------------------------------------------
          d = Document(FILES['antares_ztf'])
          d.rename(
              'detection@ztf:antares.photometry.{filter}.limit.upper_limit',
              'detection@ztf:antares.photometry.{filter}.upper_limit',
          )
          d.save()

          print('Applied targeted mapping edits without YAML reserialization.')
          PY
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML 'pydantic==2.11.7' 'python-dotenv==1.1.1'
      - name: Validate mappings and focused providers
        run: |
          git diff --check
          PYTHONPATH=. python -m alertissimo.data_layer.runtime.mapping_schema --all
          PYTHONPATH=. pytest -q \
            tests/test_mapping_schema.py \
            tests/test_semantic_paths.py \
            tests/test_semantic_model_validation.py \
            tests/test_fink_ztf_authoritative_payloads.py \
            tests/test_fink_lsst_authoritative_payloads.py \
            tests/test_alerce_ztf_authoritative_payloads.py \
            tests/test_alerce_lsst_authoritative_payloads.py \
            tests/test_lasair_ztf_authoritative_payloads.py \
            tests/test_antares_ztf_authoritative_payloads.py
      - name: Show final mapping diff
        if: always()
        run: |
          git status --short
          git diff --stat
      - name: Commit minimal mapping changes
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alertissimo/data_layer/providers/fink/ztf/mappings.yaml \
            alertissimo/data_layer/providers/fink/lsst/mappings.yaml \
            alertissimo/data_layer/providers/alerce/ztf/mappings.yaml \
            alertissimo/data_layer/providers/alerce/lsst/mappings.yaml \
            alertissimo/data_layer/providers/lasair/ztf/mappings.yaml \
            alertissimo/data_layer/providers/antares/ztf/mappings.yaml
          git commit -m 'Tighten time-series mapping rehome diff'
          git push origin HEAD:agent/time-series-mapping-rehome
