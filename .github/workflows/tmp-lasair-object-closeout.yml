name: Temporary Lasair object accounting close-out

on:
  push:
    branches:
      - audit/lasair-ztf-object-tns-closeout
    paths:
      - tools/_tmp_lasair_object_tns_closeout.py
      - .github/workflows/tmp-lasair-object-closeout.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lasair-ztf-object-tns-closeout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML pytest 'pydantic==2.11.7'
      - name: Apply close-out migration
        run: python tools/_tmp_lasair_object_tns_closeout.py
      - name: Validate Lasair and semantic registry
        run: |
          PYTHONPATH=. pytest -q tests/test_lasair_ztf_live_capture.py tests/test_lasair_registry_architecture.py tests/test_mapping_schema.py tests/test_semantic_paths.py tests/test_semantic_model_validation.py tests/test_semantic_record_builder.py
          PYTHONPATH=. python -m alertissimo.data_layer.runtime.mapping_schema --all
      - name: Commit generated semantic changes and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- alertissimo/data_layer/providers/lasair/ztf/mappings.yaml alertissimo/data_layer/providers/lasair/ztf/unmapped_fields.yaml tests/test_lasair_ztf_live_capture.py
          git rm -- tools/_tmp_lasair_object_tns_closeout.py .github/workflows/tmp-lasair-object-closeout.yml
          git diff --cached --check
          git commit -m 'Close authoritative Lasair ZTF object accounting'
          git push origin HEAD:audit/lasair-ztf-object-tns-closeout
