    type: array
    items:
      $ref: <_color_point>

  <feature_vector_points>:
    description: "Feature-vector snapshots derived from the time series at reported epochs"
    type: array
    items:
      $ref: <_feature_vector_point>

  [detection_count]:
    description: "Number of detections in the time-series history"
    type: integer

