transforms:
  lightcurve@lsst:antares.points.photometry.{filter}:
    locus_alerts#properties.lsst_diaSource_band:
      type: value_map
      map:
        g: g
        r: r
        i: i
        z: z
      default: null
      skip_null: true
      note: Strict observed LSST band binding.
  measurement@lsst:antares.solar_system.identity.object_id:
    locus_alerts#properties.lsst_diaSource_ssObjectId:
      type: value_map
      map: {0: null}
      skip_null: true
  measurement@lsst:antares.image_metrics.trail.algorithm:
    locus_alerts#properties.lsst_diaSource_trailAlgorithm:
      type: value_map
      map: {1: sdss_shape, 2: hsm_shape}
      default: null
      skip_null: true
  measurement@lsst:antares.image_metrics.trail.fit_failed:
    locus_alerts#properties.lsst_diaSource_trail_flag:
      type: value_map
      map: {false: false, true: true}
      default: null
      skip_null: true
  summary@lsst:antares.identity.object_id:
    locus#properties.survey.lsst.dia_object_id.0:
      type: to_int
    locus_by_id#properties.survey.lsst.dia_object_id.0:
      type: to_int
    search_loci#properties.survey.lsst.dia_object_id.0:
      type: to_int
    cone_loci#properties.survey.lsst.dia_object_id.0:
      type: to_int
    locus_alerts#properties.lsst_diaObject_diaObjectId:
      type: to_int
  measurement@lsst:antares.photometry.{filter}:
    locus_alerts#properties.lsst_diaSource_band:
      type: value_map
      map:
        g: g
        r: r
        i: i
        z: z
      default: null
      skip_null: true
      note: Strict observed LSST band binding.
  measurement@lsst:antares.image_metrics.is_positive:
    locus_alerts#properties.lsst_diaSource_isNegative:
      type: boolean_not
      note: Invert the authoritative Python boolean only.
