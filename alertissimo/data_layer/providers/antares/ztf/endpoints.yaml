broker: antares
origin: ztf
endpoints:
  get_by_ztf_object_id:
    path: antares_client.search.get_by_ztf_object_id
    method: python
    description: Get one ANTARES locus by ZTF objectId using the official antares_client Python client.
    params:
      ztf_object_id:
        required: true
        type: string
        bind: target_id
        description: ZTF object identifier.
    output:
      type: object_or_null
      item: locus
    operation_types: [object_lookup, locus_lookup, object_summary]
    server_filters: [ztf_object_id]
    post_filter: false
    projection:
      supports_columns: false
  get_by_id:
    path: antares_client.search.get_by_id
    method: python
    description: Get one ANTARES locus by ANTARES locus_id using the official antares_client Python client.
    params:
      locus_id:
        required: true
        type: string
        description: ANTARES locus identifier.
    output:
      type: object_or_null
      item: locus
    operation_types: [locus_lookup, object_summary]
    server_filters: [locus_id]
    post_filter: false
    projection:
      supports_columns: false
  cone_search:
    path: antares_client.search.cone_search
    method: python
    description: Search ANTARES loci by sky coordinate and radius using the official antares_client Python client.
    params:
      center:
        required: true
        type: SkyCoord
        binding:
          roles: [ra, dec]
          adapter: alertissimo.data_layer.providers.antares_binding:skycoord_icrs_degrees
        description: Astropy SkyCoord cone-search center composed from canonical RA/Dec degrees.
      radius:
        required: true
        type: Angle
        bind: radius
        binding:
          adapter: alertissimo.data_layer.providers.antares_binding:angle_arcsec
        unit: arcsec
        description: Astropy Angle cone-search radius composed from canonical arcseconds.
    output:
      type: iterator
      item: locus
    operation_types: [spatial_search, locus_search, object_summary]
    server_filters: [center, radius]
    post_filter: false
    projection:
      supports_columns: false
  search:
    path: antares_client.search.search
    method: python
    description: Run an ANTARES Elasticsearch locus query using the official antares_client Python client.
    params:
      query:
        required: true
        type: dict
        description: Elasticsearch query dictionary with exactly one top-level query key.
    output:
      type: iterator
      item: locus
    operation_types: [locus_search, object_search, object_summary]
    server_filters: [query]
    post_filter: false
    projection:
      supports_columns: false
