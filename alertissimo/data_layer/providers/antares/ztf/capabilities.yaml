broker: antares
origin: ztf
predicate_bindings:
  search:
    # Numeric coordinate fields are shown in the official search tutorial.
    # Scope the mixed-survey index to the mapped ZTF object identity.
    - path: summary.position.ra
      operator: "="
      parameter: query
      elasticsearch: {field: ra, identity_field: properties.ztf_object_id}
    - path: summary.position.ra
      operator: "<"
      parameter: query
      elasticsearch: {field: ra, identity_field: properties.ztf_object_id}
    - path: summary.position.ra
      operator: "<="
      parameter: query
      elasticsearch: {field: ra, identity_field: properties.ztf_object_id}
    - path: summary.position.ra
      operator: ">"
      parameter: query
      elasticsearch: {field: ra, identity_field: properties.ztf_object_id}
    - path: summary.position.ra
      operator: ">="
      parameter: query
      elasticsearch: {field: ra, identity_field: properties.ztf_object_id}
    - path: summary.position.dec
      operator: "="
      parameter: query
      elasticsearch: {field: dec, identity_field: properties.ztf_object_id}
    - path: summary.position.dec
      operator: "<"
      parameter: query
      elasticsearch: {field: dec, identity_field: properties.ztf_object_id}
    - path: summary.position.dec
      operator: "<="
      parameter: query
      elasticsearch: {field: dec, identity_field: properties.ztf_object_id}
    - path: summary.position.dec
      operator: ">"
      parameter: query
      elasticsearch: {field: dec, identity_field: properties.ztf_object_id}
    - path: summary.position.dec
      operator: ">="
      parameter: query
      elasticsearch: {field: dec, identity_field: properties.ztf_object_id}
recipes:
  semantic_search:
    - calls:
        - endpoint: search
    - calls:
        - endpoint: search
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: {call: 0, path: summary.identity.object_id}}
      time_selection:
        mode: detection
        method: material
        call: 1
        payload: locus_alerts
        complete: true
        time_scale: utc
        detection_identity: detection.identity.source_id
  confirm:
    - calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
  cone_search:
    - calls:
        - endpoint: cone_search
          params:
            center:
              from: {ra: step.ra, dec: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
  get_crossmatch:
    - calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
