broker: antares
origin: ztf
recipes:
  confirm:
    - calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
  cone_search:
    - calls:
        - endpoint: cone_search
          params:
            center:
              from: {ra: step.ra, dec: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
  get_crossmatch:
    - calls:
        - endpoint: get_by_ztf_object_id
          params:
            ztf_object_id: {from: step.target.ids}
