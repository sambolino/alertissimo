broker: lasair
origin: lsst
recipes:
  confirm:
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_object
          params:
            objectId: {from: step.target.ids}
  cone_search:
    - calls:
        - endpoint: cone
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
  get_classification:
    # Object context supplies the mapped Sherlock reliability as well as class
    # and description. The singular native route fans out for multiple targets.
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
  get_crossmatch:
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_object
          params:
            objectId: {from: step.target.ids}
