broker: lasair
origin: ztf
recipes:
  semantic_search:
    - calls:
        - endpoint: query
          params:
            selected:
              value: objects.objectId,objects.ramean,objects.decmean,objects.ncand,objects.jdmin,objects.jdmax
            tables: {value: objects}
  confirm:
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: objects
          params:
            objectIds: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_objects
          params:
            objectIds: {from: step.target.ids}
    - calls:
        - endpoint: lightcurves
          params:
            objectIds: {from: step.target.ids}
  cone_search:
    - calls:
        - endpoint: cone
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
        - endpoint: query
          required: false
          params:
            conditions:
              from: {call: 0, path: summary.identity.object_id}
            selected:
              value: objects.objectId,objects.ramean,objects.decmean,objects.ncand,objects.jdmin,objects.jdmax
            tables: {value: objects}
            limit: {value: 100}
            offset: {value: 0}
  get_lightcurve:
    - calls:
        - endpoint: lightcurves
          params:
            objectIds: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - target_kind: object
      calls:
        - endpoint: objects
          params:
            objectIds: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: objects
          params:
            objectIds: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_objects
          params:
            objectIds: {from: step.target.ids}
  get_crossmatch:
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: objects
          params:
            objectIds: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_objects
          params:
            objectIds: {from: step.target.ids}

# Numeric object summaries only. Conditions are compiled from these declarations,
# never supplied as target IDs. Every comparison operator is explicit.
predicate_bindings:
  query:
    - path: summary.detection_count
      operator: "="
      parameter: conditions
      sql: {column: objects.ncand, subtract: 0, order_by: objects.objectId}
    - path: summary.detection_count
      operator: "<"
      parameter: conditions
      sql: {column: objects.ncand, subtract: 0, order_by: objects.objectId}
    - path: summary.detection_count
      operator: "<="
      parameter: conditions
      sql: {column: objects.ncand, subtract: 0, order_by: objects.objectId}
    - path: summary.detection_count
      operator: ">"
      parameter: conditions
      sql: {column: objects.ncand, subtract: 0, order_by: objects.objectId}
    - path: summary.detection_count
      operator: ">="
      parameter: conditions
      sql: {column: objects.ncand, subtract: 0, order_by: objects.objectId}
    - path: summary.time.first_mjd
      operator: "="
      parameter: conditions
      sql: {column: objects.jdmin, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.first_mjd
      operator: "<"
      parameter: conditions
      sql: {column: objects.jdmin, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.first_mjd
      operator: "<="
      parameter: conditions
      sql: {column: objects.jdmin, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.first_mjd
      operator: ">"
      parameter: conditions
      sql: {column: objects.jdmin, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.first_mjd
      operator: ">="
      parameter: conditions
      sql: {column: objects.jdmin, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.last_mjd
      operator: "="
      parameter: conditions
      sql: {column: objects.jdmax, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.last_mjd
      operator: "<"
      parameter: conditions
      sql: {column: objects.jdmax, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.last_mjd
      operator: "<="
      parameter: conditions
      sql: {column: objects.jdmax, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.last_mjd
      operator: ">"
      parameter: conditions
      sql: {column: objects.jdmax, subtract: 2400000.5, order_by: objects.objectId}
    - path: summary.time.last_mjd
      operator: ">="
      parameter: conditions
      sql: {column: objects.jdmax, subtract: 2400000.5, order_by: objects.objectId}
