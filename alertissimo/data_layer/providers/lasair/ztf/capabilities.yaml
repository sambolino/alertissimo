broker: lasair
origin: ztf
recipes:
  cone_search:
    - calls:
        - endpoint: cone
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
        - endpoint: query
          required: false
          params:
            conditions:
              from: {call: 0, path: summary.identity.object_id}
            selected:
              value: objects.objectId,objects.ramean,objects.decmean,objects.ncand,objects.jdmin,objects.jdmax
            tables: {value: objects}
            limit: {value: 100}
            offset: {value: 0}
  get_lightcurve:
    - calls:
        - endpoint: lightcurves
          params:
            objectIds: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - target_kind: object
      calls:
        - endpoint: objects
          params:
            objectIds: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: objects
          params:
            objectIds: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_object
          params:
            objectId: {from: step.target.ids}
    - calls:
        - endpoint: sherlock_objects
          params:
            objectIds: {from: step.target.ids}
