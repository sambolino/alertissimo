broker: lasair
origin: ztf
description: Minimal semantic mappings for fields returned by the Lasair ZTF REST API.

payloads:
  object: {endpoint: object, path: "."}
  objects: {endpoint: objects, path: "[]"}
  query: {endpoint: query, path: "[]"}
  cone: {endpoint: cone, path: "[]"}
  candidates: {endpoint: object, path: "candidates[]"}
  lightcurve_candidates: {endpoint: lightcurves, path: "[].candidates[]"}
  sherlock_position_classifications: {endpoint: sherlock_position, path: "classifications{}"}
  sherlock_objects_classifications: {endpoint: sherlock_objects, path: "[].classifications{}"}
  sherlock_position_crossmatches: {endpoint: sherlock_position, path: "crossmatches[]"}
  sherlock_objects_crossmatches: {endpoint: sherlock_objects, path: "[].crossmatches[]"}

mappings:
  summary@ztf:lasair.identity.object_id:
    - object#objectId
    - objects#objectId
    - cone#object
    - query#objectId
  summary@ztf:lasair.detection_count:
    - object#objectData.ncand
    - objects#objectData.ncand
  summary@ztf:lasair.time.first_mjd:
    - object#objectData.jdmin
    - objects#objectData.jdmin
  summary@ztf:lasair.time.last_mjd:
    - object#objectData.jdmax
    - objects#objectData.jdmax
  summary@ztf:lasair.position.ra:
    - object#objectData.ramean
    - objects#objectData.ramean
    - query#ramean
  summary@ztf:lasair.position.dec:
    - object#objectData.decmean
    - objects#objectData.decmean
    - query#decmean
  detection@ztf:lasair.identity.source_id:
    - candidates#candid
    - lightcurve_candidates#candid
  detection@ztf:lasair.time.mjd:
    - candidates#jd
    - lightcurve_candidates#jd
  detection@ztf:lasair.position.ra:
    - candidates#ra
    - lightcurve_candidates#ra
  detection@ztf:lasair.position.dec:
    - candidates#dec
    - lightcurve_candidates#dec
  detection@ztf:lasair.photometry.{filter}:
    - candidates#fid
    - lightcurve_candidates#fid
  detection@ztf:lasair.photometry.{filter}.psf.mag:
    - candidates#magpsf
    - lightcurve_candidates#magpsf
  detection@ztf:lasair.photometry.{filter}.psf.mag.error:
    - candidates#sigmapsf
    - lightcurve_candidates#sigmapsf
  detection@ztf:lasair.photometry.{filter}.limit.mag:
    - candidates#diffmaglim
  detection@ztf:lasair.reference_image.nearest_source.photometry.{filter}.mag:
    - candidates#magnr
    - lightcurve_candidates#magnr
  detection@ztf:lasair.reference_image.nearest_source.photometry.{filter}.mag.error:
    - candidates#sigmagnr
    - lightcurve_candidates#sigmagnr
  detection@ztf:lasair.calibration.{filter}.zero_point:
    - candidates#magzpsci
    - lightcurve_candidates#magzpsci
  detection@ztf:lasair.quality.real_bogus:
    - candidates#drb
    - lightcurve_candidates#drb
  detection@ztf:lasair.image_metrics.is_positive:
    - candidates#isdiffpos
    - lightcurve_candidates#isdiffpos
  classification@sherlock:lasair.best.class:
    - object#sherlock.classification
    - sherlock_position_classifications#_value.0
    - sherlock_objects_classifications#_value.0
  classification@sherlock:lasair.best.score:
    - object#sherlock.classificationReliability
  classification@tns:lasair.best.class:
    - object#TNS.type
  classification@sherlock:lasair.best.description:
    - object#sherlock.description
    - sherlock_position_classifications#_value.1
    - sherlock_objects_classifications#_value.1
  crossmatch@{producer}:lasair.identity.object_id:
    - object#sherlock.catalogue_object_id
    - sherlock_position_crossmatches#catalogue_object_id
    - sherlock_objects_crossmatches#catalogue_object_id
  crossmatch@{producer}:lasair.provenance.producer.name:
    - object#sherlock.catalogue_table_name
    - sherlock_position_crossmatches#catalogue_table_name
    - sherlock_objects_crossmatches#catalogue_table_name
  crossmatch@{producer}:lasair.provenance.producer.id:
    - object#sherlock.catalogue_table_name
    - sherlock_position_crossmatches#catalogue_table_name
    - sherlock_objects_crossmatches#catalogue_table_name
  crossmatch@{producer}:lasair.position.ra:
    - object#sherlock.raDeg
    - sherlock_position_crossmatches#raDeg
    - sherlock_objects_crossmatches#raDeg
  crossmatch@{producer}:lasair.position.dec:
    - object#sherlock.decDeg
    - sherlock_position_crossmatches#decDeg
    - sherlock_objects_crossmatches#decDeg
  crossmatch@{producer}:lasair.separation.total:
    - object#sherlock.separationArcsec
    - sherlock_position_crossmatches#separationArcsec
    - sherlock_objects_crossmatches#separationArcsec
  crossmatch@{producer}:lasair.separation.north:
    - object#sherlock.northSeparationArcsec
    - sherlock_position_crossmatches#northSeparationArcsec
    - sherlock_objects_crossmatches#northSeparationArcsec
  crossmatch@{producer}:lasair.separation.east:
    - object#sherlock.eastSeparationArcsec
    - sherlock_position_crossmatches#eastSeparationArcsec
    - sherlock_objects_crossmatches#eastSeparationArcsec
  crossmatch@{producer}:lasair.separation.projected:
    - object#sherlock.physical_separation_kpc
    - sherlock_position_crossmatches#physical_separation_kpc
    - sherlock_objects_crossmatches#physical_separation_kpc
  crossmatch@{producer}:lasair.redshift.value:
    - object#sherlock.z
    - sherlock_position_crossmatches#z
    - sherlock_objects_crossmatches#z
  crossmatch@{producer}:lasair.distance.estimate.best.value:
    - sherlock_position_crossmatches#best_distance
    - sherlock_objects_crossmatches#best_distance
  crossmatch@{producer}:lasair.distance.estimate.best.source:
    - sherlock_position_crossmatches#best_distance_source
    - sherlock_objects_crossmatches#best_distance_source
  crossmatch@{producer}:lasair.distance.estimate.best.flag:
    - sherlock_position_crossmatches#best_distance_flag
    - sherlock_objects_crossmatches#best_distance_flag
  crossmatch@{producer}:lasair.distance.estimate.redshift.value:
    - sherlock_position_crossmatches#z_distance
    - sherlock_objects_crossmatches#z_distance
  crossmatch@{producer}:lasair.distance.estimate.redshift.modulus:
    - sherlock_position_crossmatches#z_distance_modulus
    - sherlock_objects_crossmatches#z_distance_modulus
  crossmatch@{producer}:lasair.distance.estimate.redshift.scale:
    - sherlock_position_crossmatches#z_distance_scale
    - sherlock_objects_crossmatches#z_distance_scale
  crossmatch@{producer}:lasair.distance.estimate.redshift.source:
    - sherlock_position_crossmatches#z_distance_cat
    - sherlock_objects_crossmatches#z_distance_cat
  crossmatch@{producer}:lasair.distance.estimate.photometric_redshift.value:
    - sherlock_position_crossmatches#pz_distance
    - sherlock_objects_crossmatches#pz_distance
  crossmatch@{producer}:lasair.distance.estimate.photometric_redshift.modulus:
    - sherlock_position_crossmatches#pz_distance_modulus
    - sherlock_objects_crossmatches#pz_distance_modulus
  crossmatch@{producer}:lasair.distance.estimate.photometric_redshift.scale:
    - sherlock_position_crossmatches#pz_distance_scale
    - sherlock_objects_crossmatches#pz_distance_scale
  crossmatch@{producer}:lasair.distance.estimate.photometric_redshift.source:
    - sherlock_position_crossmatches#pz_distance_cat
    - sherlock_objects_crossmatches#pz_distance_cat
  crossmatch@{producer}:lasair.distance.estimate.direct.value:
    - sherlock_position_crossmatches#direct_distance
    - sherlock_objects_crossmatches#direct_distance
  crossmatch@{producer}:lasair.distance.estimate.direct.modulus:
    - sherlock_position_crossmatches#direct_distance_modulus
    - sherlock_objects_crossmatches#direct_distance_modulus
  crossmatch@{producer}:lasair.distance.estimate.direct.scale:
    - sherlock_position_crossmatches#direct_distance_scale
    - sherlock_objects_crossmatches#direct_distance_scale
  crossmatch@{producer}:lasair.distance.estimate.direct.source:
    - sherlock_position_crossmatches#direct_distance_cat
    - sherlock_objects_crossmatches#direct_distance_cat
  crossmatch@{producer}:lasair.rank:
    - sherlock_position_crossmatches#rank
    - sherlock_objects_crossmatches#rank
  crossmatch@{producer}:lasair.classification.assessment.catalogue.class:
    - object#sherlock.catalogue_object_type
    - sherlock_position_crossmatches#catalogue_object_type
    - sherlock_objects_crossmatches#catalogue_object_type
  crossmatch@{producer}:lasair.classification.assessment.sherlock.class:
    - object#sherlock.association_type
    - sherlock_position_crossmatches#association_type
    - sherlock_objects_crossmatches#association_type
    - sherlock_position_crossmatches#classification
    - sherlock_objects_crossmatches#classification
  crossmatch@{producer}:lasair.classification.assessment.sherlock.score:
    - object#sherlock.classificationReliability
    - sherlock_position_crossmatches#classificationReliability
    - sherlock_objects_crossmatches#classificationReliability
  crossmatch@{producer}:lasair.classification.assessment.sherlock.method:
    - object#sherlock.search_name
    - sherlock_position_crossmatches#search_name
    - sherlock_objects_crossmatches#search_name
  crossmatch@{producer}:lasair.photometry.J.mag:
    - sherlock_position_crossmatches#J
    - sherlock_objects_crossmatches#J
  crossmatch@{producer}:lasair.photometry.J.mag.error:
    - sherlock_position_crossmatches#JErr
    - sherlock_objects_crossmatches#JErr
  crossmatch@{producer}:lasair.photometry.H.mag:
    - sherlock_position_crossmatches#H
    - sherlock_objects_crossmatches#H
  crossmatch@{producer}:lasair.photometry.H.mag.error:
    - sherlock_position_crossmatches#HErr
    - sherlock_objects_crossmatches#HErr
  crossmatch@{producer}:lasair.photometry.K.mag:
    - sherlock_position_crossmatches#K
    - sherlock_objects_crossmatches#K
  crossmatch@{producer}:lasair.photometry.K.mag.error:
    - sherlock_position_crossmatches#KErr
    - sherlock_objects_crossmatches#KErr
  crossmatch@{producer}:lasair.photometry.u.mag:
    - sherlock_position_crossmatches#_u
    - sherlock_objects_crossmatches#_u
  crossmatch@{producer}:lasair.photometry.u.mag.error:
    - sherlock_position_crossmatches#_uErr
    - sherlock_objects_crossmatches#_uErr
  crossmatch@{producer}:lasair.photometry.g.mag:
    - sherlock_position_crossmatches#_g
    - sherlock_objects_crossmatches#_g
  crossmatch@{producer}:lasair.photometry.g.mag.error:
    - sherlock_position_crossmatches#_gErr
    - sherlock_objects_crossmatches#_gErr
  crossmatch@{producer}:lasair.photometry.r.mag:
    - sherlock_position_crossmatches#_r
    - sherlock_objects_crossmatches#_r
  crossmatch@{producer}:lasair.photometry.r.mag.error:
    - sherlock_position_crossmatches#_rErr
    - sherlock_objects_crossmatches#_rErr
  crossmatch@{producer}:lasair.photometry.i.mag:
    - sherlock_position_crossmatches#_i
    - sherlock_objects_crossmatches#_i
  crossmatch@{producer}:lasair.photometry.i.mag.error:
    - sherlock_position_crossmatches#_iErr
    - sherlock_objects_crossmatches#_iErr
  crossmatch@{producer}:lasair.photometry.z.mag:
    - sherlock_position_crossmatches#_z
    - sherlock_objects_crossmatches#_z
  crossmatch@{producer}:lasair.photometry.z.mag.error:
    - sherlock_position_crossmatches#_zErr
    - sherlock_objects_crossmatches#_zErr
  crossmatch@{producer}:lasair.photometry.y.mag:
    - sherlock_position_crossmatches#_y
    - sherlock_objects_crossmatches#_y
  crossmatch@{producer}:lasair.photometry.y.mag.error:
    - sherlock_position_crossmatches#_yErr
    - sherlock_objects_crossmatches#_yErr
  crossmatch@tns:lasair.identity.object_id:
    - object#TNS.name
  crossmatch@tns:lasair.position.ra:
    - object#TNS.ra
  crossmatch@tns:lasair.position.dec:
    - object#TNS.decl
  crossmatch@tns:lasair.redshift.value:
    - object#TNS.z

transforms:
  classification@sherlock:lasair.best.score:
    object#sherlock.classificationReliability: {type: to_float, skip_null: true}
  summary@ztf:lasair.time.first_mjd:
    object#objectData.jdmin:
      type: jd_to_mjd
    objects#objectData.jdmin:
      type: jd_to_mjd
  summary@ztf:lasair.time.last_mjd:
    object#objectData.jdmax:
      type: jd_to_mjd
    objects#objectData.jdmax:
      type: jd_to_mjd
  detection@ztf:lasair.time.mjd:
    candidates#jd:
      type: jd_to_mjd
    lightcurve_candidates#jd:
      type: jd_to_mjd
  detection@ztf:lasair.photometry.{filter}:
    candidates#fid:
      type: value_map
      map:
        1: g
        2: r
        3: i
    lightcurve_candidates#fid:
      type: value_map
      map:
        1: g
        2: r
        3: i
  detection@ztf:lasair.image_metrics.is_positive:
    candidates#isdiffpos:
      type: value_map
      map:
        t: true
        f: false
    lightcurve_candidates#isdiffpos:
      type: value_map
      map:
        t: true
        f: false
  crossmatch@{producer}:lasair.identity.object_id:
    object#sherlock.catalogue_object_id:
      type: to_string_strip
    sherlock_position_crossmatches#catalogue_object_id:
      type: to_string_strip
    sherlock_objects_crossmatches#catalogue_object_id:
      type: to_string_strip
  crossmatch@{producer}:lasair.provenance.producer.id:
    object#sherlock.catalogue_table_name: &producer_map
      type: value_map
      map:
        SDSS: sdss
        SDSS/2MASS/PS1: sdss_2mass_ps1
        2MASS PSC: twomass
        PanSTARRS DR1: panstarrs
        SDSS DR12 PhotoObjAll Table: sdss
        SDSS/MILLIQUAS/GAIA/DESI/PS1: sdss_milliquas_gaia_desi_ps1
        Million Quasars (MILLIQUAS) Catalog v8.0: milliquas
        Gaia DR3: gaia
        DESI Legacy Survey DR10: desi_legacy_survey
    sherlock_position_crossmatches#catalogue_table_name:
      <<: *producer_map
    sherlock_objects_crossmatches#catalogue_table_name:
      <<: *producer_map
  crossmatch@{producer}:lasair.position.ra:
    object#sherlock.raDeg: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#raDeg: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#raDeg: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.position.dec:
    object#sherlock.decDeg: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#decDeg: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#decDeg: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.separation.total:
    object#sherlock.separationArcsec: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#separationArcsec: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#separationArcsec: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.separation.north:
    object#sherlock.northSeparationArcsec: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#northSeparationArcsec: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#northSeparationArcsec: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.separation.east:
    object#sherlock.eastSeparationArcsec: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#eastSeparationArcsec: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#eastSeparationArcsec: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.separation.projected:
    object#sherlock.physical_separation_kpc: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#physical_separation_kpc: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#physical_separation_kpc: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.redshift.value:
    object#sherlock.z: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#z: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#z: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.best.value:
    sherlock_position_crossmatches#best_distance: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#best_distance: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.redshift.value:
    sherlock_position_crossmatches#z_distance: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#z_distance: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.redshift.modulus:
    sherlock_position_crossmatches#z_distance_modulus: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#z_distance_modulus: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.redshift.scale:
    sherlock_position_crossmatches#z_distance_scale: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#z_distance_scale: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.photometric_redshift.value:
    sherlock_position_crossmatches#pz_distance: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#pz_distance: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.photometric_redshift.modulus:
    sherlock_position_crossmatches#pz_distance_modulus: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#pz_distance_modulus: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.photometric_redshift.scale:
    sherlock_position_crossmatches#pz_distance_scale: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#pz_distance_scale: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.direct.value:
    sherlock_position_crossmatches#direct_distance: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#direct_distance: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.direct.modulus:
    sherlock_position_crossmatches#direct_distance_modulus: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#direct_distance_modulus: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.distance.estimate.direct.scale:
    sherlock_position_crossmatches#direct_distance_scale: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#direct_distance_scale: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.rank:
    sherlock_position_crossmatches#rank: {type: to_int, skip_null: true}
    sherlock_objects_crossmatches#rank: {type: to_int, skip_null: true}
  crossmatch@{producer}:lasair.classification.assessment.sherlock.score:
    object#sherlock.classificationReliability: {type: to_float, skip_null: true}
    sherlock_position_crossmatches#classificationReliability: {type: to_float, skip_null: true}
    sherlock_objects_crossmatches#classificationReliability: {type: to_float, skip_null: true}
  crossmatch@{producer}:lasair.classification.assessment.sherlock.class:
    object#sherlock.association_type: {skip_null: true}
    sherlock_position_crossmatches#association_type: {skip_null: true}
    sherlock_objects_crossmatches#association_type: {skip_null: true}
    sherlock_position_crossmatches#classification: {skip_null: true}
    sherlock_objects_crossmatches#classification: {skip_null: true}
