broker: lasair
origin: ztf
notes: Explicit semantic-debt registry produced by the representative saved-payload audit.
unmapped:
  - cone#separation:
      reason: unsupported_semantic_concept
      candidate_meaning: Query-context angular separation is known in arcsec, but the summary record currently has no ontology-backed separation container/path for this value.
  - candidates#magpsf: &object_candidate_measurement
      reason: conditional_detection_presence_required
      candidate_meaning: Lasair object candidates mix detections and upper-limit rows; current Lasair documentation shows an upper-limit row with magpsf equal to diffmaglim and no candid, so magpsf cannot be treated as a measured PSF magnitude without row-level detection gating.
  - candidates#sigmapsf: *object_candidate_measurement
  - lightcurve_candidates#programid:
      reason: provider_native_implementation_identifier
      candidate_meaning: ZTF observing-program identifier, for which the ontology has no equivalent field.
  - object#image_urls.cutout:
      reason: raw_url_ui_only_value
      candidate_meaning: Lasair UI cutout link rather than scientific payload data.
  - object#sherlock.photoZ: &photometric_redshift
      reason: structural_multiple_redshift_estimates
      candidate_meaning: Sherlock photometric-redshift estimate. It must not be collapsed with the distinct z field into one redshift.value; the current ontology has no multi-estimate redshift structure.
  - sherlock_position_crossmatches#photoZ: *photometric_redshift
  - sherlock_objects_crossmatches#photoZ: *photometric_redshift
  - object#sherlock.photoZErr: &photometric_redshift_error
      reason: structural_multiple_redshift_estimates
      candidate_meaning: Uncertainty of Sherlock photoZ. It cannot safely populate redshift.error when redshift.value may come from the distinct z field.
  - sherlock_position_crossmatches#photoZErr: *photometric_redshift_error
  - sherlock_objects_crossmatches#photoZErr: *photometric_redshift_error
  - sherlock_position_classifications#_key: &classification_key
      reason: duplicate_execution_payload_context
      candidate_meaning: Native transient identifier used as the key of Sherlock's classification dictionary; portfolio context already identifies the transient.
  - sherlock_objects_classifications#_key: *classification_key
  - sherlock_position_crossmatches#catalogue_table_id: &catalogue_table_id
      reason: provider_native_implementation_identifier
      candidate_meaning: Internal Sherlock catalogue-table database identifier; producer name supplies the scientific provenance.
  - sherlock_objects_crossmatches#catalogue_table_id: *catalogue_table_id
  - sherlock_position_crossmatches#catalogue_view_id: &catalogue_view_id
      reason: provider_native_implementation_identifier
      candidate_meaning: Internal Sherlock catalogue-view database identifier.
  - sherlock_objects_crossmatches#catalogue_view_id: *catalogue_view_id
  - sherlock_position_crossmatches#catalogue_view_name: &catalogue_view_name
      reason: provider_native_implementation_metadata
      candidate_meaning: Sherlock implementation/search-view metadata, distinct from the scientific classification method in search_name.
  - sherlock_objects_crossmatches#catalogue_view_name: *catalogue_view_name
  - sherlock_position_crossmatches#major_axis_arcsec: &major_axis
      reason: unsupported_semantic_concept
      candidate_meaning: Catalogue-source apparent major axis; no same-meaning crossmatch morphology path exists.
  - sherlock_objects_crossmatches#major_axis_arcsec: *major_axis
  - sherlock_position_crossmatches#transient_object_id: &transient_id
      reason: duplicate_execution_payload_context
      candidate_meaning: Sherlock's native transient identifier; it is not the identity of the matched catalogue object.
  - sherlock_objects_crossmatches#transient_object_id: *transient_id
  - sherlock_position_crossmatches#original_search_radius_arcsec: &search_radius
      reason: unsupported_semantic_concept
      candidate_meaning: Sherlock search configuration, not a measured crossmatch separation.
  - sherlock_objects_crossmatches#original_search_radius_arcsec: *search_radius
  - sherlock_position_crossmatches#catalogue_object_subtype: &catalogue_subtype
      reason: unsupported_semantic_concept
      candidate_meaning: Provider-native catalogue subtype with no same-meaning crossmatch path.
  - sherlock_objects_crossmatches#catalogue_object_subtype: *catalogue_subtype
  - sherlock_position_crossmatches#rankScore: &rank_score
      reason: unsupported_semantic_concept
      candidate_meaning: Sherlock ranking score, distinct from the ordinal rank field.
  - sherlock_objects_crossmatches#rankScore: *rank_score
  - sherlock_position_crossmatches#merged_rank: &merged_rank
      reason: distinct_provider_rank_semantics
      candidate_meaning: Sherlock merged-group rank is distinct from the row's ordinal rank and must not be used as a fallback for crossmatch.rank without a documented equivalence.
  - sherlock_objects_crossmatches#merged_rank: *merged_rank
  - sherlock_position_crossmatches#scale: &legacy_distance
      reason: ambiguous_provider_field
      candidate_meaning: Legacy Sherlock distance metadata whose precise semantics are not established by the observed payload.
  - sherlock_position_crossmatches#distance: *legacy_distance
  - sherlock_position_crossmatches#distance_modulus: *legacy_distance
