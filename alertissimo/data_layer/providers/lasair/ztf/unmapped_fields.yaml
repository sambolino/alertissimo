broker: lasair
origin: ztf
notes: Explicit semantic-debt registry produced by the representative saved-payload audit.
unmapped:
- cone#separation:
    reason: unsupported_semantic_concept
    candidate_meaning: Query-context angular separation is known in arcsec, but the summary record currently has no ontology-backed
      separation container/path for this value.
- candidates#magpsf: &id001
    reason: conditional_detection_presence_required
    candidate_meaning: Lasair object candidates mix detections and upper-limit rows; current Lasair documentation shows an
      upper-limit row with magpsf equal to diffmaglim and no candid, so magpsf cannot be treated as a measured PSF magnitude
      without row-level detection gating.
- candidates#sigmapsf: *id001
- lightcurve_candidates#programid:
    reason: provider_native_implementation_identifier
    candidate_meaning: ZTF observing-program identifier, for which the ontology has no equivalent field.
- object#image_urls.cutout:
    reason: raw_url_ui_only_value
    candidate_meaning: Lasair UI cutout link rather than scientific payload data.
- object#sherlock.photoZ: &id002
    reason: structural_multiple_redshift_estimates
    candidate_meaning: Sherlock photometric-redshift estimate. It must not be collapsed with the distinct z field into one
      redshift.value; the current ontology has no multi-estimate redshift structure.
- sherlock_position_crossmatches#photoZ: *id002
- sherlock_objects_crossmatches#photoZ: *id002
- object#sherlock.photoZErr: &id003
    reason: structural_multiple_redshift_estimates
    candidate_meaning: Uncertainty of Sherlock photoZ. It cannot safely populate redshift.error when redshift.value may come
      from the distinct z field.
- sherlock_position_crossmatches#photoZErr: *id003
- sherlock_objects_crossmatches#photoZErr: *id003
- sherlock_position_classifications#_key: &id004
    reason: duplicate_execution_payload_context
    candidate_meaning: Native transient identifier used as the key of Sherlock's classification dictionary; portfolio context
      already identifies the transient.
- sherlock_objects_classifications#_key: *id004
- sherlock_position_crossmatches#catalogue_table_id: &id005
