broker: alerce
origin: ztf
description: Minimal semantic mapping registry for ALeRCE ZTF payloads.
payloads:
  query_objects:
    path: '[]'
    description: query_objects response payload.
    endpoint: query_objects
  query_object:
    path: .
    description: query_object response payload.
    endpoint: query_object
  query_detections:
    path: '[]'
    description: query_detections response payload.
    endpoint: query_detections
  query_non_detections:
    path: '[]'
    description: query_non_detections response payload.
    endpoint: query_non_detections
  query_forced_photometry:
    path: '[]'
    description: query_forced_photometry response payload.
    endpoint: query_forced_photometry
  query_lightcurve:
    path: .
    description: query_lightcurve response payload.
    endpoint: query_lightcurve
  query_magstats:
    path: '[]'
    description: query_magstats response payload.
    endpoint: query_magstats
  query_probabilities:
    path: '[]'
    description: query_probabilities response payload.
    endpoint: query_probabilities
  query_features:
    path: '[]'
    description: query_features response payload.
    endpoint: query_features
  query_feature:
    path: .
    description: query_feature response payload.
    endpoint: query_feature
  query_classifiers:
    path: '[]'
    description: query_classifiers response payload.
    endpoint: query_classifiers
  query_classes:
    path: '[]'
    description: query_classes response payload.
    endpoint: query_classes
  get_stamps:
    path: '[]'
    description: get_stamps response payload.
    endpoint: get_stamps
  get_avro:
    path: .
    description: get_avro response payload.
    endpoint: get_avro
  catshtm_conesearch:
    path: .
    description: catshtm_conesearch response payload.
    endpoint: catshtm_conesearch
  catshtm_crossmatch:
    path: .
    description: catshtm_crossmatch response payload.
    endpoint: catshtm_crossmatch
  catshtm_redshift:
    path: .
    description: catshtm_redshift response payload.
    endpoint: catshtm_redshift
  query_lightcurve.detections:
    path: detections[]
    endpoint: query_lightcurve
    description: Rows from the detections collection in the light-curve bundle.
  query_lightcurve.non_detections:
    path: non_detections[]
    endpoint: query_lightcurve
    description: Rows from the non_detections collection in the light-curve bundle.
  query_lightcurve.forced_photometry:
    path: forced_photometry[]
    endpoint: query_lightcurve
    description: Rows from the forced_photometry collection in the light-curve bundle.
mappings:
  summary@ztf:alerce.identity.object_id:
  - query_object#oid
  - query_objects#oid
  summary@ztf:alerce.position.ra:
  - query_object#meanra
  - query_objects#meanra
  summary@ztf:alerce.position.dec:
  - query_object#meandec
  - query_objects#meandec
  summary@ztf:alerce.time.first_mjd:
  - query_object#firstmjd
  - query_objects#firstmjd
  summary@ztf:alerce.time.last_mjd:
  - query_object#lastmjd
  - query_objects#lastmjd
  detection@ztf:alerce.photometry.{filter}:
  - query_detections#fid
  - query_lightcurve.detections#fid
  - query_lightcurve.non_detections#fid
  - query_non_detections#fid
  detection@ztf:alerce.identity.object_id:
  - query_detections#oid
  - query_lightcurve.detections#oid
  - query_lightcurve.non_detections#oid
  - query_non_detections#oid
  - query_forced_photometry#oid
  - query_lightcurve.forced_photometry#oid
  detection@ztf:alerce.identity.source_id:
  - query_detections#measurement_id
  - query_lightcurve.detections#measurement_id
  - query_forced_photometry#measurement_id
  - query_lightcurve.forced_photometry#measurement_id
  detection@ztf:alerce.identity.alert_id:
  - query_detections#candid
  - query_lightcurve.detections#candid
  - query_forced_photometry#candid
  detection@ztf:alerce.time.mjd:
  - query_detections#mjd
  - query_lightcurve.detections#mjd
  - query_lightcurve.non_detections#mjd
  - query_non_detections#mjd
  - query_forced_photometry#mjd
  - query_lightcurve.forced_photometry#mjd
  detection@ztf:alerce.position.ra:
  - query_detections#ra
  - query_lightcurve.detections#ra
  - query_forced_photometry#ra
  - query_lightcurve.forced_photometry#ra
  detection@ztf:alerce.position.dec:
  - query_detections#dec
  - query_lightcurve.detections#dec
  - query_forced_photometry#dec
  - query_lightcurve.forced_photometry#dec
  detection@ztf:alerce.provenance.processing_id:
  - query_detections#pid
  - query_lightcurve.detections#pid
  - query_forced_photometry#pid
  - query_lightcurve.forced_photometry#pid
  detection@ztf:alerce.provenance.night_id:
  - query_detections#nid
  - query_lightcurve.detections#nid
  detection@ztf:alerce.provenance.reference_image_id:
  - query_detections#rfid
  - query_lightcurve.detections#rfid
  - query_forced_photometry#rfid
  - query_lightcurve.forced_photometry#rfid
  detection@ztf:alerce.provenance.producer.survey_id:
  - query_detections#tid
  - query_lightcurve.detections#tid
  - query_lightcurve.non_detections#tid
  - query_non_detections#tid
  - query_forced_photometry#tid
  detection@ztf:alerce.quality.corrected:
  - query_detections#corrected
  - query_lightcurve.detections#corrected
  - query_forced_photometry#corrected
  - query_lightcurve.forced_photometry#corrected
  detection@ztf:alerce.quality.dubious:
  - query_detections#dubious
  - query_lightcurve.detections#dubious
  - query_forced_photometry#dubious
  - query_lightcurve.forced_photometry#dubious
  detection@ztf:alerce.photometry.{filter}.limit.mag:
  - query_detections#diffmaglim
  - query_lightcurve.detections#diffmaglim
  - query_lightcurve.non_detections#diffmaglim
  - query_non_detections#diffmaglim
  detection@ztf:alerce.photometry.{filter}.psf.mag:
  - query_detections#magpsf
  - query_lightcurve.detections#magpsf
  detection@ztf:alerce.photometry.{filter}.psf.mag_error:
  - query_detections#sigmapsf
  - query_lightcurve.detections#sigmapsf
  detection@ztf:alerce.photometry.{filter}.aperture.mag:
  - query_detections#magap
  - query_lightcurve.detections#magap
  detection@ztf:alerce.photometry.{filter}.aperture.mag_error:
  - query_detections#sigmagap
  - query_lightcurve.detections#sigmagap
  detection@ztf:alerce.photometry.{filter}.aperture.large.mag:
  - query_detections#magapbig
  - query_lightcurve.detections#magapbig
  detection@ztf:alerce.photometry.{filter}.aperture.large.mag_error:
  - query_detections#sigmagapbig
  - query_lightcurve.detections#sigmagapbig
  detection@ztf:alerce.provenance.producer.program.field:
  - query_lightcurve.detections#field
  - query_forced_photometry#field
  - query_lightcurve.forced_photometry#field
  detection@ztf:alerce.provenance.producer.program.id:
  - query_lightcurve.detections#programid
  - query_forced_photometry#programid
  - query_lightcurve.forced_photometry#programid
  detection@ztf:alerce.forced_photometry.{filter}:
  - query_forced_photometry#fid
  - query_lightcurve.forced_photometry#fid
  detection@ztf:alerce.provenance.processing_status:
  - query_forced_photometry#procstatus
  - query_lightcurve.forced_photometry#procstatus
  detection@ztf:alerce.forced_photometry.{filter}.limit.mag:
  - query_forced_photometry#diffmaglim
  - query_lightcurve.forced_photometry#diffmaglim
  detection@ztf:alerce.forced_photometry.{filter}.forced_magnitude:
  - query_forced_photometry#mag
  - query_lightcurve.forced_photometry#mag
  detection@ztf:alerce.forced_photometry.{filter}.forced_magnitude_error:
  - query_forced_photometry#e_mag
  - query_lightcurve.forced_photometry#e_mag
  detection@ztf:alerce.forced_photometry.{filter}.forced_magnitude_corrected:
  - query_forced_photometry#mag_corr
  - query_lightcurve.forced_photometry#mag_corr
  detection@ztf:alerce.forced_photometry.{filter}.forced_magnitude_corrected_error:
  - query_forced_photometry#e_mag_corr
  - query_lightcurve.forced_photometry#e_mag_corr
  detection@ztf:alerce.forced_photometry.{filter}.forced_magnitude_corrected_extended_error:
  - query_forced_photometry#e_mag_corr_ext
  - query_lightcurve.forced_photometry#e_mag_corr_ext
  summary@ztf:alerce.photometry.{filter}:
  - query_magstats#fid
  summary@ztf:alerce.position.ra_error:
  - query_object#sigmara
  - query_objects#sigmara
  summary@ztf:alerce.position.dec_error:
  - query_object#sigmadec
  - query_objects#sigmadec
  summary@ztf:alerce.time.timespan_days:
  - query_object#deltajd
  - query_objects#deltajd
  summary@ztf:alerce.detection_count:
  - query_object#ndet
  - query_objects#ndet
  summary@ztf:alerce.coverage_count:
  - query_object#ncovhist
  - query_objects#ncovhist
  detection@ztf:alerce.quality.rf_real_bogus:
  - query_detections#rb
  - query_lightcurve.detections#rb
  detection@ztf:alerce.quality.rf_real_bogus.version:
  - query_detections#rbversion
  - query_lightcurve.detections#rbversion
  detection@ztf:alerce.quality.real_bogus:
  - query_detections#drb
  - query_lightcurve.detections#drb
  detection@ztf:alerce.quality.real_bogus.version:
  - query_detections#drbversion
  - query_lightcurve.detections#drbversion
  detection@ztf:alerce.image_metrics.is_positive:
  - query_forced_photometry#isdiffpos
  - query_lightcurve.forced_photometry#isdiffpos
  detection@ztf:alerce.reference_image.nearest_source.separation.total:
  - query_detections#distnr
  - query_lightcurve.detections#distnr
  - query_forced_photometry#distnr
  - query_lightcurve.forced_photometry#distnr
  detection@ztf:alerce.reference_image.nearest_source.position.ra:
  - query_lightcurve.detections#ranr
  - query_forced_photometry#ranr
  - query_lightcurve.forced_photometry#ranr
  detection@ztf:alerce.reference_image.nearest_source.position.dec:
  - query_lightcurve.detections#decnr
  - query_forced_photometry#decnr
  - query_lightcurve.forced_photometry#decnr
  detection@ztf:alerce.reference_image.nearest_source.photometry.{filter}.mag:
  - query_lightcurve.detections#magnr
  - query_forced_photometry#magnr
  - query_lightcurve.forced_photometry#magnr
  detection@ztf:alerce.reference_image.nearest_source.photometry.{filter}.mag_error:
  - query_lightcurve.detections#sigmagnr
  - query_forced_photometry#sigmagnr
  - query_lightcurve.forced_photometry#sigmagnr
  detection@ztf:alerce.reference_image.nearest_source.image_metrics.fit_chi:
  - query_lightcurve.detections#chinr
  - query_forced_photometry#chinr
  - query_lightcurve.forced_photometry#chinr
  detection@ztf:alerce.reference_image.nearest_source.image_metrics.sharpness:
  - query_lightcurve.detections#sharpnr
  - query_forced_photometry#sharpnr
  - query_lightcurve.forced_photometry#sharpnr
  detection@ztf:alerce.time.exposure:
  - query_forced_photometry#exptime
  - query_lightcurve.forced_photometry#exptime
  detection@ztf:alerce.calibration.{filter}.zero_point:
  - query_forced_photometry#magzpsci
  - query_lightcurve.forced_photometry#magzpsci
  detection@ztf:alerce.calibration.{filter}.zero_point_uncertainty:
  - query_forced_photometry#magzpsciunc
  - query_lightcurve.forced_photometry#magzpsciunc
  detection@ztf:alerce.calibration.{filter}.zero_point_rms:
  - query_forced_photometry#magzpscirms
  - query_lightcurve.forced_photometry#magzpscirms
  detection@ztf:alerce.calibration.{filter}.color_coefficient:
  - query_forced_photometry#clrcoeff
  - query_lightcurve.forced_photometry#clrcoeff
  - query_lightcurve.detections#clrcoeff
  detection@ztf:alerce.calibration.{filter}.color_coefficient_uncertainty:
  - query_forced_photometry#clrcounc
  - query_lightcurve.forced_photometry#clrcounc
  - query_lightcurve.detections#clrcounc
  detection@ztf:alerce.position.ra_error:
  - query_forced_photometry#e_ra
  - query_lightcurve.forced_photometry#e_ra
  detection@ztf:alerce.position.dec_error:
  - query_forced_photometry#e_dec
  - query_lightcurve.forced_photometry#e_dec
  classification@{producer}:alerce.best.class:
  - query_object#class
  - query_objects#class
  classification@{producer}:alerce.best.probability:
  - query_object#probability
  - query_objects#probability
  classification@{producer}:alerce.provenance.producer.name:
  - query_object#classifier
  - query_objects#classifier
  - query_probabilities#classifier_name
  classification@{producer}:alerce.provenance.producer.version:
  - query_probabilities#classifier_version
  classification@{producer}:alerce.assessment.{output}:
  - query_probabilities#class_name
  classification@{producer}:alerce.assessment.{output}.class:
  - query_probabilities#class_name
  classification@{producer}:alerce.assessment.{output}.probability:
  - query_probabilities#probability
transforms:
  detection@ztf:alerce.photometry.{filter}:
    query_detections#fid:
      type: value_map
      map:
        1: g
        '1': g
        2: r
        '2': r
        3: i
        '3': i
      default: unknown
    query_lightcurve.detections#fid:
      type: value_map
      map:
        1: g
        '1': g
        2: r
        '2': r
        3: i
        '3': i
      default: unknown
    query_lightcurve.non_detections#fid:
      type: value_map
      map:
        1: g
        '1': g
        2: r
        '2': r
        3: i
        '3': i
      default: unknown
    query_non_detections#fid:
      type: value_map
      map:
        1: g
        '1': g
        2: r
        '2': r
        3: i
        '3': i
      default: unknown
  detection@ztf:alerce.forced_photometry.{filter}:
    query_forced_photometry#fid:
      type: value_map
      map:
        1: g
        '1': g
        2: r
        '2': r
        3: i
        '3': i
      default: unknown
    query_lightcurve.forced_photometry#fid:
      type: value_map
      map:
        1: g
        '1': g
        2: r
        '2': r
        3: i
        '3': i
      default: unknown
  summary@ztf:alerce.photometry.{filter}:
    query_magstats#fid:
      type: value_map
      map:
        1: g
        '1': g
        2: r
        '2': r
        3: i
        '3': i
      default: unknown
  detection@ztf:alerce.image_metrics.is_positive:
    query_forced_photometry#isdiffpos:
      type: value_map
      map:
        '1': true
        1: true
        '-1': false
        -1: false
      default: null
      skip_null: true
    query_lightcurve.forced_photometry#isdiffpos:
      type: value_map
      map:
        '1': true
        1: true
        '-1': false
        -1: false
      default: null
      skip_null: true
