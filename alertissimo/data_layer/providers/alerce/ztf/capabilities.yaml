broker: alerce
origin: ztf
predicate_bindings:
  query_objects:
    - path: classification.provenance.producer.name
      operator: "="
      parameter: classifier
      exact: false
    - path: classification.best.class
      operator: "="
      parameter: class_name
      exact: false
    - path: summary.time.first_mjd
      operator: ">="
      parameter: firstmjd
    - path: summary.time.last_mjd
      operator: ">="
      parameter: lastmjd
selection_bindings:
  query_objects:
    latest:
      path: summary.time.last_mjd
      params:
        order_by: {value: lastmjd}
        order_mode: {value: DESC}
recipes:
  confirm:
    - calls:
        - endpoint: query_object
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_probabilities
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_lightcurve
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_forced_photometry
          params:
            oid: {from: step.target.ids}
  semantic_search:
    - calls:
        - endpoint: query_objects
  cone_search:
    - calls:
        - endpoint: query_objects
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: query_lightcurve
          params:
            oid: {from: step.target.ids}
        - endpoint: query_forced_photometry
          required: false
          params:
            oid: {from: step.target.ids}
  get_forced_photometry:
    - calls:
        - endpoint: query_forced_photometry
          params:
            oid: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: query_object
          params:
            oid: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: query_probabilities
          params:
            oid: {from: step.target.ids}
  get_cutout:
    - target_kind: object
      calls:
        - endpoint: get_stamps
          params:
            oid: {from: step.target.ids}
            format: {from: step.format}
  get_data_product:
    - target_kind: object
      calls:
        - endpoint: get_stamps
          params:
            oid: {from: step.target.ids}
    - target_kind: object
      calls:
        - endpoint: get_avro
          params:
            oid: {from: step.target.ids}
