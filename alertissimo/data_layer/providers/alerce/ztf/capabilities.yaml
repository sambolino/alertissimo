broker: alerce
origin: ztf
predicate_bindings:
  query_objects:
    - path: classification.provenance.producer.name
      operator: "="
      parameter: classifier
      exact: false
    - path: classification.best.class
      operator: "="
      parameter: class_name
      exact: false
    - path: summary.time.first_mjd
      operator: ">="
      parameter: firstmjd
    - path: summary.time.last_mjd
      operator: ">="
      parameter: lastmjd
selection_bindings:
  query_objects:
    latest:
      path: summary.time.last_mjd
      params:
        order_by: {value: lastmjd}
        order_mode: {value: DESC}
recipes:
  confirm:
    - calls:
        - endpoint: query_object
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_probabilities
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_lightcurve
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_forced_photometry
          params:
            oid: {from: step.target.ids}
  semantic_search:
    - calls:
        - endpoint: query_objects
    # A last-detection minimum is a safe superset, not proof of an observation
    # inside a historical interval. Verify the required full detection history.
    - time_selection:
        mode: detection
        method: material
        call: 1
        payload: query_lightcurve.detections
        complete: true
        time_scale: utc
      calls:
        - endpoint: query_objects
          params:
            lastmjd: {from: step.time_context}
        - endpoint: query_lightcurve
          params:
            oid: {from: {call: 0, path: summary.identity.object_id}}
    - time_selection:
        mode: first
        method: native
        call: 0
        payload: query_objects
        complete: true
        time_scale: utc
      calls:
        - endpoint: query_objects
          params:
            firstmjd: {from: step.time_context}
    - time_selection:
        mode: last
        method: native
        call: 0
        payload: query_objects
        complete: true
        time_scale: utc
      calls:
        - endpoint: query_objects
          params:
            lastmjd: {from: step.time_context}
  cone_search:
    - calls:
        - endpoint: query_objects
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
    - time_selection:
        mode: detection
        method: material
        call: 1
        payload: query_lightcurve.detections
        complete: true
        time_scale: utc
      calls:
        - endpoint: query_objects
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
            lastmjd: {from: step.time_context}
        - endpoint: query_lightcurve
          params:
            oid: {from: {call: 0, path: summary.identity.object_id}}
    - time_selection:
        mode: first
        method: native
        call: 0
        payload: query_objects
        complete: true
        time_scale: utc
      calls:
        - endpoint: query_objects
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
            firstmjd: {from: step.time_context}
    - time_selection:
        mode: last
        method: native
        call: 0
        payload: query_objects
        complete: true
        time_scale: utc
      calls:
        - endpoint: query_objects
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
            lastmjd: {from: step.time_context}
  get_lightcurve:
    - calls:
        - endpoint: query_lightcurve
          params:
            oid: {from: step.target.ids}
        - endpoint: query_forced_photometry
          required: false
          params:
            oid: {from: step.target.ids}
  get_forced_photometry:
    - calls:
        - endpoint: query_forced_photometry
          params:
            oid: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: query_object
          params:
            oid: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: query_probabilities
          params:
            oid: {from: step.target.ids}
  get_cutout:
    - target_kind: object
      calls:
        - endpoint: get_stamps
          params:
            oid: {from: step.target.ids}
            format: {from: step.format}
  get_data_product:
    - target_kind: object
      calls:
        - endpoint: get_stamps
          params:
            oid: {from: step.target.ids}
    - target_kind: object
      calls:
        - endpoint: get_avro
          params:
            oid: {from: step.target.ids}
