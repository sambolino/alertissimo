broker: alerce
origin: lsst
description: Authoritative semantic mappings for captured ALeRCE 2.3.1 LSST payloads.
payloads:
  query_objects:
    path: '[]'
    object_partition:
      mode: field
      field: oid
    endpoint: query_objects
    description: Classification-bearing object-search rows; each row emits minimal object identity alongside its independent classifier result.
  query_object:
    path: '.'
    object_partition:
      mode: single
    endpoint: query_object
    description: Single object-summary response.
  query_detections:
    path: '[]'
    object_partition:
      mode: single
    endpoint: query_detections
    description: Detection rows.
  query_non_detections:
    path: '[]'
    object_partition:
      mode: single
    endpoint: query_non_detections
    description: Non-detection rows; the authoritative capture is empty.
  query_forced_photometry:
    path: '[]'
    object_partition:
      mode: single
    endpoint: query_forced_photometry
    description: Forced-photometry rows represented as generic detections.
  query_lightcurve:
    path: '.'
    object_partition:
      mode: single
    endpoint: query_lightcurve
    description: Light-curve bundle container.
  query_probabilities:
    path: '[]'
    object_partition:
      mode: single
    endpoint: query_probabilities
    description: Classifier probability rows.
  query_lightcurve.detections:
    path: 'detections[]'
    object_partition:
      mode: single
    endpoint: query_lightcurve
    description: Detection rows delegated from the light-curve bundle.
  query_lightcurve.non_detections:
    path: 'non_detections[]'
    object_partition:
      mode: single
    endpoint: query_lightcurve
    description: Non-detection rows delegated from the light-curve bundle.
  query_lightcurve.forced_photometry:
    path: 'forced_photometry[]'
    object_partition:
      mode: single
    endpoint: query_lightcurve
    description: Forced-photometry rows delegated from the light-curve bundle.
mappings:
  summary@lsst:alerce.identity.object_id:
  - query_objects#oid
  - query_object#oid
  summary@lsst:alerce.position.ra:
  - query_object#meanra
  summary@lsst:alerce.position.dec:
  - query_object#meandec
  summary@lsst:alerce.position.ra_error:
  - query_object#sigmara
  summary@lsst:alerce.position.dec_error:
  - query_object#sigmadec
  summary@lsst:alerce.time.first_mjd:
  - query_object#firstmjd
  summary@lsst:alerce.time.last_mjd:
  - query_object#lastmjd
  summary@lsst:alerce.time.timespan_days:
  - query_object#deltamjd
  summary@lsst:alerce.detection_count:
  - query_object#n_det
  classification@{producer}:alerce.provenance.producer.name:
  - query_objects#classifier_name
  - query_probabilities#classifier_name
  classification@{producer}:alerce.provenance.producer.version:
  - query_objects#classifier_version
  - query_probabilities#classifier_version
  classification@{producer}:alerce.best.class:
  - query_objects#class_name
  classification@{producer}:alerce.best.probability:
  - query_objects#probability
  classification@{producer}:alerce.assessment.{output}:
  - query_probabilities#class_name
  classification@{producer}:alerce.assessment.{output}.class:
  - query_probabilities#class_name
  classification@{producer}:alerce.assessment.{output}.probability:
  - query_probabilities#probability
  detection@lsst:alerce.photometry.{filter}:
  - query_detections#band_name
  - query_lightcurve.detections#band_name
  detection@lsst:alerce.identity.object_id:
  - query_detections#oid
  - query_lightcurve.detections#oid
