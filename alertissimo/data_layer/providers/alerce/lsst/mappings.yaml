  detection@lsst:alerce.solar_system.identity.object_id:
    query_detections#ssObjectId: &optional_ss_object_id
      type: value_map
      map: {0: null}
      skip_null: true
    query_lightcurve.detections#ssObjectId: *optional_ss_object_id
  detection@lsst:alerce.forced_photometry.{filter}.psf.flags.failed:
    query_detections#forced_PsfFlux_flag: &strict_forced_psf_flag
      type: value_map
      map: {0: false, 1: true}
      default: null
      skip_null: true
