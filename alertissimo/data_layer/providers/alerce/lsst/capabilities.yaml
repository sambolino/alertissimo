broker: alerce
origin: lsst
predicate_bindings:
  query_objects:
    - path: classification.provenance.producer.name
      operator: "="
      parameter: classifier
    - path: classification.best.class
      operator: "="
      parameter: class_name
    - path: classification.best.probability
      operator: ">="
      parameter: probability
recipes:
  confirm:
    - calls:
        - endpoint: query_object
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_probabilities
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_lightcurve
          params:
            oid: {from: step.target.ids}
    - calls:
        - endpoint: query_forced_photometry
          params:
            oid: {from: step.target.ids}
  semantic_search:
    - calls:
        - endpoint: query_objects
  cone_search:
    - calls:
        - endpoint: query_objects
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: query_lightcurve
          params:
            oid: {from: step.target.ids}
        - endpoint: query_forced_photometry
          required: false
          params:
            oid: {from: step.target.ids}
  get_forced_photometry:
    - calls:
        - endpoint: query_forced_photometry
          params:
            oid: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: query_object
          params:
            oid: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: query_probabilities
          params:
            oid: {from: step.target.ids}
  get_cutout:
    - target_kind: object
      calls:
        - endpoint: get_stamps
          params:
            oid: {from: step.target.ids}
            format: {from: step.format}
  get_data_product:
    - target_kind: object
      calls:
        - endpoint: get_stamps
          params:
            oid: {from: step.target.ids}
