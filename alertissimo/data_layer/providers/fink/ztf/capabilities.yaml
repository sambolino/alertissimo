broker: fink
origin: ztf
recipes:
  cone_search:
    - calls:
        - endpoint: conesearch
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
