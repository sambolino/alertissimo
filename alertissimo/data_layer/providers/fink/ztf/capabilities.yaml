broker: fink
origin: ztf
# No latest selection proof: latests ranks historical class alerts, while
# objects histories have a server-configured cap and no pagination.
# Mapped jdendhist values alone do not establish current object recency.
# Source audit and counterexample: docs/selection_03_fink_ztf.md.
predicate_bindings:
  latests:
    - path: classification.best.class
      operator: "="
      parameter: class
      # Only the audited ordinary class-index routes. Physical class aliases
      # and special grouped tables do not inherit this scientific meaning.
      values:
        - SN candidate
        - Early SN Ia candidate
      # Keep the returned v:classification as scientific evidence; the stream
      # selector alone does not establish a current classification per object.
      exact: false
recipes:
  semantic_search:
    # Keep searches without an authored window on their physical defaults.
    - calls:
        - endpoint: latests
    - calls:
        - endpoint: latests
          params:
            startdate: {from: step.time_context}
            stopdate: {from: step.time_context}
      time_selection:
        mode: detection
        method: native
        call: 0
        payload: latests
        complete: true
        time_scale: utc
  confirm:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  cone_search:
    - calls:
        - endpoint: conesearch
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  get_crossmatch:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  get_cutout:
    - target_kind: object
      calls:
        - endpoint: cutouts_array
          params:
            objectId: {from: step.target.ids}
  get_data_product:
    - target_kind: object
      calls:
        - endpoint: cutouts_array
          params:
            objectId: {from: step.target.ids}
