broker: fink
origin: ztf
predicate_bindings:
  latests:
    - path: classification.best.class
      operator: "="
      parameter: class
      # Only the audited ordinary class-index routes. Physical class aliases
      # and special grouped tables do not inherit this scientific meaning.
      values:
        - SN candidate
        - Early SN Ia candidate
      # Keep the returned v:classification as scientific evidence; the stream
      # selector alone does not establish a current classification per object.
      exact: false
recipes:
  semantic_search:
    - calls:
        - endpoint: latests
          params:
            startdate: {from: step.time_context}
            stopdate: {from: step.time_context}
  confirm:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  cone_search:
    - calls:
        - endpoint: conesearch
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  get_crossmatch:
    - calls:
        - endpoint: objects
          params:
            objectId: {from: step.target.ids}
  get_cutout:
    - target_kind: object
      calls:
        - endpoint: cutouts
          params:
            objectId: {from: step.target.ids}
            kind: {value: All}
            output-format: {value: array}
  get_data_product:
    - target_kind: object
      calls:
        - endpoint: cutouts
          params:
            objectId: {from: step.target.ids}
            kind: {value: All}
            output-format: {value: array}
