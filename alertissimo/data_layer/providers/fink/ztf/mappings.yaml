transforms:
  detection@ztf:fink.photometry.{filter}:
    objects#i:fid:
      type: value_map
      map: &id001
        1: g
        2: r
        3: i
        '1': g
        '2': r
        '3': i
      default: null
      skip_null: true
      note: 'ZTF fid convention: 1=g, 2=r, 3=i; unknown IDs are not semantic passbands.'
    conesearch#i:fid:
      type: value_map
      map: *id001
      default: null
      skip_null: true
      note: 'ZTF fid convention: 1=g, 2=r, 3=i; unknown IDs are not semantic passbands.'
    latests#i:fid:
      type: value_map
      map: *id001
      default: null
      skip_null: true
      note: 'ZTF fid convention: 1=g, 2=r, 3=i; unknown IDs are not semantic passbands.'
    sso#i:fid:
      type: value_map
      map: *id001
      default: null
      skip_null: true
      note: 'ZTF fid convention: 1=g, 2=r, 3=i; unknown IDs are not semantic passbands.'
    anomaly#i:fid:
      type: value_map
      map: *id001
      default: null
      skip_null: true
      note: 'ZTF fid convention: 1=g, 2=r, 3=i; unknown IDs are not semantic passbands.'
  detection@ztf:fink.time.mjd:
    objects#i:jd:
      type: jd_to_mjd
      note: Native ZTF candidate jd is Julian Date; ontology leaf is MJD.
    conesearch#i:jd:
      type: jd_to_mjd
      note: Native ZTF candidate jd is Julian Date; ontology leaf is MJD.
    latests#i:jd:
      type: jd_to_mjd
      note: Native ZTF candidate jd is Julian Date; ontology leaf is MJD.
    sso#i:jd:
      type: jd_to_mjd
      note: Native ZTF candidate jd is Julian Date; ontology leaf is MJD.
    anomaly#i:jd:
      type: jd_to_mjd
      note: Native ZTF candidate jd is Julian Date; ontology leaf is MJD.
  detection@ztf:fink.image_metrics.is_positive:
    objects#i:isdiffpos:
      type: value_map
      map: &id002
        t: true
        f: false
        '1': true
        '0': false
        1: true
        0: false
      default: null
      skip_null: true
      note: Strict normalization of documented ZTF Avro boolean encodings; no truthiness fallback.
    sso#i:isdiffpos:
      type: value_map
      map: *id002
      default: null
      skip_null: true
      note: Strict normalization of documented ZTF Avro boolean encodings; no truthiness fallback.
    latests#i:isdiffpos:
      type: value_map
      map: *id002
      default: null
      skip_null: true
      note: Strict normalization of documented ZTF Avro boolean encodings; no truthiness fallback.
    anomaly#i:isdiffpos:
      type: value_map
      map: *id002
      default: null
      skip_null: true
      note: Strict normalization of documented ZTF Avro boolean encodings; no truthiness fallback.
  detection@ztf:fink.photometry.{filter}.limit.upper_limit:
    objects#d:tag:
      type: value_map
      map:
        upperlim: true
        valid: null
        badquality: null
      default: null
      skip_null: true
      note: Fink history tag is categorical; only upperlim asserts an upper limit.
  detection@ztf:fink.separation.from_search_center:
    conesearch#v:separation_degree:
      type: scale
      factor: 3600
      note: Fink conesearch v:separation_degree is degrees; ontology unit is arcsec.
  detection@ztf:fink.reference_image.time.first_mjd:
    anomaly#i:jdstartref:
      type: jd_to_mjd
      note: Native ZTF reference-image time is JD; ontology leaf is MJD.
  detection@ztf:fink.reference_image.time.last_mjd:
    anomaly#i:jdendref:
      type: jd_to_mjd
      note: Native ZTF reference-image time is JD; ontology leaf is MJD.
