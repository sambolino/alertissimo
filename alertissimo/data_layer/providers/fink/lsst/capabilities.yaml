broker: fink
origin: lsst
recipes:
  cone_search:
    - calls:
        - endpoint: conesearch
          params:
            ra: {from: step.ra}
            dec: {from: step.dec}
            radius: {from: step.radius}
  get_lightcurve:
    - calls:
        - endpoint: sources
          params:
            diaObjectId: {from: step.target.ids}
        - endpoint: fp
          required: false
          params:
            diaObjectId: {from: step.target.ids}
  get_forced_photometry:
    - calls:
        - endpoint: fp
          params:
            diaObjectId: {from: step.target.ids}
  lookup:
    - target_kind: object
      calls:
        - endpoint: objects
          params:
            diaObjectId: {from: step.target.ids}
  get_classification:
    - calls:
        - endpoint: sources
          params:
            diaObjectId: {from: step.target.ids}
    - calls:
        - endpoint: objects
          params:
            diaObjectId: {from: step.target.ids}
  get_crossmatch:
    - calls:
        - endpoint: sources
          params:
            diaObjectId: {from: step.target.ids}
  get_cutout:
    - target_kind: alert
      calls:
        - endpoint: cutouts
          params:
            diaSourceId: {from: step.target.ids}
            kind: {value: All}
            output-format: {value: array}
  get_data_product:
    - target_kind: alert
      calls:
        - endpoint: cutouts
          params:
            diaSourceId: {from: step.target.ids}
            kind: {value: All}
            output-format: {value: array}
