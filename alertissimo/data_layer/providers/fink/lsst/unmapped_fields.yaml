- fp#r:scienceFlux:
    reason: unresolved_measurement_semantics
    note: DiaForcedSource contains both psfFlux and scienceFlux as distinct Rubin-defined
      measurements. psfFlux is already canonically represented as the forced-source
      PSF measurement across brokers; scienceFlux is separately defined as forced
      photometry on the visit image. The current ontology/convergence model needs
      a dedicated decision before both can coexist without semantic collision.
