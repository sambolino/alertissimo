      field definitions; it is endpoint metadata rather than an astronomical semantic
      record.
- objects#r:salt:
    reason: storage_partition_key
    note: Fink-internal HBase salting value added at ingestion for row-key/storage
      distribution; not part of the Rubin science payload and intentionally not exposed
      in the semantic portfolio.
- sources#r:parentDiaSourceId:
    reason: relationship_requires_edge
    note: Native Rubin identifier of the parent DiaSource from which this DiaSource
      was deblended. The authoritative transient capture contains zero/absence, and
      the semantic model represents such parent relationships on the edge plane rather
      than as intrinsic record identity. Promote when mapping-driven edge construction
      and non-sentinel authoritative evidence are available.
