# ============================================================================
# SEMANTICS RECIPE
# ============================================================================
# This file defines a level-aware semantic model for heterogeneous astronomical
# transient data. The aim is to provide a common language in which detections,
# summaries, classifications, light curves, crossmatches, provenance, and
# record-to-record links can be described without adopting the native vocabulary
# of any one broker, survey, catalog, or transport format.
#
# The model is intentionally readable. A semantic path should be useful to a
# human scientist, to a mapping file, and to code that must normalize data from
# heterogeneous streams. The same notation is also intended to support higher
# level DSL expressions, but the semantic catalog is not itself the query
# language. It defines the vocabulary and structural rules on which such a
# language can rely.
#
# This is an ordered YAML-like domain-specific notation, not ordinary YAML.
# Repeated directives such as level, $ref, and $refs are meaningful. Their
# order and scope must be preserved by the parser. A standard YAML parser that
# overwrites duplicate keys is therefore not sufficient.
#
#
# ---------------------------------------------------------------------------
# CORE ELEMENTS
# ---------------------------------------------------------------------------
#
# 1. Semantic containers
#
#   <container>
#       Instantiable, path-bearing semantic grouping. Its name is preserved
#       when composed into another structure.
#
#       Example:
#
#           <detection>:
#             $ref: <photometry>(L1)
#
#       allows paths such as:
#
#           detection.photometry.g.psf.flux
#
#       The container name is part of the meaning. It should not be introduced
#       merely to mirror a storage layout or a broker payload section.
#
#
# 2. Fields
#
#   [field]
#       Resolvable value-bearing semantic element. A field may be a leaf or may
#       contain nested fields.
#
#       Examples:
#
#           [ra]
#           [object_id]
#           [flux]
#           [probability]
#
#       A field name should describe the value, not its accidental source name.
#       Source names that cannot yet be normalized may be carried by dynamic
#       fields or by mapping metadata.
#
#
# 3. Parameterized containers and dynamic fields
#
#   <{parameter}>
#       Runtime-resolved, path-bearing semantic container. Used when the
#       substituted value forms a namespace with fields or subcontainers below
#       it.
#
#       Example:
#
#           <photometry>:
#             <{filter}>:
#               <psf>:
#                 [flux]
#
#       allows:
#
#           photometry.g.psf.flux
#           photometry.r.psf.flux
#
#       Parameterized containers are appropriate for filters, named
#       classification outputs, color pairs, or other runtime values that behave
#       as semantic namespaces.
#
#   [{field}]
#       Dynamic resolvable extension field or terminal runtime field. Used for
#       producer-, broker-, catalog-, or method-specific values not yet
#       represented in the stable vocabulary. It may also represent a parameter
#       that terminates the path rather than carrying descendants.
#
#       Dynamic fields are escape hatches. They should not replace a stable
#       reusable concept once that concept is clear.
#
#
# 4. Internal projections and reusable traits
#
#   <_name>
#       Non-instantiable field projection or reusable trait. An underscored
#       element never appears as a semantic path component.
#
#       A projection can import the contents of a semantic container without
#       importing the container name itself:
#
#           <forced_photometry>:
#             $ref: <_photometry>
#
#       allows:
#
#           forced_photometry.g.psf.flux
#
#       not:
#
#           forced_photometry.photometry.g.psf.flux
#
#       A trait can also be declared explicitly:
#
#           <_classification_core>:
#             [class]
#             [probability]
#
#           <classification>:
#             <best>:
#               $ref: <_classification_core>
#
#       allows:
#
#           classification.best.class
#           classification.best.probability
#
#       The underscored trait name is never propagated into the path.
#
#
# ---------------------------------------------------------------------------
# REFERENCES, CARDINALITY, AND OPTIONALITY
# ---------------------------------------------------------------------------
#
# 5. Single references
#
#   $ref: <container>
#       Allows one instance of an instantiable semantic container to appear in
#       the current structure. The referenced container name remains in the
#       path.
#
#   $ref: <container>(Ln)
#       Allows fields of the referenced container that are valid at the selected
#       level. Level selection is recursive and field-based. Ancestor containers
#       needed to reach selected fields are retained as path scaffolding; sibling
#       fields whose levels do not match are not selected.
#
#       Example:
#
#           <summary>:
#             $ref: <photometry>(L0)
#
#       may allow both:
#
#           summary.photometry.g.magnitude_rate
#           summary.photometry.g.psf.mean
#
#       while not implying L1 detection measurements such as:
#
#           summary.photometry.g.psf.fit_chi2
#
#   $ref: <_container>
#       Imports only the referenced contents. The underscored source is not
#       instantiable and does not add a path component.
#
#   Important:
#       A reference is permissive, not mandatory. It declares that the enclosing
#       structure may carry semantically compatible fields from the referenced
#       concept. It does not require every record instance to contain all fields
#       made available by the reference, and it does not require a normalizer to
#       materialize absent fields. Presence, absence, reduction, and storage are
#       runtime matters.
#
#
# 6. Repeated references
#
#   $refs: <container>
#       Declares that the current structure may collect zero or more instances
#       of the referenced semantic entity.
#
#       Example:
#
#           <portfolio>:
#             $refs: <summary>
#             $refs: <detection>
#             $refs: <crossmatch>
#
#       $refs defines semantic cardinality. It does not pluralize the semantic
#       noun and does not expose runtime array indexes in semantic paths.
#
#       Repeated instances may have the same semantic path:
#
#           portfolio.detection@lsst:fink
#           portfolio.detection@lsst:fink
#           portfolio.detection@lsst:fink
#
#       The path identifies the kind of record and its semantic qualification,
#       not necessarily one concrete instance. Implementations may use internal
#       record identifiers, array positions, database keys, or object anchors to
#       connect concrete instances. Such identifiers are storage details and are
#       not part of the public semantic path grammar.
#
#
# 7. Intrinsically multi-valued fields
#
#   type: array
#       Used when a single field value is intrinsically a list or array. This is
#       distinct from repeated semantic entities declared with $refs.
#
#       Examples:
#
#           cutouts.science
#           lightcurve.points
#
#
# ---------------------------------------------------------------------------
# LEVELS
# ---------------------------------------------------------------------------
#
# 8. Semantic levels
#
#   Levels describe the conceptual context in which fields normally apply:
#
#       L0  - Object/portfolio summaries, identities, and aggregate properties
#       L1  - Single-detection measurements and metadata
#       L2  - Phenomenon-specific information, e.g. Solar System or GW content
#       L3  - Binary and image data
#       L4  - Light curves and derived time-series products
#       L5  - Quality scores, classification, and machine-learning outputs
#       L6  - Enrichment, linkage, crossmatch, and external catalog information
#       L7  - Survey-level aggregates
#       L8  - External services such as resolvers and ephemerides
#
#   Levels are descriptive metadata used for documentation, validation, sanity
#   checks, and future tooling. They are not semantic path components.
#
#   Level declarations are scoped and ordered:
#
#       - a level declared on a container applies to descendants that follow it
#       - a later level declaration at the same scope applies to following
#         fields and subcontainers until another level declaration appears
#       - an individual field may override the inherited level
#       - one semantic container may therefore carry fields from several levels
#
#   A field may be valid at more than one level:
#
#       [magnitude_rate]:
#         level: L0, L4
#
#   Such a field may appear in an object summary and in a light-curve product.
#   The path context determines the role.
#
#
# ---------------------------------------------------------------------------
# PORTFOLIO RECORDS AND STRUCTURAL CONTEXT
# ---------------------------------------------------------------------------
#
# 9. Portfolio root
#
#   <portfolio> is the object-centric root. It collects first-level semantic
#   records rather than forcing all information into a single object tree.
#   Object-level identity and aggregate projections belong in <summary>.
#
#   Current first-level record types are:
#
#       summary
#       detection
#       crossmatch
#       lightcurve
#       classification
#
#   The model deliberately keeps these nouns singular. Cardinality is expressed
#   by $refs and runtime representation, not by plural path names.
#
#
# 10. Generic detection
#
#   <detection> is the generic atomic observational, alert, or event record.
#   Optical alerts, radio detections, Solar System detections, GW notices, and
#   neutrino events should not require separate first-level portfolio branches
#   merely because their producers or messengers differ.
#
#   The producer/channel qualifier may strongly suggest the expected profile:
#
#       portfolio.detection@lsst:fink
#       portfolio.detection@lvk:gcn
#       portfolio.detection@icecube:gcn
#
#   but the formal semantic content is expressed by the branches present inside
#   the detection:
#
#       detection.photometry...
#       detection.gravitational_wave...
#       detection.neutrino...
#       detection.solar_system...
#
#   A reference from <detection> to a phenomenon-specific container allows that
#   content; it does not imply that every detection carries it.
#
#
# 11. Structural context carries meaning
#
#   Do not repeat information already expressed by the enclosing hierarchy.
#
#       detection.forced_photometry.g.psf.flux
#
#   means forced photometry on the science/detection side, while:
#
#       detection.reference.forced_photometry.g.psf.flux
#
#   means forced photometry on the reference/template image.
#
#   Fields such as science_flux and template_flux are therefore unnecessary in
#   the semantic vocabulary. The reusable container supplies the measurement
#   concept; the parent structure supplies the role.
#
#
# 12. Classification structure
#
#   <classification> is reusable. The enclosing structure identifies what is
#   being classified:
#
#       portfolio.classification...                 portfolio object
#       portfolio.crossmatch....classification...   matched catalog object
#       portfolio.detection....classification...    detection, where applicable
#
#   A classification record may carry a selected result and a set of named
#   assessment outputs:
#
#       classification.best.class
#       classification.best.probability
#       classification.assessment.snia_vs_nonia.probability
#       classification.assessment.fink_class.class
#
#   The assessment name is a broker/model output namespace. It is not required
#   to be a clean astrophysical class label. Method names, source-field names,
#   contrasts, and descriptions may be carried inside the assessment fields
#   rather than forced into a taxonomy before normalization.
#
#
# ---------------------------------------------------------------------------
# PRODUCER AND DELIVERY QUALIFIERS
# ---------------------------------------------------------------------------
#
# 13. Qualifier grammar
#
#   First-level semantic records may be qualified as:
#
#       <record>@<producer>:<channel>
#
#   @producer
#       Identifies who created the addressed record or datum. A producer may be
#       a survey, catalog, broker science module, classifier, instrument,
#       workflow, or internal Alertissimo module.
#
#   :channel
#       Identifies the broker, archive, API, service, cache, or other route
#       through which the record was received. It is delivery/audit information,
#       not a claim of scientific authorship.
#
#   Examples:
#
#       portfolio.summary@lsst.identity.object_id
#       portfolio.detection@lsst:lasair.photometry.g.psf.flux
#       portfolio.lightcurve@ztf:fink.r.points
#       portfolio.crossmatch@gaia:fink.identity.object_id
#       portfolio.classification@fink.best.class
#
#   The producer is the producer of the addressed value, not necessarily the
#   producer of the original alert packet. A single broker payload may therefore
#   split into several semantic records:
#
#       detection@lsst:fink          LSST detection delivered through Fink
#       classification@fink          Fink classification product
#       crossmatch@gaia:fink         Gaia catalog match exposed by Fink
#
#   If Fink classification is delivered through another system, for example
#   AMPEL, the path may be:
#
#       classification@fink:ampel
#
#   If AMPEL computes its own classification, the producer changes:
#
#       classification@ampel
#
#
# 14. Qualifier scope
#
#   In ordinary composition, @producer and :channel appear on first-level records
#   composed directly into their structural parent, normally <portfolio>. The
#   qualifier is inherited by nested fields of that record.
#
#   Valid:
#
#       portfolio.detection@lsst:lasair.position.ra
#       portfolio.lightcurve@alertissimo.r.points
#       portfolio.crossmatch@gaia:fink.astrometric_solution.parallax
#
#   Invalid as ordinary field qualification:
#
#       portfolio.detection.photometry.g@lsst.psf.flux
#       portfolio.lightcurve.r.points@ztf
#
#   Relation targets are the exception. A relation may point to another semantic
#   record by using the target record type with its qualifier:
#
#       portfolio.detection@subaru.relation.detection@lsst:fink
#
#   This is a reference to an existing detection record in the same portfolio,
#   not a nested copy of that detection and not a second first-level record.
#
#
# 15. Optional channel
#
#   :channel is optional. If omitted, the delivery route is direct, unspecified,
#   irrelevant to the semantic operation, or identical to the producer and not
#   required for audit.
#
#   More detailed method, version, schema, timing, or payload information belongs
#   in <provenance>, not in the main semantic path.
#
#
# ---------------------------------------------------------------------------
# PROVENANCE
# ---------------------------------------------------------------------------
#
# 16. Provenance as immediate context
#
#   <provenance> describes the immediately enclosing record or assertion. This
#   rule is important because provenance can appear at several depths:
#
#       detection.provenance
#           provenance of the detection record
#
#       detection.relation.provenance
#           provenance of the relation assertion
#
#       detection.relation.detection.provenance
#           provenance of the related detection after dereferencing the target
#
#   The canonical provenance roles are producer and channel. These mirror the
#   @producer:channel qualifier but may carry additional typed metadata:
#
#       provenance.producer.type
#       provenance.producer.name
#       provenance.producer.version
#       provenance.channel.type
#       provenance.channel.name
#
#   Synonyms such as broker, publisher, origin, survey, mediator, and delivery
#   may be useful in DSL/NLP parsing, but the semantic model should normalize
#   them to producer or channel rather than adding parallel canonical branches.
#
#
# ---------------------------------------------------------------------------
# RELATION
# ---------------------------------------------------------------------------
#
# 17. Relation as local audit/linkage
#
#   <relation> describes a local audit or linkage assertion made about the
#   enclosing record. It is not a first-level scientific product and should not
#   become a general graph ontology. Its main purpose is to express statements
#   such as confirmation, association, duplication, conflict, derivation, or
#   follow-up linkage without polluting the primary record vocabulary.
#
#   A relation may point to one or more detections already present in the same
#   portfolio:
#
#       detection@lsst:fink.relation.detection@lsst:lasair
#       detection@subaru.relation.detection@lsst:fink
#       detection@lsst:lasair.relation.detection@lvk:gcn
#
#   Relation targets are semantic references. They identify the target record
#   kind and qualifier; they do not guarantee that the visible path alone
#   uniquely identifies a concrete instance. If several Subaru detections are
#   present, middleware resolves the concrete target using internal record
#   anchors, identity fields, array positions, database keys, or other
#   semantically-unaware mechanisms. These implementation identifiers must not
#   leak into the public semantic path unless a specific export format chooses
#   to expose them separately.
#
#   The relation's own fields describe the assertion:
#
#       relation.type
#       relation.score
#       relation.basis
#       relation.provenance
#
#   For example:
#
#       portfolio.detection@lsst:fink.relation.type = confirmation
#       portfolio.detection@lsst:fink.relation.detection@lsst:lasair
#
#       portfolio.detection@subaru.relation.type = followup_of
#       portfolio.detection@subaru.relation.detection@lsst:fink
#
#       portfolio.detection@lsst:lasair.relation.type = association
#       portfolio.detection@lsst:lasair.relation.detection@lvk:gcn
#
#   Spatial, temporal, photometric, or localization quantities used to justify
#   the relation should remain in their proper semantic containers when they are
#   actual measured values. The relation records the assertion and its score or
#   basis; it does not absorb all evidence fields into a generic association
#   object.
#
#
# ---------------------------------------------------------------------------
# DATA PATH FORMATION
# ---------------------------------------------------------------------------
#
# 18. Concrete paths
#
#   Concrete paths are formed from:
#
#       - structural hierarchy
#       - first-level producer/channel qualification
#       - instantiable semantic containers
#       - parameter substitution
#       - resolvable fields
#
#   Examples:
#
#       portfolio.summary@lsst.identity.object_id
#       portfolio.summary@lsst.photometry.g.psf.mean
#       portfolio.detection@lsst:lasair.position.ra
#       portfolio.detection@lsst:lasair.photometry.g.aperture.flux
#       portfolio.detection@lsst:lasair.reference.nearest_source.separation.total
#       portfolio.detection@lsst:lasair.reference.forced_photometry.g.psf.flux
#       portfolio.lightcurve@ztf:fink.r.points
#       portfolio.crossmatch@gaia:fink.identity.object_id
#       portfolio.classification@fink.assessment.snia_vs_nonia.probability
#       portfolio.detection@subaru.relation.detection@lsst:fink
#
#
# ---------------------------------------------------------------------------
# IMPLEMENTATION NOTES
# ---------------------------------------------------------------------------
#
# 19. Parser requirements
#
#   A parser or Codex-generated implementation should:
#
#       - preserve declaration order
#       - preserve repeated level, $ref, and $refs directives
#       - treat levels as scoped metadata, not YAML keys to be overwritten
#       - apply level selection recursively down to fields
#       - keep singular semantic nouns in public paths
#       - avoid runtime array indexes in semantic paths
#       - treat dynamic fields as last-resort extension points
#       - resolve relation targets through implementation data structures, not
#         through visible semantic-path contortions
#
#
# 20. Scope
#
#   This specification does not define:
#
#       - broker-specific field mappings
#       - query syntax or transformation logic
#       - execution semantics
#       - runtime storage representation
#       - selector, reducer, or freshness operators
#       - internal record identifiers
#
#   It defines the semantic vocabulary, structural composition rules, level
#   metadata, cardinality, provenance qualification, and local relation grammar.
#
# ============================================================================

levels:
  L0: "Portfolio Aggregates - object identifiers and statistics"
  L1: "Single Detection Parameters - numerical"
  L2: "Specific Phenomena - solar system, gravitational waves"?
  L3: "Binary Data - cutout images etc"
  L4: "Light Curve Features - derived time-series"
  L5: "Machine learning - quality scores, metrics, classification"
  L6: "Data enrich - internal (broker) matching, external catalogs, crossmatch"
  L7: "Survey Aggregates - statistics"
  L8: "External services - name resolution, ephemeris, etc."

<position>:
  level: L0, L1
  unit: deg
  description: "Equatorial coordinates J2000"
  [ra]:
    description: "Right ascension"
  [dec]:
    description: "Declination"
  [ra_error]:
    description: "Right ascension error"
  [dec_error]:
    description: "Declination error"
  [ra_dec_covariance]:
    description: "Covariance between right ascension and declination"
    unit: deg2
  level: L1
  [image_x]:
    description: "X position in image"
    unit: pixels
  [image_y]:
    description: "Y position in image"
    unit: pixels
  [image_x_error]:
    description: "X-position uncertainty"
    unit: pixels
  [image_y_error]:
    description: "Y-position uncertainty"
    unit: pixels
  [distance_to_edge]:
    description: "Distance to nearest image edge"
    unit: pixels
  level: L1, L6
  [cone_distance]:
    description: "Angular distance from search center"
  level: L0, L6
  [constellation]:
    description: "Constellation name"

<time>:
  level: L1, L6
  unit: mjd
  description: "Time measurements (MJD)"
  [mjd]:
    description: "Modified Julian Date associated with the enclosing record"
  [exposure]:
    description: "Exposure duration"
    unit: sec
  level: L0
  description: "Historical temporal data"
  [first_detection]:
    description: "First detection datetime (human-readable)"
    unit: datetime
  [last_detection]:
    description: "Last detection datetime (human-readable)"
    unit: datetime
  [first_mjd]:
    description: "Earliest detection MJD"
  [last_mjd]:
    description: "Latest detection MJD"
  [timespan_days]:
    description: "Days between first and last detection"
    unit: days

<identity>:
  level: L1
  description: "Identifier(s) of a single observational event in its originating system"
  [source_id]:
    description: "Native detection/source identifier, e.g. ZTF candid, LSST diaSourceId"
  [alert_id]:
    description: "Native alert packet identifier, if different from source_id"
  [visit_id]:
  [exposure_id]:
  [detector_id]:
    description: "Detector or sensor identifier"
  [ccd_id]:
    description: "CCD identifier, where specifically applicable"
  [field_id]:
    description: "field ID"
  [night_id]:
    description: "Night ID"
  level: L0
  description: "Identifier(s) of an object"
  [object_id]:
    description: "Native object identifier"
  [{field}]:
    description: "Other specific object identifiers"

<_provenance_core>:
  [type]:
    description: "Type of provenance agent, e.g. survey, broker, archive, service, pipeline, model, instrument"
  [name]:
    description: "Name of the provenance agent"
  [id]:
    description: "Identifier of the provenance agent"
  [version]:
    description: "Version of the provenance agent"
  [schema_version]:
    description: "Schema version associated with the provenance agent"
  [science_version]:
    description: "Science module version"
  [method]:
    description: "Method, rule, or procedure used by the provenance agent"
  [{field}]:
    description: "Agent-specific additional field"

<provenance>:
  description: "Contextual provenance of the enclosing record or assertion"

  <producer>:
    description: "Agent that produced the enclosing record or assertion"
    $ref: <_provenance_core>
  
  <channel>:
    description: "Agent that delivered, exposed, or mediated the enclosing record or assertion"
    $ref: <_provenance_core>
  
  $ref: <time>(L6)
  
  [{field}]:
    description: "Provenance-specific additional field"

<separation>:
  level: L1
  unit: arcsec
  description: "Angular separation between two positions"
  [total]:
    description: "Total separation"
  [north]:
    description: "North-south component (negative = south)"
  [east]:
    description: "East-west component (negative = west)"

<redshift>:
  level: L1
  description: "Redshift measurements"
  [value]:
    description: "Redshift value"
  [error]:
    description: "Redshift uncertainty"
  [type]:
    description: "Spectroscopic or photometric"
    enum: [spec, photo]

<photometry>:
  description: "Photometric measurements"
  <{filter}>:
    level: L1, L6
    description: "Bandpass filter"
    [mag]:
      description: "Generic calibrated magnitude"
      unit: mag
    [mag_error]:
      description: "Generic calibrated magnitude uncertainty"
      unit: mag
    [flux]:
      description: "Generic calibrated flux"
    [flux_error]:
      description: "Generic calibrated flux uncertainty"
    [mag_minus_psf]:
      description: "Standard-aperture magnitude minus PSF-fit magnitude"
      unit: mag
    <aperture>:
      description: "Photometry measured by integrating flux within an aperture"
      [flux]:
        description: "Aperture flux"
      [flux_error]:
        description: "Aperture flux uncertainty"
      [mag]:
        description: "Aperture magnitude measured with the standard aperture (14-pixel diameter)"
        unit: mag
      [mag_error]:
        description: "Standard-aperture magnitude uncertainty"
        unit: mag
      <large>:
        description: "Photometry measured with the larger aperture (18-pixel diameter)"
        [mag]:
          description: "Large-aperture magnitude"
          unit: mag
        [mag_error]:
          description: "Large-aperture magnitude uncertainty"
          unit: mag
      <flags>:
        description: "Flags affecting the aperture-flux measurement"
        [failed]:
          description: "True if the aperture-flux measurement failed"
          type: boolean
        [aperture_truncated]:
          description: "True if the aperture was truncated by the available image region"
          type: boolean
    <limit>:
      description: "Photometric detection-limit information"
      [mag]:
        description: "Detection limiting magnitude, commonly defined at five sigma"
        unit: mag
      [mag_minus_aperture]:
        description: "Limiting magnitude minus the measured aperture magnitude"
        unit: mag
      [upper_limit]:
        description: "True if the photometric value represents an upper limit or non-detection"
        type: boolean
    <psf>:
      description: "Photometry obtained by fitting the point-spread function"
      [flux]:
        description: "PSF-fit flux"
      [flux_error]:
        description: "PSF-fit flux uncertainty"
      [mag]:
        description: "PSF-fit magnitude"
        unit: mag
      [mag_error]:
        description: "PSF-fit magnitude uncertainty"
        unit: mag
      [fit_chi2]:
        description: "Chi-square statistic of the PSF fit"
      [fit_log_likelihood]:
        description: "Log-likelihood of the PSF fit"
      [fit_ndata]:
        description: "Number of data values used in the PSF fit"
        type: integer
      [snr]:
        description: "Signal-to-noise ratio of the PSF-flux measurement"
      <flags>:
        description: "Flags affecting the PSF-flux measurement"
        [failed]:
          description: "True if the PSF-flux measurement failed"
          type: boolean
        [edge]:
          description: "True if the PSF-flux measurement was affected by an image edge"
          type: boolean
        [no_good_pixels]:
          description: "True if no usable pixels were available for the PSF-flux measurement"
          type: boolean
      level: L0
      [scatter_chi2]:
        description: "Chi-square statistic for the scatter of PSF flux around its weighted mean"
      [flux_error_mean]:
        description: "Mean of the individual PSF-flux uncertainties"
        unit: nJy
      [linear_intercept]:
        description: "Y-intercept of a linear model fitted to PSF flux as a function of time"
        unit: nJy
      [linear_slope]:
        description: "Slope of a linear model fitted to PSF flux as a function of time"
        unit: nJy/day
      [mad]:
        description: "Median absolute deviation of PSF flux without the scale factor for comparison to sigma"
        unit: nJy
      [maximum]:
        description: "Maximum PSF flux"
        unit: nJy
      [maximum_slope]:
        description: "Maximum ratio of a time-ordered PSF-flux difference to the elapsed time"
        unit: nJy/day
      [mean]:
        description: "Weighted mean PSF flux"
        unit: nJy
      [mean_error]:
        description: "Standard error of the weighted mean PSF flux"
        unit: nJy
      [minimum]:
        description: "Minimum PSF flux"
        unit: nJy
      [measurement_count]:
        description: "Number of PSF-flux measurements used to compute the aggregate statistics"
        type: integer
      [percentile_05]:
        description: "5th percentile of PSF flux"
        unit: nJy
      [percentile_25]:
        description: "25th percentile of PSF flux"
        unit: nJy
      [percentile_50]:
        description: "Median PSF flux"
        unit: nJy
      [percentile_75]:
        description: "75th percentile of PSF flux"
        unit: nJy
      [percentile_95]:
        description: "95th percentile of PSF flux"
        unit: nJy
      [sigma]:
        description: "Standard deviation of the PSF-flux distribution"
        unit: nJy
      [skew]:
        description: "Skewness of the PSF-flux distribution"
      [stetson_j]:
        description: "Stetson J statistic of the PSF-flux measurements"
    level: L0, L4
    [magnitude_rate]:
      description: "Rate of change of brightness"
      unit: mag/day
    [magnitude_rate_error]:
      description: "Uncertainty of the brightness-change rate"
      unit: mag/day
    [{field}]:
      description: "Other filter-specific photometric field"

<forced_photometry>:
