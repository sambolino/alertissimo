  [duration_t90_error]:
  [duration_t50]:
    unit: sec
  [duration_t50_error]:
  [trigger_id]:

<xray>:
  level: L2
  $ref: <_high_energy_core>

  [exposure]:
    unit: sec
  [upper_limit]:
  [pileup_fraction]:


<_data_product_core>:
  [type]:
    description: "Semantic data-product type"
    enum: [exposure, image, difference_image, stack, spectrum, cube, table, cutout, skymap, sequence, other]
  [format]:
    description: "Storage, serialization, or transport format"
    enum: [fits, hdf5, parquet, csv, votable, ascii, image, json, other]
  [uri]:
    description: "URI, URL, path, or archive pointer for the data product"
  [archive_id]:
    description: "Archive-side identifier for the data product"
  [mime_type]:
    description: "MIME type or media type, where available"
  [role]:
    description: "Processing role or reduction state of the product"
    enum: [raw, calibrated, reduced, derived, preview, auxiliary, other]
  [checksum]:
    description: "Checksum or integrity hash"
  [size]:
    description: "File or payload size, where available"
  [instrument_mode]:
    description: "Instrument setup, observing mode, filter, grism, grating, slit, readout mode, or configuration"
  [filter]:
    description: "Photometric filter or bandpass, where applicable"
  [wavelength_min]:
    description: "Lower wavelength bound covered by the product, where applicable"
    unit: Angstrom
  [wavelength_max]:
    description: "Upper wavelength bound covered by the product, where applicable"
    unit: Angstrom
  [{field}]:
    description: "Data-product-specific additional field"

<data_product>:
  level: L3, L6
  description: "Instrumental, archive, or file-level data product associated with the portfolio"
  $ref: <_data_product_core>
  $ref: <identity>(L1)
  $ref: <time>(L1, L6)
  $ref: <pointing>
  $ref: <provenance>
  $edges:
    --edge-- <detection>@{producer}:{channel}
    --edge-- <spectrum>@{producer}:{channel}

<spectrum>:
  level: L3, L6
  description: "Science-ready spectroscopic or wavelength-series product associated with a transient, source, or event"
  $ref: <identity>(L1, L6)
  $ref: <time>(L1, L6)
  $ref: <position>(L1, L6)
  $ref: <redshift>
  $ref: <quality>(L5)
  $ref: <provenance>
  [wavelength_min]:
    description: "Minimum wavelength covered by the spectrum"
    unit: Angstrom
  [wavelength_max]:
    description: "Maximum wavelength covered by the spectrum"
    unit: Angstrom
  [resolution]:
    description: "Spectral resolution, where reported"
  [resolving_power]:
    description: "Resolving power R = lambda / delta-lambda"
  [signal_to_noise]:
    description: "Signal-to-noise estimate for the spectrum"
  [exposure_count]:
    description: "Number of spectral exposures combined"
    type: integer
  [exposure_total]:
    description: "Total spectral exposure time"
    unit: sec
  [instrument_mode]:
    description: "Spectroscopic instrument mode, setup, grism, grating, slit, fiber, or configuration"
  <data_product>:
    level: L3
    description: "Spectrum data product, external file, or array payload"
    $ref: <_data_product_core>
    [wavelength]:
      description: "Wavelength array"
      type: array
      unit: Angstrom
    [flux_density]:
      description: "Spectral flux-density array"
      type: array
    [flux_density_error]:
      description: "Uncertainty array for spectral flux density"
      type: array
    [inverse_variance]:
      description: "Inverse-variance array"
      type: array
    [mask]:
      description: "Spectral mask or quality array"
      type: array
  <feature>:
    level: L2
    description: "Spectral line, band, continuum break, or other identified spectral feature"
    <{feature}>:
      [type]:
        description: "Type of spectral feature"
        enum: [emission_line, absorption_line, continuum_break, band, unidentified]
      [identification]:
        description: "Line or feature identification, e.g. H_alpha, Si_II_6355, Ca_II_HK"
      [rest_wavelength]:
        unit: Angstrom
      [observed_wavelength]:
        unit: Angstrom
      [flux]:
      [equivalent_width]:
        unit: Angstrom
      [fwhm]:
        unit: km/s
      [velocity]:
        unit: km/s
      [significance]:
  $edges:
    --edge-- <detection>@{producer}:{channel}
    --edge-- <crossmatch>@{producer}:{channel}
    --edge-- <data_product>@{producer}:{channel}
  [{field}]:
    description: "Spectrum-specific additional field"

<cutouts>:
  level: L3
  description: "Image cutouts"
  [science]:
    description: "Science image 2D array"
    type: array
  [template]:
    description: "Template image 2D array"
    type: array
  [difference]:
    description: "Difference image 2D array"
    type: array

<summary>:
  level: L0
  description: "Object-level aggregate summaries"
  $ref: <time>(L0)
  $ref: <identity>(L0)
  $ref: <position>(L0)
  $ref: <photometry>(L0)
  $ref: <forced_photometry>(L0)
  $ref: <color>(L0)
  [detection_count]:
    description: "Total number of detections for this object"
    type: integer
  [coverage_count]:
    description: "Number of times position fell on a relevant field or detector"
    type: integer
  [{field}]:
    description: "Origin- or mediator-specific aggregate field"

<reference>:
  level: L1
  description: "Reference image information"

  # Properties of the reference stack itself
  [nframes]:
    description: "Number of frames (epochal images) used to generate the reference image"
    type: integer
  $ref: <time>(L0) # first_mjd and last_mjd of the exposures used in reference stack
  $ref: <forced_photometry>(L1) # forced measurement at the detection/object position on the reference image

  # The nearest source in the reference PSF catalog
  <nearest_source>:
    $ref: <identity> # id of the source
    $ref: <provenance> # description of the catalog
    $ref: <position>(L1)
    $ref: <separation>
    $ref: <photometry>(L1) # magnitude of the source
    $ref: <image_metrics> # e.g. DAOPhot chi and sharpness of the nearest source
    $ref: <astrometric_solution>

<crossmatch>:
  level: L6
  description: "External catalog cross-match record"
  $ref: <identity>
  $ref: <position>
  $ref: <separation>
  $ref: <redshift>
  $ref: <photometry>
  $ref: <classification>
  $ref: <provenance>
  $ref: <astrometric_solution>
  [{field}]:
    description: "Catalog-specific additional fields"

<_lightcurve_point>:
  $ref: <time>(L1)
  $ref: <photometry>(L1)
  $ref: <quality>(L1)
  $ref: <identity>(L1)
  $ref: <provenance>

<lightcurve>:
  level: L4
  description: "Time-series of photometric points"
  $ref: <provenance>
  <{filter}>:
    <points>:
      type: array
      items:
        $ref: <_lightcurve_point>
    $ref: <photometry>(L4)    
    [rate_lower_percentile]:
    [rate_upper_percentile]:
    [delta_time_rate]:
      unit: days
    [from_upper_limit]:
      type: boolean
    [feature_vector]:
      description: "Serialized feature vector (e.g. lc_features_g)"

<survey>:
  level: L7
  description: "Survey-level statistics"
  [class_distribution]:
    description: "Counts per classification"
    type: object
    dynamic: true
  [filter_counts]:
    description: "Alert counts per filter"
    type: object
  [exposure_count]:
    description: "Number of exposures"
    type: integer
  [field_count]:
    description: "Number of fields"
    type: integer
  [raw_alerts]:
    description: "Total raw alerts"
    type: integer
  [science_alerts]:
    description: "Science-quality alerts"
    type: integer

<resolver>:
  level: L8
  description: "Name resolution service"
  [catalog]:
    description: "Resolver source"
    enum: [simbad, tns, ssodnet]
  [external_id]:
    description: "Object ID in external catalog"
    type: integer
  [type_code]:
    description: "Object type code from external catalog"
  [position_string]:
    description: "J2000 position as string (HH:MM:SS ±DD:MM:SS)"
  [external_name]:
    description: "Object name in external catalog"
  [redshift]:
    description: "Redshift if available"
  [reference_count]:
    description: "Number of references"
    type: integer
  $ref: <position>
  
--edge--:
  abstract: true
  level: L6
  description: "Abstract connection between semantic records"
  [score]:
    description: "Confidence, agreement, or relevance score for the edge"
    type: float
    range: [0, 1]
  [basis]:
    description: "Criterion or explanation used to establish the edge"
  [time_delta]:
    description: "Time difference between related records, where applicable"
    unit: days
  [time_window]:
    description: "Temporal coincidence or search window used to establish the edge"
  $ref: <provenance>
  [{field}]:
    description: "Edge-specific additional field"

--association--:
  $is: --edge--
  description: "The participating records are scientifically associated"
  [spatial_probability]:
    description: "Probability or score from spatial overlap"
    type: float
    range: [0, 1]
  [temporal_probability]:
    description: "Probability or score from temporal coincidence"
    type: float
    range: [0, 1]
  [joint_probability]:
    description: "Combined association probability"
    type: float
    range: [0, 1]
  [chance_coincidence_probability]:
    description: "Estimated probability of a chance association"
    type: float
    range: [0, 1]

--confirmation--:
  $is: --edge--
  description: "The participating records confirm the same underlying event, source, detection, or assertion"
  [agreement]:
    description: "Description or score of the agreement between participating records"

--duplicate--:
  $is: --edge--
  description: "The participating records are considered duplicate representations of the same underlying record or event"

--conflict--:
  $is: --edge--
  description: "The participating records contain a meaningful conflict"
  [conflict_field]:
    description: "Field, concept, or assertion in conflict"
  [conflict_description]:
    description: "Human-readable description of the conflict"

--followup_of-->:
  $is: --edge--
  description: "The subject record was obtained as follow-up of the target record"
  [request_id]:
    description: "Identifier of the follow-up request"
  [observer]:
    description: "Observer, team, facility, or program responsible for the follow-up"
  [telescope_mode]:
    description: "Telescope or observing mode used for the follow-up"
  [requested_filter]:
    description: "Requested photometric filter or observing band"
  [program_id]:
    description: "Observing program identifier"

--derived_from-->:
  $is: --edge--
  description: "The subject record was derived from the target record"
  [method]:
    description: "Method, rule, or procedure used to derive the subject record"

--canonical_for-->:
  $is: --edge--
  description: "The subject record is the preferred or canonical representation for the target record or group"
  [selection_rule]:
    description: "Rule or criterion used to choose the canonical record"

--revision_of-->:
  $is: --edge--
  description: "The subject record is a revision, update, correction, or retraction of the target record"
  [status]:
    description: "Revision status"
    enum: [preliminary, initial, update, correction, retraction, final]
  [sequence]:
    description: "Revision sequence number"
  [superseded_fields]:
    description: "Fields changed or superseded by this revision"

<detection>:
  description: "Single detection, observation, alert, or event record"
  [type]:
    description: "Canonical high-level detection or messenger type"
    enum: [optical, infrared, ultraviolet, xray, gamma_ray, radio, solar_system, gravitational_wave, neutrino, satellite, multimessenger, other]

  # Generic record structure
  $ref: <position>(L1)
  $ref: <localization>
  $ref: <time>(L1)
  $ref: <identity>(L1)
  $ref: <quality>(L1)
  $ref: <pointing>
  $ref: <provenance>

  # Optical / imaging detection content
  $ref: <photometry>(L1)
  $ref: <forced_photometry>(L1)
  $ref: <image_metrics>
  $ref: <reference>
  $ref: <calibration>
  $ref: <color>

  # General physical / contextual content
  $ref: <separation>
  $ref: <redshift>

  # Phenomenon-specific content
  $ref: <solar_system>
  $ref: <gravitational_wave>
  $ref: <neutrino>
  $ref: <radio>
  $ref: <xray>
  $ref: <gamma_ray>
  $ref: <satellite>

  # Connection layer
  $edges:
    --edge-- <detection>@{producer}:{channel}

  [{field}]:
    description: "Detection-specific additional field"


<portfolio>:
  $refs: <summary>@{producer}:{channel}
  $refs: <detection>@{producer}:{channel}
  $refs: <crossmatch>@{producer}:{channel}
  $refs: <lightcurve>@{producer}:{channel}
  $refs: <spectrum>@{producer}:{channel}
  $refs: <data_product>@{producer}:{channel}
  $refs: <classification>@{producer}:{channel}

