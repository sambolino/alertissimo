# ============================================================================
# SEMANTICS RECIPE
# ============================================================================
# This file defines a level-aware semantic model for heterogeneous astronomical
# transient data. The aim is to provide a common language in which detections,
# summaries, classifications, light curves, crossmatches, provenance, and
# record-to-record links can be described without adopting the native vocabulary
# of any one broker, survey, catalog, or transport format.
#
# The model is intentionally readable. A semantic path should be useful to a
# human scientist, to a mapping file, and to code that must normalize data from
# heterogeneous streams. The same notation is also intended to support higher
# level DSL expressions, but the semantic catalog is not itself the query
# language. It defines the vocabulary and structural rules on which such a
# language can rely.
#
# This is an ordered YAML-like domain-specific notation, not ordinary YAML.
# Repeated directives such as level, $ref, and $refs are meaningful. Their
# order and scope must be preserved by the parser. A standard YAML parser that
# overwrites duplicate keys is therefore not sufficient.
#
#
# ---------------------------------------------------------------------------
# CORE ELEMENTS
# ---------------------------------------------------------------------------
#
# 1. Semantic containers
#
#   <container>
#       Instantiable, path-bearing semantic grouping. Its name is preserved
#       when composed into another structure.
#
#       Example:
#
#           <detection>:
#             $ref: <photometry>(L1)
#
#       allows paths such as:
#
#           detection.photometry.g.psf.flux
#
#       The container name is part of the meaning. It should not be introduced
#       merely to mirror a storage layout or a broker payload section.
#
#
# 2. Fields
#
#   [field]
#       Resolvable value-bearing semantic element. A field may be a leaf or may
#       contain nested fields.
#
#       Examples:
#
#           [ra]
#           [object_id]
#           [flux]
#           [probability]
#
#       A field name should describe the value, not its accidental source name.
#       Source names that cannot yet be normalized may be carried by dynamic
#       fields or by mapping metadata.
#
#
# 3. Parameterized containers and dynamic fields
#
#   <{parameter}>
#       Runtime-resolved, path-bearing semantic container. Used when the
#       substituted value forms a namespace with fields or subcontainers below
#       it.
#
#       Example:
#
#           <photometry>:
#             <{filter}>:
#               <psf>:
#                 [flux]
#
#       allows:
#
#           photometry.g.psf.flux
#           photometry.r.psf.flux
#
#       Parameterized containers are appropriate for filters, named
#       classification outputs, color pairs, or other runtime values that behave
#       as semantic namespaces.
#
#   [{field}]
#       Dynamic resolvable extension field or terminal runtime field. Used for
#       producer-, broker-, catalog-, or method-specific values not yet
#       represented in the stable vocabulary. It may also represent a parameter
#       that terminates the path rather than carrying descendants.
#
#       Dynamic fields are escape hatches. They should not replace a stable
#       reusable concept once that concept is clear.
#
#
# 4. Internal projections and reusable traits
#
#   <_name>
#       Non-instantiable field projection or reusable trait. An underscored
#       element never appears as a semantic path component.
#
#       A projection can import the contents of a semantic container without
#       importing the container name itself:
#
#           <forced_photometry>:
#             $ref: <_photometry>
#
#       allows:
#
#           forced_photometry.g.psf.flux
#
#       not:
#
#           forced_photometry.photometry.g.psf.flux
#
#       A trait can also be declared explicitly:
#
#           <_classification_core>:
#             [class]
#             [probability]
#
#           <classification>:
#             <best>:
#               $ref: <_classification_core>
#
#       allows:
#
#           classification.best.class
#           classification.best.probability
#
#       The underscored trait name is never propagated into the path.
#
#
# 4b. Edge carriers
#
#   --edge--
#       Abstract or concrete connection carrier between semantic records. Edges
#       are not dot-path containers and do not appear as children of the noun
#       data tree. They belong to the connection plane.
#
#       Examples:
#
#           detection@vidojevica --followup_of--> detection@lsst:fink
#           detection@lsst:fink --association-- detection@lvk:gcn
#
#       The arrow, or lack of arrow, is part of the edge name. Direction is
#       therefore explicit in the carrier symbol itself:
#
#           --followup_of-->     directional
#           --association--      nondirectional
#
#       Edge carriers may have their own fields such as score, basis,
#       time_delta, request_id, or provenance. These fields describe the
#       connection assertion itself, not the subject record and not the target
#       record.
#
#   $is: --edge--
#       Declares that a concrete edge carrier is a kind of the abstract edge
#       carrier. This is edge-plane inheritance, not noun-plane composition.
#       It does not create dot-path segments and does not propagate fields into
#       the subject or target records.
#
#   $edges:
#       Declares the allowed edge participation of the enclosing record. If the
#       declared edge is abstract, any concrete edge whose $is chain resolves to
#       that abstract edge is allowed.
#
#
# ---------------------------------------------------------------------------
# REFERENCES, CARDINALITY, AND OPTIONALITY
# ---------------------------------------------------------------------------
#
# 5. Single references
#
#   $ref: <container>
#       Allows one instance of an instantiable semantic container to appear in
#       the current structure. The referenced container name remains in the
#       path.
#
#   $ref: <container>(Ln)
#       Allows fields of the referenced container that are valid at the selected
#       level. Level selection is recursive and field-based. Ancestor containers
#       needed to reach selected fields are retained as path scaffolding; sibling
#       fields whose levels do not match are not selected.
#
#       Example:
#
#           <summary>:
#             $ref: <photometry>(L0)
#
#       may allow both:
#
#           summary.photometry.g.magnitude_rate
#           summary.photometry.g.psf.mean
#
#       while not implying L1 detection measurements such as:
#
#           summary.photometry.g.psf.fit_chi2
#
#   $ref: <_container>
#       Imports only the referenced contents. The underscored source is not
#       instantiable and does not add a path component.
#
#   Important:
#       A reference is permissive, not mandatory. It declares that the enclosing
#       structure may carry semantically compatible fields from the referenced
#       concept. It does not require every record instance to contain all fields
#       made available by the reference, and it does not require a normalizer to
#       materialize absent fields. Presence, absence, reduction, and storage are
#       runtime matters.
#
#
# 6. Repeated references
#
#   $refs: <container>
#       Declares that the current structure may collect zero or more instances
#       of the referenced semantic entity.
#
#       Example:
#
#           <portfolio>:
#             $refs: <summary>
#             $refs: <detection>
#             $refs: <crossmatch>
#
#       $refs defines semantic cardinality. It does not pluralize the semantic
#       noun and does not expose runtime array indexes in semantic paths.
#
#       Repeated instances may have the same semantic path:
#
#           portfolio.detection@lsst:fink
#           portfolio.detection@lsst:fink
#           portfolio.detection@lsst:fink
#
#       The path identifies the kind of record and its semantic qualification,
#       not necessarily one concrete instance. Implementations may use internal
#       record identifiers, array positions, database keys, or object anchors to
#       connect concrete instances. Such identifiers are storage details and are
#       not part of the public semantic path grammar.
#
#
# 7. Intrinsically multi-valued fields
#
#   type: array
#       Used when a single field value is intrinsically a list or array. This is
#       distinct from repeated semantic entities declared with $refs.
#
#       Examples:
#
#           cutouts.science
#           lightcurve.points
#
#
# ---------------------------------------------------------------------------
# LEVELS
# ---------------------------------------------------------------------------
#
# 8. Semantic levels
#
#   Levels describe the conceptual context in which fields normally apply:
#
#       L0  - Object/portfolio summaries, identities, and aggregate properties
#       L1  - Single-detection measurements and metadata
#       L2  - Phenomenon-specific information, e.g. Solar System, GW, neutrino,
#             radio, X-ray, or gamma-ray content
#       L3  - Binary, image, spectrum, and data-product content
#       L4  - Light curves and derived time-series products
#       L5  - Quality scores, classification, and machine-learning outputs
#       L6  - Enrichment, linkage, crossmatch, and external catalog information
#       L7  - Survey-level aggregates
#       L8  - External services such as resolvers and ephemerides
#
#   Levels are descriptive metadata used for documentation, validation, sanity
#   checks, and future tooling. They are not semantic path components.
#
#   Level declarations are scoped and ordered:
#
#       - a level declared on a container applies to descendants that follow it
#       - a later level declaration at the same scope applies to following
#         fields and subcontainers until another level declaration appears
#       - an individual field may override the inherited level
#       - one semantic container may therefore carry fields from several levels
#
#   A field may be valid at more than one level:
#
#       [magnitude_rate]:
#         level: L0, L4
#
#   Such a field may appear in an object summary and in a light-curve product.
#   The path context determines the role.
#
#
# ---------------------------------------------------------------------------
# PORTFOLIO RECORDS AND STRUCTURAL CONTEXT
# ---------------------------------------------------------------------------
#
# 9. Portfolio root
#
#   <portfolio> is the object-centric root. It collects first-level semantic
#   records rather than forcing all information into a single object tree.
#   Object-level identity and aggregate projections belong in <summary>.
#
#   Current first-level record types are:
#
#       summary
#       detection
#       crossmatch
#       lightcurve
#       spectrum
#       data_product
#       classification
#
#   The model deliberately keeps these nouns singular. Cardinality is expressed
#   by $refs and runtime representation, not by plural path names.
#
#
# 10. Generic detection
#
#   <detection> is the generic atomic observational, alert, or event record.
#   Optical alerts, radio detections, X-ray and gamma-ray notices, Solar System
#   detections, GW notices, and neutrino events should not require separate
#   first-level portfolio branches merely because their producers or messengers
#   differ.
#
#   The producer/channel qualifier may strongly suggest the expected profile:
#
#       portfolio.detection@lsst:fink
#       portfolio.detection@lvk:gcn
#       portfolio.detection@icecube:gcn
#
#   but the formal semantic content is expressed by the branches present inside
#   the detection:
#
#       detection.photometry...
#       detection.localization...
#       detection.gravitational_wave...
#       detection.neutrino...
#       detection.radio...
#       detection.xray...
#       detection.gamma_ray...
#       detection.solar_system...
#
#   A reference from <detection> to a phenomenon-specific container allows that
#   content; it does not imply that every detection carries it.
#
#   The optional detection.type field is a controlled high-level hint used for
#   filtering and validation. It does not replace the structural branches: a
#   record with detection.type = radio should still express radio-specific
#   content under detection.radio where such data are available.
#
#
#
# 10b. Position, localization, pointing, spectra, and data products
#
#   position and localization are siblings, not parent and child. A record may
#   have a best-fit point position, a broad probability region, both, or only a
#   sky map. Do not put position inside localization; this would create paths
#   such as localization.position.ra and obscure the distinction between a point
#   estimate and an uncertainty/probability region.
#
#       detection@icecube:gcn.position.ra
#       detection@icecube:gcn.localization.radius_90
#       detection@lvk:gcn.localization.skymap
#
#   pointing describes the telescope, spacecraft, or detector orientation. It is
#   not the same as the source position or event localization.
#
#       detection@swift:gcn.pointing.ra
#       detection@swift:gcn.pointing.roll
#
#   spectra and data products are first-level payload-bearing records when the
#   payload is not an atomic detection/report. A reduced one-dimensional
#   wavelength-flux product should be modeled as spectrum; a raw exposure,
#   calibrated image, cutout, table, cube, sky map file, or other format-bearing
#   artifact should be modeled as data_product. FITS, VOTable, HDF5, and similar
#   values are formats, not semantic record classes.
#
#       portfolio.spectrum@gemini:archive.data_product.uri
#       portfolio.data_product@gemini:archive.format
#       portfolio.spectrum@gemini:archive --followup_of--> portfolio.detection@lsst:fink
#       portfolio.data_product@gemini:archive --followup_of--> portfolio.detection@lsst:fink
#       portfolio.spectrum@gemini:archive --derived_from--> portfolio.data_product@gemini:archive
#
#   Use the most semantic record available. If an archive result is an atomic
#   observation/report, use detection. If it is a time series, use lightcurve.
#   If it is a wavelength-series product, use spectrum. If it is primarily a
#   file, image, table, cube, or archive artifact, use data_product. If it is a
#   reduced external catalog/enrichment row, use crossmatch.
#
#
# 11. Structural context carries meaning
#
#   Do not repeat information already expressed by the enclosing hierarchy.
#
#       detection.forced_photometry.g.psf.flux
#
#   means forced photometry on the science/detection side, while:
#
#       detection.reference.forced_photometry.g.psf.flux
#
#   means forced photometry on the reference/template image.
#
#   Fields such as science_flux and template_flux are therefore unnecessary in
#   the semantic vocabulary. The reusable container supplies the measurement
#   concept; the parent structure supplies the role.
#
#
# 12. Classification structure
#
#   <classification> is reusable. The enclosing structure identifies what is
#   being classified:
#
#       portfolio.classification...                 portfolio object
#       portfolio.crossmatch....classification...   matched catalog object
#       portfolio.detection....classification...    detection, where applicable
#
#   A classification record may carry a selected result and a set of named
#   assessment outputs:
#
#       classification.best.class
#       classification.best.probability
#       classification.assessment.snia_vs_nonia.probability
#       classification.assessment.fink_class.class
#
#   The assessment name is a broker/model output namespace. It is not required
#   to be a clean astrophysical class label. Method names, source-field names,
#   contrasts, and descriptions may be carried inside the assessment fields
#   rather than forced into a taxonomy before normalization.
#
#
# ---------------------------------------------------------------------------
# PRODUCER AND DELIVERY QUALIFIERS
# ---------------------------------------------------------------------------
#
# 13. Qualifier grammar
#
#   First-level semantic records may be qualified as:
#
#       <record>@<producer>:<channel>
#
#   @producer
#       Identifies who created the addressed record or datum. A producer may be
#       a survey, catalog, broker science module, classifier, instrument,
#       workflow, or internal Alertissimo module.
#
#   :channel
#       Identifies the broker, archive, API, service, cache, or other route
#       through which the record was received. It is delivery/audit information,
#       not a claim of scientific authorship.
#
#   Examples:
#
#       portfolio.summary@lsst.identity.object_id
#       portfolio.detection@lsst:lasair.photometry.g.psf.flux
#       portfolio.lightcurve@ztf:fink.r.points
#       portfolio.crossmatch@gaia:fink.identity.object_id
#       portfolio.classification@fink.best.class
#
#   The producer is the producer of the addressed value, not necessarily the
#   producer of the original alert packet. A single broker payload may therefore
#   split into several semantic records:
#
#       detection@lsst:fink          LSST detection delivered through Fink
#       classification@fink          Fink classification product
#       crossmatch@gaia:fink         Gaia catalog match exposed by Fink
#
#   If Fink classification is delivered through another system, for example
#   AMPEL, the path may be:
#
#       classification@fink:ampel
#
#   If AMPEL computes its own classification, the producer changes:
#
#       classification@ampel
#
#
# 14. Qualifier scope
#
#   In ordinary composition, @producer and :channel appear on first-level records
#   composed directly into their structural parent, normally <portfolio>. The
#   qualifier is inherited by nested fields of that record.
#
#   Valid:
#
#       portfolio.detection@lsst:lasair.position.ra
#       portfolio.lightcurve@alertissimo.r.points
#       portfolio.crossmatch@gaia:fink.astrometric_solution.parallax
#
#   Invalid as ordinary field qualification:
#
#       portfolio.detection.photometry.g@lsst.psf.flux
#       portfolio.lightcurve.r.points@ztf
#
#   Edge participants are the exception. A connection may point to another
#   semantic record by using the record type with its qualifier:
#
#       portfolio.detection@vidojevica --followup_of--> portfolio.detection@lsst:fink
#       portfolio.detection@lsst:fink --association-- portfolio.detection@lvk:gcn
#
#   This is a reference to an existing record in the same portfolio, not a nested
#   copy of that record and not a second first-level record. Edge expressions are
#   connection-plane expressions, not ordinary dot-path field qualification.
#
#
# 15. Optional channel
#
#   :channel is optional. If omitted, the delivery route is direct, unspecified,
#   irrelevant to the semantic operation, or identical to the producer and not
#   required for audit.
#
#   More detailed method, version, schema, timing, or payload information belongs
#   in <provenance>, not in the main semantic path.
#
#
# ---------------------------------------------------------------------------
# PROVENANCE
# ---------------------------------------------------------------------------
#
# 16. Provenance as immediate context
#
#   <provenance> describes the immediately enclosing record or assertion. This
#   rule is important because provenance can appear at several depths:
#
#       detection.provenance
#           provenance of the detection record
#
#       edge.provenance
#           provenance of a connection assertion
#
#       target_record.provenance
#           provenance of a related record after resolving an edge target
#
#   The canonical provenance roles are producer and channel. These mirror the
#   @producer:channel qualifier but may carry additional typed metadata:
#
#       provenance.producer.type
#       provenance.producer.name
#       provenance.producer.version
#       provenance.producer.detector_status.status
#       provenance.channel.type
#       provenance.channel.name
#
#   Detector status belongs to the producer side when it describes the reporting
#   instrument or detector at the time of the enclosing record. It should not be
#   confused with the channel that delivered the record.
#
#   Synonyms such as broker, publisher, origin, survey, mediator, and delivery
#   may be useful in DSL/NLP parsing, but the semantic model should normalize
#   them to producer or channel rather than adding parallel canonical branches.
#
#
# ---------------------------------------------------------------------------
# EDGE PLANE
# ---------------------------------------------------------------------------
#
# 17. Edges as connection carriers
#
#   Dot paths describe contained data. Edges describe connections between
#   semantic records. The edge plane is separate from the noun/data plane:
#
#       portfolio.detection@lsst:fink.photometry.g.psf.flux
#           contained data field
#
#       portfolio.detection@vidojevica --followup_of--> portfolio.detection@lsst:fink
#           directed connection between records
#
#       portfolio.detection@lsst:fink --association-- portfolio.detection@lvk:gcn
#           nondirectional connection between records
#
#   Edge carrier symbols are meaningful. A symbol with an arrow is directional;
#   a symbol without an arrow is nondirectional. No additional direction field is
#   needed in the edge definition.
#
#   The abstract edge carrier is:
#
#       --edge--
#
#   Concrete edge carriers declare:
#
#       $is: --edge--
#
#   This means that the concrete edge inherits the abstract edge's edge-scoped
#   fields, constraints, and metadata. It is not equivalent to $ref in the noun
#   model. Inherited edge fields belong to the edge instance itself and must not
#   be exposed as dot-path children of either participating record.
#
#   A record declares possible edge participation with $edges:
#
#       <detection>:
#         $edges:
#           --edge-- <detection>@{producer}:{channel}
#
#   If the named edge carrier is abstract, any concrete edge whose $is chain
#   resolves to that carrier is allowed. Thus a detection can participate in
#   --association--, --confirmation--, --followup_of-->, --revision_of-->, or
#   another registered edge type derived from --edge--, while the target
#   constraint still says that the other participant is a detection record.
#
#   Edge instances may carry scores, basis text, timing windows, provenance, and
#   edge-type-specific fields. Spatial, temporal, photometric, localization, or
#   radio quantities used as evidence should remain in their proper semantic
#   containers when they are measured data. The edge records the connection
#   assertion and its supporting metadata; it does not absorb all evidence into a
#   generic relation object.
#
#   Revisions are modeled as edge-plane connections for now. Use --revision_of-->
#   to link an update, correction, or retraction to the record it supersedes,
#   rather than introducing a separate revision container in the noun/data plane.
#
#
# ---------------------------------------------------------------------------
# DATA PATH FORMATION
# ---------------------------------------------------------------------------
#
# 18. Concrete paths
#
#   Concrete paths are formed from:
#
#       - structural hierarchy
#       - first-level producer/channel qualification
#       - instantiable semantic containers
#       - parameter substitution
#       - resolvable fields
#
#   Examples:
#
#       portfolio.summary@lsst.identity.object_id
#       portfolio.summary@lsst.photometry.g.psf.mean
#       portfolio.detection@lsst:lasair.position.ra
#       portfolio.detection@lvk:gcn.localization.skymap
#       portfolio.detection@fermi_gbm:gcn.gamma_ray.duration_t90
#       portfolio.detection@swift_xrt:gcn.xray.flux
#       portfolio.detection@lsst:lasair.photometry.g.aperture.flux
#       portfolio.detection@lsst:lasair.reference.nearest_source.separation.total
#       portfolio.detection@lsst:lasair.reference.forced_photometry.g.psf.flux
#       portfolio.lightcurve@ztf:fink.r.points
#       portfolio.spectrum@gemini:archive.feature.si_ii_6355.velocity
#       portfolio.data_product@gemini:archive.uri
#       portfolio.crossmatch@gaia:fink.identity.object_id
#       portfolio.classification@fink.assessment.snia_vs_nonia.probability
#
#   Connection-plane example:
#
#       portfolio.detection@vidojevica --followup_of--> portfolio.detection@lsst:fink
#
#
# ---------------------------------------------------------------------------
# IMPLEMENTATION NOTES
# ---------------------------------------------------------------------------
#
# 19. Parser requirements
#
#   A parser or Codex-generated implementation should:
#
#       - preserve declaration order
#       - preserve repeated level, $ref, and $refs directives
#       - treat levels as scoped metadata, not YAML keys to be overwritten
#       - apply level selection recursively down to fields
#       - keep singular semantic nouns in public paths
#       - avoid runtime array indexes in semantic paths
#       - treat dynamic fields as last-resort extension points
#       - track dynamic [{field}] usage and promote repeated concepts into the
#         stable vocabulary through a controlled process
#       - normalize source aliases to canonical enum values where a controlled
#         vocabulary exists, while warning on unknown extension values
#       - reject or warn against accidental interpretation by ordinary YAML
#         loaders that would overwrite repeated keys
#       - expose an effective-level view for each resolved field
#       - provide an explain-path command showing how a semantic path was formed
#       - resolve edge participants through implementation data structures, not
#         through visible semantic-path contortions
#
#
# 20. Scope
#
#   This specification does not define:
#
#       - broker-specific field mappings
#       - query syntax or transformation logic
#       - execution semantics
#       - runtime storage representation
#       - selector, reducer, or freshness operators
#       - internal record identifiers
#
#   It defines the semantic vocabulary, structural composition rules, level
#   metadata, cardinality, provenance qualification, and edge grammar.
#
# ============================================================================

levels:
  L0: "Portfolio Aggregates - object identifiers and statistics"
  L1: "Single Detection Parameters - numerical"
  L2: "Specific Phenomena - solar system, gravitational waves, neutrinos, radio, X-ray, gamma-ray, satellites"
  L3: "Binary, image, spectrum, and data-product content"
  L4: "Light Curve Features - derived time-series"
  L5: "Machine learning - quality scores, metrics, classification"
  L6: "Data enrich - internal (broker) matching, external catalogs, crossmatch"
  L7: "Survey Aggregates - statistics"
  L8: "External services - name resolution, ephemeris, etc."

<position>:
  level: L0, L1
  unit: deg
  description: "Equatorial coordinates J2000"
  [ra]:
    description: "Right ascension"
  [dec]:
    description: "Declination"
  [ra_error]:
    description: "Right ascension error"
  [dec_error]:
    description: "Declination error"
  [ra_dec_covariance]:
    description: "Covariance between right ascension and declination"
    unit: deg2
  level: L1
  [image_x]:
    description: "X position in image"
    unit: pixels
  [image_y]:
    description: "Y position in image"
    unit: pixels
  [image_x_error]:
    description: "X-position uncertainty"
    unit: pixels
  [image_y_error]:
    description: "Y-position uncertainty"
    unit: pixels
  [distance_to_edge]:
    description: "Distance to nearest image edge"
    unit: pixels
  level: L1, L6
  [cone_distance]:
    description: "Angular distance from search center"
  level: L0, L6
  [constellation]:
    description: "Constellation name"

<localization>:
  level: L1, L2, L6
  description: "Spatial probability, uncertainty, or counterpart-search region associated with a record"
  [type]:
    description: "Localization representation"
    enum: [point, error_circle, ellipse, region, skymap, polygon, other]
  [radius]:
    description: "Angular localization radius, where a circular approximation is used"
    unit: deg
  [radius_50]:
    description: "Radius of the 50 percent credible region, where applicable"
    unit: deg
  [radius_90]:
    description: "Radius of the 90 percent credible region, where applicable"
    unit: deg
  [area_50]:
    description: "Area of the 50 percent credible region"
    unit: deg2
  [area_90]:
    description: "Area of the 90 percent credible region"
    unit: deg2
  [credible_level]:
    description: "Credible or containment probability associated with the represented region"
    type: float
    range: [0, 1]
  [systematic_included]:
    description: "Whether systematic uncertainty is included"
    type: boolean
  [skymap]:
    description: "Reference, URI, identifier, or serialized pointer for a sky-probability map"
  [{field}]:
    description: "Localization-specific additional field"

<pointing>:
  level: L2, L6
  description: "Instrument, spacecraft, or telescope pointing information"
  [ra]:
    description: "Pointing right ascension"
    unit: deg
  [dec]:
    description: "Pointing declination"
    unit: deg
  [roll]:
    description: "Roll angle"
    unit: deg
  [position_angle]:
    description: "Position angle"
    unit: deg
  [attitude_quaternion]:
    description: "Attitude quaternion"
    type: array
  [rotation_rate]:
    description: "Rotation-rate vector"
    type: array
    unit: rad/s
  $ref: <time>(L2, L6)
  [{field}]:
    description: "Pointing-specific additional field"

<time>:
  level: L1, L2, L5, L6
  unit: mjd
  description: "Time measurements (MJD)"
  [mjd]:
    description: "Modified Julian Date associated with the enclosing record"
  [exposure]:
    description: "Exposure duration"
    unit: sec
  level: L0
  description: "Historical temporal data"
  [first_detection]:
    description: "First detection datetime (human-readable)"
    unit: datetime
  [last_detection]:
    description: "Last detection datetime (human-readable)"
    unit: datetime
  [first_mjd]:
    description: "Earliest detection MJD"
  [last_mjd]:
    description: "Latest detection MJD"
  [timespan_days]:
    description: "Days between first and last detection"
    unit: days

<identity>:
  level: L1
  description: "Identifier(s) of a single observational event in its originating system"
  [source_id]:
    description: "Native detection/source identifier, e.g. ZTF candid, LSST diaSourceId"
  [alert_id]:
    description: "Native alert packet identifier, if different from source_id"
  [visit_id]:
  [exposure_id]:
  [detector_id]:
    description: "Detector or sensor identifier"
  [ccd_id]:
    description: "CCD identifier, where specifically applicable"
  [field_id]:
    description: "field ID"
  [night_id]:
    description: "Night ID"
  level: L0
  description: "Identifier(s) of an object"
  [object_id]:
    description: "Native object identifier"
  [{field}]:
    description: "Other specific object identifiers"

<_provenance_core>:
  [type]:
    description: "Canonical provenance-agent type"
    enum: [survey, catalog, broker, archive, service, facility, instrument, detector, pipeline, model, program, human, other]
  [name]:
    description: "Name of the provenance agent"
  [id]:
    description: "Identifier of the provenance agent"
  [version]:
    description: "Version of the provenance agent"
  [schema_version]:
    description: "Schema version associated with the provenance agent"
  [science_version]:
    description: "Science module version"
  [method]:
    description: "Method, rule, or procedure used by the provenance agent"
  [{field}]:
    description: "Agent-specific additional field"

<detector_status>:
  level: L2, L6
  description: "Detector or instrument status at the time of the enclosing record"
  [status]:
    description: "Detector status"
    enum: [on, off, triggered, unknown]
  [mode]:
    description: "Detector, observing, or acquisition mode, where applicable"
  [configuration]:
    description: "Detector or instrument configuration, where applicable"
  [{field}]:
    description: "Detector-status-specific additional field"

<provenance>:
  description: "Contextual provenance of the enclosing record or assertion"

  <producer>:
    description: "Agent that produced the enclosing record or assertion"
    $ref: <_provenance_core>
    $ref: <detector_status>
  
  <channel>:
    description: "Agent that delivered, exposed, or mediated the enclosing record or assertion"
    $ref: <_provenance_core>
  
  $ref: <time>(L5, L6)
  
  [{field}]:
    description: "Provenance-specific additional field"

<separation>:
  level: L1
  unit: arcsec
  description: "Angular separation between two positions"
  [total]:
    description: "Total separation"
  [north]:
    description: "North-south component (negative = south)"
  [east]:
    description: "East-west component (negative = west)"

<redshift>:
  level: L1
  description: "Redshift measurements"
  [value]:
    description: "Redshift value"
  [error]:
    description: "Redshift uncertainty"
  [type]:
    description: "Spectroscopic or photometric"
    enum: [spec, photo]

<photometry>:
  description: "Photometric measurements"
  <{filter}>:
    level: L1, L6
    description: "Bandpass filter"
    [mag]:
      description: "Generic calibrated magnitude"
      unit: mag
    [mag_error]:
      description: "Generic calibrated magnitude uncertainty"
      unit: mag
    [flux]:
      description: "Generic calibrated flux"
    [flux_error]:
      description: "Generic calibrated flux uncertainty"
    [mag_minus_psf]:
      description: "Standard-aperture magnitude minus PSF-fit magnitude"
      unit: mag
    <aperture>:
      description: "Photometry measured by integrating flux within an aperture"
      [flux]:
        description: "Aperture flux"
      [flux_error]:
        description: "Aperture flux uncertainty"
      [mag]:
        description: "Aperture magnitude measured with the standard aperture (14-pixel diameter)"
        unit: mag
      [mag_error]:
        description: "Standard-aperture magnitude uncertainty"
        unit: mag
      <large>:
        description: "Photometry measured with the larger aperture (18-pixel diameter)"
        [mag]:
          description: "Large-aperture magnitude"
          unit: mag
        [mag_error]:
          description: "Large-aperture magnitude uncertainty"
          unit: mag
      <flags>:
        description: "Flags affecting the aperture-flux measurement"
        [failed]:
          description: "True if the aperture-flux measurement failed"
          type: boolean
        [aperture_truncated]:
          description: "True if the aperture was truncated by the available image region"
          type: boolean
    <limit>:
      description: "Photometric detection-limit information"
      [mag]:
        description: "Detection limiting magnitude, commonly defined at five sigma"
        unit: mag
      [mag_minus_aperture]:
        description: "Limiting magnitude minus the measured aperture magnitude"
        unit: mag
      [upper_limit]:
        description: "True if the photometric value represents an upper limit or non-detection"
        type: boolean
    <psf>:
      description: "Photometry obtained by fitting the point-spread function"
      [flux]:
        description: "PSF-fit flux"
      [flux_error]:
        description: "PSF-fit flux uncertainty"
      [mag]:
        description: "PSF-fit magnitude"
        unit: mag
      [mag_error]:
        description: "PSF-fit magnitude uncertainty"
        unit: mag
      [fit_chi2]:
        description: "Chi-square statistic of the PSF fit"
      [fit_log_likelihood]:
        description: "Log-likelihood of the PSF fit"
      [fit_ndata]:
        description: "Number of data values used in the PSF fit"
        type: integer
      [snr]:
        description: "Signal-to-noise ratio of the PSF-flux measurement"
      <flags>:
        description: "Flags affecting the PSF-flux measurement"
        [failed]:
          description: "True if the PSF-flux measurement failed"
          type: boolean
        [edge]:
          description: "True if the PSF-flux measurement was affected by an image edge"
          type: boolean
        [no_good_pixels]:
          description: "True if no usable pixels were available for the PSF-flux measurement"
          type: boolean
      level: L0
      [scatter_chi2]:
        description: "Chi-square statistic for the scatter of PSF flux around its weighted mean"
      [flux_error_mean]:
        description: "Mean of the individual PSF-flux uncertainties"
        unit: nJy
      [linear_intercept]:
        description: "Y-intercept of a linear model fitted to PSF flux as a function of time"
        unit: nJy
      [linear_slope]:
        description: "Slope of a linear model fitted to PSF flux as a function of time"
        unit: nJy/day
      [mad]:
        description: "Median absolute deviation of PSF flux without the scale factor for comparison to sigma"
        unit: nJy
      [maximum]:
        description: "Maximum PSF flux"
        unit: nJy
      [maximum_slope]:
        description: "Maximum ratio of a time-ordered PSF-flux difference to the elapsed time"
        unit: nJy/day
      [mean]:
        description: "Weighted mean PSF flux"
        unit: nJy
      [mean_error]:
        description: "Standard error of the weighted mean PSF flux"
        unit: nJy
      [minimum]:
        description: "Minimum PSF flux"
        unit: nJy
      [measurement_count]:
        description: "Number of PSF-flux measurements used to compute the aggregate statistics"
        type: integer
      [percentile_05]:
        description: "5th percentile of PSF flux"
        unit: nJy
      [percentile_25]:
        description: "25th percentile of PSF flux"
        unit: nJy
      [percentile_50]:
        description: "Median PSF flux"
        unit: nJy
      [percentile_75]:
        description: "75th percentile of PSF flux"
        unit: nJy
      [percentile_95]:
        description: "95th percentile of PSF flux"
        unit: nJy
      [sigma]:
        description: "Standard deviation of the PSF-flux distribution"
        unit: nJy
      [skew]:
        description: "Skewness of the PSF-flux distribution"
      [stetson_j]:
        description: "Stetson J statistic of the PSF-flux measurements"
    level: L0, L4
    [magnitude_rate]:
      description: "Rate of change of brightness"
      unit: mag/day
    [magnitude_rate_error]:
      description: "Uncertainty of the brightness-change rate"
      unit: mag/day
    [{field}]:
      description: "Other filter-specific photometric field"

<forced_photometry>:
  $ref: <_photometry>

<quality>:
  level: L1, L5
  description: "Higher-level trust, reliability, and usability metrics"
  [real_bogus]:
    description: "Deep learning real/bogus score"
    type: float
    range: [0, 1]
    [version]:
      description: "Deep learning real/bogus model version"
  [rf_real_bogus]:
    description: "Random Forest real/bogus score"
    type: float
    range: [0, 1]
    [version]:
      description: "Random Forest real/bogus model version"
  [reliability]:
    description: "Reliability score, with higher values representing greater reliability"
    type: float
    range: [0, 1]

<image_metrics>:
  level: L1
  description: "Detection-specific flags and metrics"
  [is_positive]:
    description: "True if positive subtraction"
    type: boolean
  [bbox_size]:
    description: "Bounding-box size"
    unit: pixels
  [extendedness]:
    description: "Source extendedness metric"
  [fit_chi]:
    description: "Source-profile fit chi diagnostic"
  [sharpness]:
    description: "Source-profile sharpness diagnostic"
  [centroid_flag]:
    description: "Centroid measurement failure flag"
    type: boolean
  [fwhm]:
    description: "Full width half max"
    unit: pixels
  [elongation]:
    description: "Ratio aimage/bimage"
  [aimage]:
    description: "Windowed profile RMS major axis"
    unit: pixels
  [bimage]:
    description: "Windowed profile RMS minor axis"
    unit: pixels
  [aimage_ratio]:
    description: "aimage / fwhm"
  [bimage_ratio]:
    description: "bimage / fwhm"
  <shape>:
    [ixx]:
    [iyy]:
    [ixy]:
    [psf_ixx]:
    [psf_iyy]:
    [psf_ixy]:
    [flag]:
      type: boolean
    [flag_no_pixels]:
      type: boolean
    [flag_not_contained]:
      type: boolean
    [flag_parent_source]:
      type: boolean
  <pixel_flags>:
    [any]:
      type: boolean
    [bad]:
      type: boolean
    [cosmic_ray]:
      type: boolean
    [cosmic_ray_center]:
      type: boolean
    [edge]:
      type: boolean
    [injected]:
      type: boolean
    [injected_center]:
      type: boolean
    [injected_template]:
      type: boolean
    [injected_template_center]:
      type: boolean
    [interpolated]:
      type: boolean
    [interpolated_center]:
      type: boolean
    [no_data]:
      type: boolean
    [no_data_center]:
      type: boolean
    [off_image]:
      type: boolean
    [saturated]:
      type: boolean
    [saturated_center]:
      type: boolean
    [streak]:
      type: boolean
    [streak_center]:
      type: boolean
    [suspect]:
      type: boolean
    [suspect_center]:
      type: boolean
  <dipole>:
    [is_dipole]:
      type: boolean
    [fit_attempted]:
      type: boolean
    [angle]:
      unit: deg
    [chi2]:
    [flux_difference]:
    [flux_difference_error]:
    [length]:
      unit: pixels
    [mean_flux]:
    [mean_flux_error]:
    [ndata]:
      type: integer
  <trail>:
    [is_glint]:
      type: boolean
    [angle]:
      unit: deg
    [angle_error]:
      unit: deg
    [chi2]:
    [length]:
      unit: pixels
    [length_error]:
      unit: pixels
    [flux]:
    [flux_error]:
    [ndata]:
      type: integer
    [ra]:
      unit: deg
    [ra_error]:
      unit: deg
    [dec]:
      unit: deg
    [dec_error]:
      unit: deg
    [flag_edge]:
      type: boolean

  [nbad_pixels]:
    description: "Number of bad pixels in stamp"
    type: integer
  [nneg_pixels]:
    description: "Number of negative pixels in stamp"
    type: integer
  [pixel_sum_ratio]:
    description: "sum(pixels) / sum(|pixels|)"
  [scorr]:
    description: "Matched-filter signal-to-noise"
  [ssnrms]:
    description: "S/stddev(S) on event position"
  [dsnrms]:
    description: "D/stddev(D) on event position"
  [dsdiff]:
    description: "dsnrms - ssnrms"
  [seeratio]:
    description: "difffwhm / fwhm"

<calibration>:
  level: L1
  description: "Photometric calibration information"

  # Global calibration metadata (not filter-specific)
  [zp_median]:
    description: "Median zero point across all filters"
    unit: mag
  [nmatches]:
    description: "Number of PS1 calibrators used in the solution"
    type: integer
  [color_median]:
    description: "Median colour of calibrator stars"
    unit: mag
  [color_rms]:
    description: "RMS colour of calibrator stars"
    unit: mag

  # Filter-specific calibration parameters
  <{filter}>:
    [zero_point]:
      description: "Zero point for this filter"
      unit: mag
    [zero_point_uncertainty]:
      description: "Zero point uncertainty for this filter"
      unit: mag
    [zero_point_rms]:
      description: "RMS scatter of zero point fit for this filter"
      unit: mag
    [zero_point_covariance]:
      description: "Covariance between zero point and colour coefficient for this filter"
    [color_coefficient]:
      description: "Colour coefficient for this filter"
    [color_coefficient_uncertainty]:
      description: "Uncertainty of colour coefficient for this filter"

<color>:
  level: L0, L1, L6
  description: "Color measurements"
  <{filter1-filter2}>:
    description: "Difference in magnitudes between filters"
    [diff]:
      description: "mag diff"
      unit: mag
    [error]:
      description: "mag diff error"
      unit: mag
    [rate]:
      description: "mag diff change rate"
      unit: mag/day
    [rate_error]:
      description: "mag diff change rate error"
      unit: mag/day

<_classification_core>:
  [class]:
    description: "Class label, where applicable"
  [value]:
    description: "Generic classification value, where applicable"
  [score]:
    description: "Classification score, where applicable"
    type: float
  [probability]:
    description: "Classification probability, where applicable"
    type: float
    range: [0, 1]
  [method]:
    description: "Method, model, rule, or source field behind this classification result"
  [target]:
    description: "Class, contrast, or concept this classification result refers to, where known"
  [description]:
    description: "Human-readable explanation or description"
  [{field}]:
    description: "Classification-specific additional field"

<classification>:
  level: L5, L6
  description: "Classification, annotation, or taxonomic interpretation"

  <best>:
    description: "Selected or preferred classification result"
    $ref: <_classification_core>

  <assessment>:
    description: "Named classification output, score, probability, label, or broker-provided classification field"
    <{output}>:
      $ref: <_classification_core>

  $ref: <provenance>


<astrometric_solution>:
  level: L6
  description: "Astrometric solution of a catalog object"
  [parallax]:
    unit: mas
  [parallax_error]:
    unit: mas
  [proper_motion_ra]:
    unit: mas/yr
  [proper_motion_dec]:
    unit: mas/yr
  [proper_motion_ra_error]:
    unit: mas/yr
  [proper_motion_dec_error]:
    unit: mas/yr
  [epoch]:
    description: "Reference epoch of astrometric solution"
  [ruwe]:
    description: "Gaia RUWE or equivalent astrometric quality metric"
  [{field}]:
    description: "Catalog-specific astrometric solution fields"

<solar_system>:
  level: L2
  description: "Solar System object - specific information"
  [roid]:
    description: "SSO score (0=not, 1=possible, 2=candidate, 3=confirmed)"
    type: integer
    enum: [0, 1, 2, 3]
  [mpc_name]:
    description: "MPC name if within 30 arcsec"
  [mpc_distance]:
    description: "Distance to nearest known SSO"
    unit: arcsec
  [mpc_magnitude]:
    description: "Magnitude of nearest known SSO"
    unit: mag
  [iau_name]:
    description: "IAU name of the Solar System object"
  [iau_number]:
    description: "IAU number of the Solar System object"
    type: integer

<gravitational_wave>:
  level: L2
  description: "Gravitational-wave-specific information"
  [superevent_id]:
    description: "Gravitational-wave superevent identifier, where applicable"
  [event_id]:
    description: "Instrument- or pipeline-specific gravitational-wave event identifier"
  [pipeline]:
    description: "Search or analysis pipeline that produced the gravitational-wave record"
  [search]:
    description: "Search category or observing run context, where reported"
  [group]:
    description: "Analysis group or source-family grouping, where reported"
  [instruments]:
    description: "Participating interferometers or detectors"
    type: array
  [skymap_version]:
    description: "Version or label of the associated sky-localization product"
  [notice_type]:
    description: "Native notice or alert type, where reported"
  [{field}]:
    description: "Gravitational-wave-specific additional field"

<neutrino>:
  level: L2
  description: "Neutrino-specific observation or event content"
  [event_id]:
    description: "Instrument- or pipeline-specific neutrino event identifier"
  [stream]:
    description: "Neutrino alert stream, selection, or event class"
  [energy]:
    description: "Reported neutrino energy or energy proxy"
  [energy_error]:
    description: "Uncertainty of reported neutrino energy or energy proxy"
  [signalness]:
    description: "Probability-like score that the event is astrophysical rather than atmospheric/background, where reported"
    type: float
    range: [0, 1]
  [trackness]:
    description: "Track/cascade or topology score, where reported"
    type: float
    range: [0, 1]
  [multiplet]:
    description: "Identifier or description of a neutrino multiplet, where applicable"
  [run_id]:
    description: "Native run identifier"
  [{field}]:
    description: "Neutrino-specific additional field"

<radio>:
  level: L2
  description: "Radio-specific observation or detection content"
  [frequency]:
    description: "Central observing frequency"
    unit: Hz
  [bandwidth]:
    description: "Observing bandwidth"
    unit: Hz
  [flux_density]:
    description: "Radio flux density"
    unit: Jy
  [flux_density_error]:
    description: "Uncertainty of radio flux density"
    unit: Jy
  [beam_major]:
    description: "Major axis of the effective or synthesized beam"
    unit: arcsec
  [beam_minor]:
    description: "Minor axis of the effective or synthesized beam"
    unit: arcsec
  [beam_position_angle]:
    description: "Beam position angle"
    unit: deg
  [polarization]:
    description: "Polarization product or Stokes parameter"
  [dispersion_measure]:
    description: "Dispersion measure, where applicable"
    unit: pc cm-3
  [rotation_measure]:
    description: "Rotation measure, where applicable"
    unit: rad m-2
  [{field}]:
    description: "Radio-specific additional field"

<satellite>:
  level: L2
  description: "Satellite and debris information"
  [tracklet_id]:
    description: "Tracklet ID for fast moving objects"

<_high_energy_core>:
  [energy_min]:
    unit: keV
  [energy_max]:
    unit: keV

  [flux]:
  [flux_error]:
  [flux_unit]:
    enum: [ph/cm2/s, erg/cm2/s]

  [limiting_flux]:
  [limiting_flux_sigma]:

  [flux_density]:
  [flux_density_error]:
  [flux_density_unit]:

  [fluence]:
  [fluence_error]:

  [count_rate]:
  [background_count_rate]:
  [signal_to_noise]:
  [false_alarm_rate]:

  <hardness_ratio>:
