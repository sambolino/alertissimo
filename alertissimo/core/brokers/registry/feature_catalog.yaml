# feature_catalog.yaml
version: "1.2"
description: "Unified transient feature space"

# ============================================================================
# SEMANTICS RECIPE
# ============================================================================
# This file defines a level-aware semantic model for astronomical transient data.
# It separates semantic meaning from structural composition while allowing both
# to be expressed within a unified, declarative notation.
#
# The specification serves as:
#   - a canonical vocabulary of features
#   - a reusable semantic layer for broker mappings
#   - a validation target for normalized data
#   - a foundation for higher-level DSL constructs
#
# ---------------------------------------------------------------------------
# CORE CONCEPTS
# ---------------------------------------------------------------------------
#
# 1. Containers vs Fields
#
#   <container>
#       Non-resolvable semantic grouping.
#       Cannot appear directly in data.
#       Used to organize related concepts.
#
#   [field]
#       Resolvable element.
#       Represents a concrete data path.
#       May be a leaf or have nested children.
#
#
# 2. Parameterized Containers
#
#   <{parameter}>
#       Defines a namespace that must be instantiated at runtime.
#       Used when structure depends on external sources.
#
#       Examples:
#           {catalog}    -> sdss, ps1, gaia
#           {annotator}  -> fink, tns
#           {filter}     -> g, r, i, z
#
#       Example:
#           <crossmatch>
#             <{catalog}>
#               ...
#
#
# 3. Dynamic Fields
#
#   [{field}]
#       Indicates that field names are not fixed.
#       Allows broker- or catalog-specific extensions while preserving
#       a stable semantic core.
#
#
# 4. References ($ref)
#
#   $ref: <container>
#       Imports all fields from another container.
#
#   $ref: <container>(Ln)
#       Imports fields constrained to a specific level.
#
#   References are flattened into the target scope (no nesting is introduced).
#
#
# 5. Inheritance
#
#   inherits: <container>
#
#       Declares structural inheritance between containers.
#       All referenced fields are merged into the child container.
#
#       Unlike $ref, inheritance expresses "is-a" relationships and is used
#       for composing domain-specific structures.
#
#       Example:
#           <sso_detection>:
#             inherits: <detection>
#             $ref: <solar_system>
#
#
# 6. Levels
#
#   Levels define the semantic context in which a field applies.
#
#       L0  - Portfolio-level aggregates
#       L1  - Single detection parameters
#       L2  - Solar System specifics
#       L3  - Binary/image data
#       L4  - Time-series features
#       L5  - Machine learning outputs
#       L6  - Data enrichment (crossmatch, catalogs)
#       L7  - Survey-level aggregates
#       L8  - External services
#
#   Rules:
#       - Levels can be defined at container level and inherited by fields
#       - Levels can be redefined within subtrees
#       - Fields may override inherited levels
#       - The same semantic concept may exist at multiple levels
#
#   This enables reuse of concepts (e.g. position) across detection and
#   object-level representations without duplication.
#
#
# ---------------------------------------------------------------------------
# STRUCTURAL COMPOSITION
# ---------------------------------------------------------------------------
#
# Semantic containers are composed into higher-level data structures.
#
# Example:
#
#   <detection>
#       Atomic observational unit
#
#   <sso_detection>
#       Specialized detection for Solar System objects
#
#   <portfolio>
#       Object-centric aggregation of detections and enrichments
#
# These structures define how semantic elements are organized in data,
# while semantics themselves remain reusable and context-independent.
#
#
# ---------------------------------------------------------------------------
# DATA PATH FORMATION
# ---------------------------------------------------------------------------
#
# Concrete data paths are formed by resolving:
#   - container hierarchy
#   - parameter substitution
#   - field names
#
# Examples:
#
#   position.ra
#   photometry.g.psf_mag
#   classification.fink.class
#   crossmatch.sdss.position.ra
#   lightcurve.r.points[].mjd
#
#
# ---------------------------------------------------------------------------
# DESIGN PRINCIPLES
# ---------------------------------------------------------------------------
#
# 1. Separation of Concerns
#    Semantics are defined independently of data structures.
#
# 2. Reusability
#    Core concepts (position, photometry, time) are defined once and reused.
#
# 3. Level-Awareness
#    The same concept can exist at different abstraction levels.
#
# 4. Controlled Extensibility
#    Dynamic fields allow flexibility without breaking the semantic model.
#
# 5. Structural Minimalism
#    Complex structures (portfolio, lightcurve, crossmatch) are composed
#    rather than hardcoded into the semantic layer.
#
# 6. Flattened Composition
#    References and inheritance do not introduce additional nesting.
#
#
# ---------------------------------------------------------------------------
# SCOPE
# ---------------------------------------------------------------------------
#
# This specification does NOT define:
#   - broker-specific mappings (handled in mappings.yaml)
#   - query or transformation logic (DSL layer)
#   - execution semantics
#
# It defines the semantic space and its valid compositions.
#
# ============================================================================

levels:
  L0: "Portfolio Aggregates - object identifiers and statistics"
  L1: "Single Detection Parameters - numerical "
  L2: "Solar System Specifics"
  L3: "Binary Data - cutout images etc"
  L4: "Light Curve Features - derived time-series"
  L5: "Machine learning - quality scores, metrics, classification"
  L6: "Data enrich - internal (broker) matching, external catalogs, crossmatch"
  L7: "Survey Aggregates - statistics"
  L8: "External services - name resolution, ephemeris, etc."


<position>:
  level: L1
  unit: deg
  description: "Equatorial coordinates J2000"
  [ra]:
    description: "Right ascension"
  [dec]:
    description: "Declination"
  [ra_error]:
    description: "Right ascension error"
  [dec_error]:
    description: "Declination error"
  [cone_distance]:
    description: "Angular distance from search center"
    unit: deg
  [image_x]:
    description: "X position in image"
    unit: pixels
  [image_y]:
    description: "Y position in image"
    unit: pixels
  [distance_to_edge]:
    description: "Distance to nearest image edge"
    unit: pixels

<time>:
  level: L1
  unit: mjd
  description: "Time measurements (MJD)"
  [mjd]:
    description: "Modified Julian Date of observation"
  [exposure]:
    description: "Exposure duration"
    unit: sec
  level: L0
  description: "Historical temporal data"
  [first_detection]:
    description: "First detection datetime (human-readable)"
    unit: datetime
  [last_detection]:
    description: "Last detection datetime (human-readable)"
    unit: datetime
  [first_mjd]:
    description: "Earliest detection MJD"
  [last_mjd]:
    description: "Latest detection MJD"

<photometry>:
  level: L1
  unit: mag
  description: "Photometric measurements"
  [{filter}]:
    description: "Bandpass filter"
    type: string
    [psf_mag]:
      description: "PSF-fit magnitude"
    [psf_mag_error]:
      description: "PSF-fit magnitude error"
    [aperture_mag]:
      description: "Aperture magnitude (14 pixel diameter)"
    [aperture_mag_big]:
      description: "Aperture magnitude (18 pixel diameter)"
    [aperture_mag_error]:
      description: "Aperture magnitude error"
    [aperture_mag_big_error]:
      description: "Aperture magnitude error (18 pixel)"
    [mag_ap_minus_psf]:
      description: "Aperture mag minus PSF mag"
    [mag_from_limit]:
      description: "diffmaglim - magap"
    [diff_mag_limit]:
      description: "5-sigma magnitude limit"
    [zero_point]:
      description: "Magnitude zero point"
    [zero_point_rms]:
      description: "Zero point RMS"
    [zero_point_uncertainty]:
      description: "Zero point uncertainty"
    [upper_limit]:
      description: "True if non-detection"
      type: boolean
  [magnitude_rate]:
    description: "Brightness change rate"
    unit: mag/day
  [magnitude_rate_error]:
    description: "Rate error"
    unit: mag/day

<separation>:
  level: L1
  unit: arcsec
  description: "Angular separation between two positions"
  [total]:
    description: "Total separation"
  [north]:
    description: "North-south component (negative = south)"
  [east]:
    description: "East-west component (negative = west)"

<redshift>:
  level: L1
  description: "Redshift measurements"
  [value]:
    description: "Redshift value"
  [error]:
    description: "Redshift uncertainty"
  [type]:
    description: "Spectroscopic or photometric"
    enum: [spec, photo]

<quality>:
  level: L1, L5
  description: "Quality metrics for detections"
  [real_bogus]:
    description: "Deep learning real/bogus score"
    type: float
    range: [0, 1]
    [version]:
      description: "Random Forest real/bogus model version"
  [rf_real_bogus]:
    description: "Random Forest real/bogus score"
    type: float
    range: [0, 1]
    [version]:
      description: "Deep learning real/bogus model version"
  [star_galaxy]:
    description: "SExtractor star/galaxy score"
    type: float
    range: [0, 1]
  [fwhm]:
    description: "Full width half max"
    unit: pixels
  [elongation]:
    description: "Ratio aimage/bimage"
  [psf_chisq]:
    description: "Reduced chi-square for PSF-fit"
  [aimage]:
    description: "Windowed profile RMS major axis"
    unit: pixels
  [bimage]:
    description: "Windowed profile RMS minor axis"
    unit: pixels
  [aimage_ratio]:
    description: "aimage / fwhm"
  [bimage_ratio]:
    description: "bimage / fwhm"
  [chinr]:
    description: "DAOPhot chi of nearest reference source"
  [sharpnr]:
    description: "DAOPhot sharp of nearest reference source"
  [reliability]:
    description: "Reliability score (higher = more reliable)"
    type: integer

<provenance>:
  level: L1
  description: "Contextual identifiers and metadata"
  [source_id]:
    description: "Unique per single detection / alert, diasourceid/candid etc"
    type: long
  [field_id]:
    description: "field ID"
    type: integer
  [night_id]:
    description: "Night ID"
    type: integer
  [program_id]:
    description: "Program ID"
    type: integer
  [publisher]:
    description: "Alert origin"
  [broker_version]:
    description: "Broker version"
  [science_version]:
    description: "Science module version"
  [schema_version]:
    description: "Alert schema version"
  [pid]:
    description: "Processing ID"
    type: long
  [rfid]:
    description: "Reference image processing ID"
    type: long
  [diffim_filename]:
    description: "Difference image filename"
  [too_flag]:
    description: "Target of Opportunity flag"
    type: boolean
  [constellation]:
    level: L0, L1, L6
    description: "Constellation name"
  level: L0
  description: "Object-level aggregates"
  [id]:
    description: "Object identifier"
  [timespan_days]:
    description: "Days between first and last detection"
    unit: days
  [detection_count]:
    description: "Total number of detections for this object"
    type: integer
  [detection_count]:
    description: "Number of historical detections"
    type: integer
  [ncovhist]:
    description: "Number of times position fell on any field"


<image_metrics>:
  level: L1
  description: "Detection-specific flags and metrics"
  [is_positive]:
    description: "True if positive subtraction"
    type: boolean
  [upper_limit]:
    description: "True if this is an upper limit"
    type: boolean
  [nbad_pixels]:
    description: "Number of bad pixels in stamp"
    type: integer
  [nneg_pixels]:
    description: "Number of negative pixels in stamp"
    type: integer
  [pixel_sum_ratio]:
    description: "sum(pixels) / sum(|pixels|)"
  [scorr]:
    description: "Matched-filter signal-to-noise"
  [ssnrms]:
    description: "S/stddev(S) on event position"
  [dsnrms]:
    description: "D/stddev(D) on event position"
  [dsdiff]:
    description: "dsnrms - ssnrms"
  [seeratio]:
    description: "difffwhm / fwhm"

<reference>:
  level: L1
  description: "Reference image information"
  [nearest_distance]:
    description: "Distance to nearest reference source"
    unit: pixels
  [nearest_magnitude]:
    description: "Magnitude of nearest reference source"
    unit: mag
  [nearest_magnitude_error]:
    description: "Magnitude error of nearest reference source"
    unit: mag
  [nearest_ra]:
    description: "RA of nearest reference source"
    unit: deg
  [nearest_dec]:
    description: "Dec of nearest reference source"
    unit: deg
    type: integer
  [nframes]:
    description: "Number of frames in reference image"
    type: integer

<calibration>:
  level: L1
  description: "Photometric calibration information"
  [color_coefficient]:
    description: "Color coefficient from photometric calibration"
  [color_coefficient_uncertainty]:
    description: "Color coefficient uncertainty"
  [color_median]:
    description: "Median color of PS1 calibrators"
    unit: mag
  [color_rms]:
    description: "RMS color of PS1 calibrators"
    unit: mag
  [nmatches]:
    description: "Number of PS1 calibrators used"
    type: integer
  [zp_covariance]:
    description: "Covariance of zero point and color coefficient"
  [zp_median]:
    description: "Median zero point"
    unit: mag

<color>:
  level: L0, L1, L6
  description: "Color measurements"
  <{filter1-filter2}>:
    description: "Difference in magnitudes between filters"
    [diff]:
      description: "mag diff"
      unit: mag
    [error]:
      description: "mag diff error"
      unit: mag
    [rate]:
      description: "mag diff change rate"
      unit: mag/day
    [rate_error]:
      description: "mag diff change rate error"
      unit: mag/day

<classification>:
  level: L5
  description: "ML classification outputs"
  <{annotator}>:
    [class]:
      description: "Classification label"
      [description]:
        description: "Long textual description of the classification"
      [probability]:
        description: "Probability score"
        type: float
        range: [0, 1]
    [{field}]:
      description: "Classification-specific fields (e.g., blazar_stats, anomaly_score)"

<solar_system>:
  level: L2
  description: "Solar System object information"
  [roid]:
    description: "SSO score (0=not, 1=possible, 2=candidate, 3=confirmed)"
    type: integer
    enum: [0, 1, 2, 3]
  [mpc_name]:
    description: "MPC name if within 30 arcsec"
  [mpc_distance]:
    description: "Distance to nearest known SSO"
    unit: arcsec
  [mpc_magnitude]:
    description: "Magnitude of nearest known SSO"
    unit: mag
  [iau_name]:
    description: "IAU name of the Solar System object"
  [iau_number]:
    description: "IAU number of the Solar System object"
    type: integer

<satellite>:
  level: L2
  description: "Satellite and debris information"
  [tracklet_id]:
    description: "Tracklet ID for fast moving objects"

<cutouts>:
  level: L3
  description: "Image cutouts"
  [science]:
    description: "Science image 2D array"
    type: array
  [template]:
    description: "Template image 2D array"
    type: array
  [difference]:
    description: "Difference image 2D array"
    type: array

<crossmatch>:
  level: L6
  description: "External catalog cross-matches"
  <{catalog}>:
    $ref: <position>
    $ref: <separation>
    $ref: <redshift>
    $ref: <photometry>
    $ref: <classification>
    $ref: <provenance>
    [{field}]:
      description: "Catalog-specific additional fields"

<lightcurve>:
  level: L4
  description: "Time-series of photometric points"
  $ref: <provenance>
  <{filter}>:
    <points>:
      type: array
      items:
        $ref: <time>[mjd]
        $ref: <photometry>
        $ref: <detection>
        $ref: <quality>
    level: L6
    [magnitude_rate]:
      unit: mag/day
    [magnitude_rate_error]:
      unit: mag/day
    [rate_lower_percentile]:
    [rate_upper_percentile]:
    [delta_time_rate]:
      unit: days
    [from_upper_limit]:
      type: boolean
    [feature_vector]:
      description: "Serialized feature vector (e.g. lc_features_g)"
    
<survey>:
  level: L7
  description: "Survey-level statistics"
  [class_distribution]:
    description: "Counts per classification"
    type: object
    dynamic: true
  [filter_counts]:
    description: "Alert counts per filter"
    type: object
  [exposure_count]:
    description: "Number of exposures"
    type: integer
  [field_count]:
    description: "Number of fields"
    type: integer
  [raw_alerts]:
    description: "Total raw alerts"
    type: integer
  [science_alerts]:
    description: "Science-quality alerts"
    type: integer

<resolver>:
  level: L8
  description: "Name resolution service"
  [catalog]:
    description: "Resolver source"
    enum: [simbad, tns, ssodnet]
  [external_id]:
    description: "Object ID in external catalog"
    type: integer
  [type_code]:
    description: "Object type code from external catalog"
  [position_string]:
    description: "J2000 position as string (HH:MM:SS ±DD:MM:SS)"
  [external_name]:
    description: "Object name in external catalog"
  [redshift]:
    description: "Redshift if available"
  [reference_count]:
    description: "Number of references"
    type: integer
  $ref: <position>
  
<detection>:
  description: "Single detection structure (atomic observation)"
  $ref: <position>(L1)
  $ref: <time>(L1)
  $ref: <photometry>(L1)
  $ref: <quality>(L1)
  $ref: <provenance>(L1)
  $ref: <separation> 
  $ref: <redshift> 
  $ref: <reference> 
  $ref: <calibration> 
  $ref: <color>

<sso_detection>:
  description: "Single detection structure for Solar System objects"
    inherits: <detection>
    $ref: <solar_system>

<portfolio>:
  description: "Object-centric aggregated view"

  # Object-level projections
  $ref: <position>(L0)
  $ref: <time>(L0)
  $ref: <provenance>(L0)
  $ref: <color>(L0)

  <detections>:
    type: array
    items:
      $ref: <detection> | <sso_detection>

  <crossmatches>:
    type: array
    items:
      $ref: <crossmatch>

  <lightcurves>:
    type: array
    items:
      $ref: <lightcurve>
