    [injected]:
      type: boolean
    [injected_center]:
      type: boolean
    [injected_template]:
      type: boolean
    [injected_template_center]:
      type: boolean
    [interpolated]:
      type: boolean
    [interpolated_center]:
      type: boolean
    [no_data]:
      type: boolean
    [no_data_center]:
      type: boolean
    [off_image]:
      type: boolean
    [saturated]:
      type: boolean
    [saturated_center]:
      type: boolean
    [streak]:
      type: boolean
    [streak_center]:
      type: boolean
    [suspect]:
      type: boolean
    [suspect_center]:
      type: boolean
  <dipole>:
    [is_dipole]:
      type: boolean
    [fit_attempted]:
      type: boolean
    [angle]:
      unit: deg
    [chi2]:
    [flux_difference]:
    [flux_difference_error]:
    [length]:
      unit: pixels
    [mean_flux]:
    [mean_flux_error]:
    [ndata]:
      type: integer
  <trail>:
    [is_glint]:
