    unit: pixels
  [bimage]:
    description: "Windowed profile RMS minor axis"
    unit: pixels
  [aimage_ratio]:
    description: "aimage / fwhm"
  [bimage_ratio]:
    description: "bimage / fwhm"
  <shape>:
    [ixx]:
    [iyy]:
    [ixy]:
    [psf_ixx]:
    [psf_iyy]:
    [psf_ixy]:
    [flag]:
      type: boolean
    [flag_no_pixels]:
      type: boolean
    [flag_not_contained]:
      type: boolean
    [flag_parent_source]:
      type: boolean
  <pixel_flags>:
    [any]:
