# brokers/alerce/ztf/mappings.yaml
#
# Source fields are based on data/alerce/ztf/*.json.  This registry intentionally
# leaves `features` and `magstats` unmapped: their generic named feature rows and
# per-filter magnitude aggregates do not yet have an exact canonical feature
# representation in feature_catalog.yaml. They must not be forced into
# detection semantics.
broker: alerce
origin: ztf

mappings:
  # Keep semantic feature paths stable.  Dynamic `{filter}` entries bind
  # dependent photometry paths and are not scalar output fields themselves.

  # ==================== Object summary ====================
  summary@ztf:alerce.identity.object_id:
    field: "oid"
    availability: [objects, object]

  summary@ztf:alerce.detection_count:
    field: "ndethist"
    availability: [objects, object]

  summary@ztf:alerce.coverage_count:
    field: "ncovhist"
    availability: [objects, object]

  summary@ztf:alerce.time.first_mjd:
    field: "mjdstarthist"
    availability: [objects, object]

  summary@ztf:alerce.time.last_mjd:
    field: "mjdendhist"
    availability: [objects, object]

  summary@ztf:alerce.time.timespan_days:
    field: "deltajd"
    availability: [objects, object]

  summary@ztf:alerce.position.ra:
    field: "meanra"
    availability: [objects, object]

  summary@ztf:alerce.position.dec:
    field: "meandec"
    availability: [objects, object]

  summary@ztf:alerce.color.g-r.diff:
    field: "g_r_mean"
    availability: [objects, object]

  # ==================== Individual detections ====================
  detection@ztf:alerce.position.ra:
    field: "ra"
    availability: [detections, lightcurve]

  detection@ztf:alerce.position.dec:
    field: "dec"
    availability: [detections, lightcurve]

  detection@ztf:alerce.time.mjd:
    field: "mjd"
    availability: [detections, lightcurve]

  detection@ztf:alerce.identity.source_id:
    field: "candid"
    availability: [detections, lightcurve]

  detection@ztf:alerce.identity.field_id:
    field: "fid"
    availability: [detections, lightcurve]

  detection@ztf:alerce.identity.night_id:
    field: "nid"
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}:
    field: "fid"
    transform: {1: "g", 2: "r", 3: "i"}
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}.psf.mag:
    field: "magpsf"
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}.psf.mag_error:
    field: "sigmapsf"
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}.aperture.mag:
    field: "magap"
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}.aperture.mag_error:
    field: "sigmagap"
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}.aperture.large.mag:
    field: "magapbig"
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}.aperture.large.mag_error:
    field: "sigmagapbig"
    availability: [detections, lightcurve]

  detection@ztf:alerce.photometry.{filter}.limit.mag:
    field: "diffmaglim"
    availability: [detections, lightcurve]

  detection@ztf:alerce.quality.real_bogus:
    field: "drb"
    availability: [detections, lightcurve]

  detection@ztf:alerce.quality.rf_real_bogus:
    field: "rb"
    availability: [detections, lightcurve]

  detection@ztf:alerce.quality.rf_real_bogus.version:
    field: "rbversion"
    availability: [detections, lightcurve]

  detection@ztf:alerce.image_metrics.is_positive:
    field: "isdiffpos"
    transform: {0: false, 1: true}
    availability: [detections, lightcurve]

  detection@ztf:alerce.reference_image.nearest_source.separation.total:
    field: "distnr"
    availability: [detections, lightcurve]

  # Lightcurve non_detections contains a time/filter/limit tuple, not a
  # standalone detection record.
  lightcurve@ztf:alerce.{filter}.points:
    field: "non_detections"
    availability: [lightcurve]

  lightcurve@ztf:alerce.{filter}.from_upper_limit:
    field: "non_detections"
    transform: true
    availability: [lightcurve]

  # ==================== Classifier assessments ====================
  classification@alerce.assessment.lc_classifier.class:
    field: "class_name"
    filter: {classifier_name: "lc_classifier"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier.probability:
    field: "probability"
    filter: {classifier_name: "lc_classifier"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier.provenance.producer.version:
    field: "classifier_version"
    filter: {classifier_name: "lc_classifier"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_periodic.class:
    field: "class_name"
    filter: {classifier_name: "lc_classifier_periodic"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_periodic.probability:
    field: "probability"
    filter: {classifier_name: "lc_classifier_periodic"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_periodic.provenance.producer.version:
    field: "classifier_version"
    filter: {classifier_name: "lc_classifier_periodic"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_stochastic.class:
    field: "class_name"
    filter: {classifier_name: "lc_classifier_stochastic"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_stochastic.probability:
    field: "probability"
    filter: {classifier_name: "lc_classifier_stochastic"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_stochastic.provenance.producer.version:
    field: "classifier_version"
    filter: {classifier_name: "lc_classifier_stochastic"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_top.class:
    field: "class_name"
    filter: {classifier_name: "lc_classifier_top"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_top.probability:
    field: "probability"
    filter: {classifier_name: "lc_classifier_top"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_top.provenance.producer.version:
    field: "classifier_version"
    filter: {classifier_name: "lc_classifier_top"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_transient.class:
    field: "class_name"
    filter: {classifier_name: "lc_classifier_transient"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_transient.probability:
    field: "probability"
    filter: {classifier_name: "lc_classifier_transient"}
    availability: [probabilities]

  classification@alerce.assessment.lc_classifier_transient.provenance.producer.version:
    field: "classifier_version"
    filter: {classifier_name: "lc_classifier_transient"}
    availability: [probabilities]

  classification@alerce.assessment.stamp_classifier.class:
    field: "class_name"
    filter: {classifier_name: "stamp_classifier"}
    availability: [probabilities]

  classification@alerce.assessment.stamp_classifier.probability:
    field: "probability"
    filter: {classifier_name: "stamp_classifier"}
    availability: [probabilities]

  classification@alerce.assessment.stamp_classifier.provenance.producer.version:
    field: "classifier_version"
    filter: {classifier_name: "stamp_classifier"}
    availability: [probabilities]
