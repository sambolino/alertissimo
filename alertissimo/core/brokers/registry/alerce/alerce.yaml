### brokers/alerce/lsst/mappings.yaml
broker: alerce
origin: lsst
mappings:
  # ==================== L0: Object Metadata ====================
  portfolio.id:
    field: "aid"
    availability:
      - objects
      - detections
      - probabilities
  portfolio.detection_count:
    field: "ndet"
    availability:
      - objects

  # ==================== L1: Rubin Direct Detections (Normalized Response) ====================
  photometry.flux:
    field: "mag"
    availability:
      - detections
  photometry.flux_error:
    field: "e_mag"
    availability:
      - detections
  photometry.mjd:
    field: "mjd"
    availability:
      - detections
  photometry.filter:
    field: "fid"
    availability:
      - detections

  # ==================== L5: Rubin ML (ATAT / Anomaly / Rubin Stamp) ====================
  classification.atat.class:
    field: "class_name"
    availability:
      - probabilities
    filter:
      classifier_name: "lc_classifier_lsst"
  classification.alerce_stamp.probability:
    field: "probability"
    availability:
      - probabilities
    filter:
      classifier_name: "stamp_classifier_rubin_beta"
  classification.anomaly_score:
    field: "score"
    availability:
      - probabilities
    filter:
      classifier_name: "anomaly_detector_ae"

