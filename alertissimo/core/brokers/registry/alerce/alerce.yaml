### brokers/alerce/ztf/mappings.yaml
broker: alerce
origin: ztf
mappings:
  # ==================== L0: Portfolio Aggregates ====================
  portfolio.id:
    field: "oid"
    availability:
      - objects
      - detections
      - features
      - probabilities
  portfolio.detection_count:
    field: "ndet"
    availability:
      - objects
  portfolio.first_mjd:
    field: "firstmjd"
    availability:
      - objects
  portfolio.last_mjd:
    field: "lastmjd"
    availability:
      - objects

  # ==================== L1: Single Detection Parameters ====================
  position.ra:
    field: "ra"
    availability:
      - detections
  position.dec:
    field: "dec"
    availability:
      - detections
  photometry.psf_mag:
    field: "magpsf"
    availability:
      - detections
  photometry.psf_mag_error:
    field: "sigmapsf"
    availability:
      - detections
  photometry.mjd:
    field: "mjd"
    availability:
      - detections
  photometry.filter:
    field: "fid"
    transform:
      1: "g"
      2: "r"
      3: "i"
    availability:
      - detections
  detection.is_positive:
    field: "isdiffpos"
    availability:
      - detections

  # ==================== L1: Reference Context & Quality ====================
  quality.real_bogus:
    field: "drb"
    availability:
      - detections
  quality.rf_score:
    field: "rb"
    availability:
      - detections
  reference.nearest_distance:
    field: "distnr"
    availability:
      - detections
  reference.nearest_magnitude:
    field: "magnr"
    availability:
      - detections

  # ==================== L1/L2: Sorting Hat Flags (Nested) ====================
  classification.is_transient:
    field: "extra_fields.is_transient"
    availability:
      - objects
  classification.is_variable:
    field: "extra_fields.is_variable"
    availability:
      - objects
  classification.in_galaxy:
    field: "extra_fields.in_galaxy"
    availability:
      - objects
  classification.nuclear_transient:
    field: "extra_fields.nuclear_transient"
    availability:
      - objects
  classification.near_bright_star:
    field: "extra_fields.near_bright_star"
    availability:
      - objects
  classification.known_asteroid:
    field: "extra_fields.known_asteroid"
    availability:
      - objects

  # ==================== L3: Media (Cutouts) ====================
  cutouts.science:
    field: "stamps.science"
    availability:
      - stamps
  cutouts.template:
    field: "stamps.template"
    availability:
      - stamps

  # ==================== L4: Light Curve Features (Isolated) ====================
  lightcurve.period:
    field: "Period_fit"
    availability:
      - features
  lightcurve.bazin_gamma:
    field: "Bazin_gamma"
    availability:
      - features
  lightcurve.spm_tau_rise:
    field: "SPM_tau_rise"
    availability:
      - features
  lightcurve.feature_vector:
    field: "features"
    availability:
      - features

  # ==================== L5: Machine Learning (Probabilities) ====================
  classification.alerce_stamp.class:
    field: "class_name"
    availability:
      - probabilities
    filter:
      classifier_name: "stamp_classifier"
  classification.alerce_stamp.probability:
    field: "probability"
    availability:
      - probabilities
    filter:
      classifier_name: "stamp_classifier"
  classification.anomaly_score:
    field: "score"
    availability:
      - probabilities
    filter:
      classifier_name: "anomaly_detector_ae"

