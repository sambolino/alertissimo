broker: alerce
origin: ztf
description: Generated from alerce_schema_payload_audit_bundle.tar.gz; declared docs plus observed payload audit.
notes: Semantic mappings from physical ALeRCE response fields.
payloads:
  get_avro:
    endpoint: get_avro
    path: .
    description: Response payload returned by get_avro.
  get_stamps:
    endpoint: get_stamps
    path: .
    description: Response payload returned by get_stamps.
  query_detections:
    endpoint: query_detections
