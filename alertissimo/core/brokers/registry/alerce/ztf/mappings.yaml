    path: .
    description: Response payload returned by query_non_detections.
  query_object:
    endpoint: query_object
    path: .
    description: Response payload returned by query_object.
  query_objects:
    endpoint: query_objects
    path: .
    description: Response payload returned by query_objects.
  query_probabilities:
    endpoint: query_probabilities
