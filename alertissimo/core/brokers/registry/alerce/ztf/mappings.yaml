broker: alerce
origin: ztf
source: Generated from alerce_schema_payload_audit_bundle.tar.gz; declared docs plus observed payload audit.
mapping_policy:
  semantic_mappings: Core scientific fields are mapped to stable semantic paths.
  raw_fallback: Remaining declared/observed fields are retained as *.raw.<field> entries inside the relevant record.
  unsupported_methods: Attributes from documented but nonimplemented methods are included with availability.endpoint_status=known_unsupported;
    endpoints.yaml is the authority for enabled/disabled method status.
  lightcurve: query_lightcurve exposes nested detections/non_detections/forced_photometry; these are modeled as alternate
    source fields for the same semantic records.
