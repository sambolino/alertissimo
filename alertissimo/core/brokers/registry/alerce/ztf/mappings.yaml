broker: alerce
origin: ztf
sources:
  summary:
    endpoints:
    - query_object
    payload_path: .
    record_scope:
    - summary
    status: observed
  query_probabilities:
    endpoints:
    - query_probabilities
    payload_path: '[]'
    record_scope:
    - classification
    status: observed
mappings:
  summary@ztf:alerce:
    source: summary
    fields:
      identity.object_id:
        field: oid
      position.ra:
        field: meanra
      position.dec:
        field: meandec
  classification@ztf:alerce:
    source: query_probabilities
    fields:
      assessment.{classifier_name}.class:
        field: class_name
      assessment.{classifier_name}.probability:
        field: probability
      assessment.{classifier_name}.version:
        field: classifier_version
      assessment.{classifier_name}.ranking:
        field: ranking
