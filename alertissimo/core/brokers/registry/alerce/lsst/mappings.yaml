broker: alerce
origin: lsst
sources:
  summary:
    endpoints:
    - query_object
    payload_path: .
    record_scope:
    - summary
    status: observed
  query_probabilities:
    endpoints:
    - query_probabilities
    payload_path: '[]'
    record_scope:
    - classification
    status: observed
  query_magstats:
    endpoints:
    - query_magstats
    payload_path: '[]'
    record_scope:
    - summary
    status: declared_only
    endpoint_status: known_unsupported
  query_non_detections:
    endpoints:
    - query_non_detections
    payload_path: '[]'
    record_scope:
    - detection
    status: declared_only
    endpoint_status: enabled
    live_status: empty_in_sampling
mappings:
  summary@lsst:alerce:
    source: summary
    fields:
      identity.object_id:
        field: oid
      position.ra:
        field: meanra
      position.dec:
        field: meandec
  classification@lsst:alerce:
    source: query_probabilities
    fields:
      assessment.{classifier_name}.class:
        field: class_name
      assessment.{classifier_name}.probability:
        field: probability
      assessment.{classifier_name}.version:
        field: classifier_version
      assessment.{classifier_name}.ranking:
        field: ranking
