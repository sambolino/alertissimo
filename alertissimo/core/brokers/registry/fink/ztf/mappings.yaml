broker: fink
origin: ztf
description: Minimal semantic mapping registry for Fink ZTF payloads.
payloads:
  objects:
    path: '[]'
    description: objects response payload.
  conesearch:
    path: '[]'
    description: conesearch response payload.
  latests:
    path: '[]'
    description: latests response payload.
  anomaly:
    path: '[]'
    description: anomaly response payload.
  cutouts:
    path: .
    description: cutouts response payload.
  sso:
    path: '[]'
    description: sso response payload.
  statistics:
    path: '[]'
    description: statistics response payload.
  resolver:
    path: '[]'
    description: resolver response payload.
