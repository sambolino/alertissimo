      - rank: 2
        availability: [objects, anomaly]
        mappings:
          identity.object_id: "i:objectidps2"
          separation.total: "i:distpsnr2"
          photometry.g.mag: "i:sgmag2"
          photometry.r.mag: "i:srmag2"
          photometry.i.mag: "i:simag2"
          photometry.z.mag: "i:szmag2"
          classification.assessment.star_galaxy.score: "i:sgscore2"
      - rank: 3
        availability: [objects, anomaly]
        mappings:
          identity.object_id: "i:objectidps3"
          separation.total: "i:distpsnr3"
          photometry.g.mag: "i:sgmag3"
          photometry.r.mag: "i:srmag3"
          photometry.i.mag: "i:simag3"
          photometry.z.mag: "i:szmag3"
          classification.assessment.star_galaxy.score: "i:sgscore3"
      
