  # ==================== Data products / cutout payloads ====================
  # Repeated data_product instances. The role/type/format constants qualify each
  # concrete instance; they are not encoded as fake producers or path suffixes.
  data_product@ztf:fink.payload:
    instances:
      - role: science
        type: cutout
        format: fits
        content_encoding: base64
        field: "b:cutoutScience_stampData"
        availability: [cutouts]
      - role: template
        type: cutout
        format: fits
        content_encoding: base64
        field: "b:cutoutTemplate_stampData"
        availability: [cutouts]
      - role: difference
        type: cutout
        format: fits
        content_encoding: base64
        field: "b:cutoutDifference_stampData"
        availability: [cutouts]
      
