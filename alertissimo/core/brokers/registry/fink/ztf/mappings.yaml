broker: fink
origin: ztf
sources:
  summary:
    endpoints:
    - objects
    payload_path: .
    record_scope:
    - summary
    status: observed
mappings:
  summary@ztf:fink:
    source: summary
    fields:
      identity.object_id:
        field: objectId
      position.ra:
        field: i:ra
      position.dec:
        field: i:dec
