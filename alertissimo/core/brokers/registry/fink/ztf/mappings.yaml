# brokers/fink/ztf/mappings.yaml
broker: fink
origin: ztf


mappings:
  # Prefer stable semantic paths. Leave fields unmapped when no accurate
  # catalog concept exists; do not leak broker-specific prefixes into field
  # names unless the value is genuinely broker-specific and documented.
  # Dynamic namespace-carrier mappings such as photometry.{filter} are
  # ordinary mappings to path-bearing containers: they resolve dynamic
  # path segments for dependent mappings and are not emitted as scalar leaves.
  # Keep section comments descriptive rather than tier-numbered.

  # ==================== Alert packet / atomic detection fields ====================
  detection@ztf:fink.position.ra:
    field: "i:ra"
    availability:
      - objects
      - conesearch
      - latests
      - sso
      - anomaly
      
  detection@ztf:fink.position.dec:
    field: "i:dec"
