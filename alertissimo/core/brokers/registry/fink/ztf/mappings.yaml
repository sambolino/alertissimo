mappings:
  # Prefer stable semantic paths. Leave fields unmapped when no accurate
  # catalog concept exists; do not leak broker-specific prefixes into field
  # names unless the value is genuinely broker-specific and documented.
  # Dynamic namespace-carrier mappings such as photometry.{filter} are
  # ordinary mappings to path-bearing containers: they resolve dynamic
  # path segments for dependent mappings and are not emitted as scalar leaves.
  # Keep section comments descriptive rather than tier-numbered.

  # ==================== Alert packet / atomic detection fields ====================
  detection@ztf:fink.position.ra:
    field: "i:ra"
    availability:
      - objects
      - conesearch
      - latests
      - sso
      - anomaly
      
  detection@ztf:fink.position.dec:
    field: "i:dec"
    availability:
      - objects
      - conesearch
      - latests
      - sso
      - anomaly
      
  detection@ztf:fink.position.image_x:
    field: "i:xpos"
    availability:
      - objects
      - sso
      - anomaly
      - latests
      
  detection@ztf:fink.position.image_y:
    field: "i:ypos"
    availability:
      - objects
      - sso
      - anomaly
      - latests
      
  detection@ztf:fink.position.distance_to_edge:
    field: "i:mindtoedge"
    availability:
      - objects
      - anomaly
      
  detection@ztf:fink.separation.from_search_center:
    field: "v:separation_degree"
    transform: degree_to_arcsec
    availability:
      - conesearch
      
  detection@ztf:fink.photometry.{filter}:
    field: "i:fid"
    transform: {1: "g", 2: "r", 3: "i"}
    availability:
      - objects
      - conesearch
      - latests
      - sso
      - anomaly
      
  detection@ztf:fink.photometry.{filter}.psf.mag:
    field: "i:magpsf"
    availability:
      - objects
      - conesearch
      - latests
      - sso
      - anomaly
      
  detection@ztf:fink.photometry.{filter}.psf.mag_error:
    field: "i:sigmapsf"
    availability:
      - objects
      - conesearch
      - sso
      - latests
      - anomaly
      
  detection@ztf:fink.time.mjd:
    field: "i:jd"
    transform: jd_to_mjd
    availability:
      - objects
      - conesearch
      - latests
      - sso
      - anomaly
      
  detection@ztf:fink.photometry.{filter}.limit.mag:
    field: "i:diffmaglim"
    availability:
      - objects
      - sso
      - latests
      - anomaly

  detection@ztf:fink.photometry.{filter}.limit.mag_offset_from_limit:
    field: "i:magfromlim"
    note: "Magnitude offset from limiting magnitude; adapter must preserve/document Fink sign convention."
    availability:
      - objects
      - anomaly
      

  detection@ztf:fink.calibration.{filter}.zero_point:
    field: "i:magzpsci"
