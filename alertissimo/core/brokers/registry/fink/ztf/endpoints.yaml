      - context.night_id
      - context.publisher
      - context.too_flag
      - detection.is_positive
      - history.detection_count
      - history.first_mjd
      - history.last_mjd
      - object.first_detection
      - object.last_detection
      - object.timespan_days
      - object.constellation
      - classification.fink_class
      - classification.snia_prob
      - classification.sn_prob
      - classification.snia_vs_cc_prob
      - classification.kilonova_prob
      - classification.microlensing_prob
      - classification.slsn_score
      - classification.anomaly_score
      - classification.blazar_m0
      - classification.blazar_m1
      - classification.blazar_m2
      - classification.is_transient
      - solar_system.roid
      - solar_system.mpc_name
      - solar_system.mpc_distance
      - solar_system.mpc_magnitude
      - solar_system.iau_name
      - solar_system.iau_number
      - tns.name
      - satellite.tracklet_id
      - gaia.variability_flag
      - gaia.variability_class
      - gaia.distance
      - gaia.magnitude
      - crossmatch.simbad_type
      - crossmatch.gaia_dr3_id
      - crossmatch.gaia_parallax
      - crossmatch.gaia_parallax_error
      - crossmatch.gcvs_type
      - crossmatch.vsx_type
      - crossmatch.spicy_id
      - crossmatch.spicy_class
      - crossmatch.blazar_3hsp
      - crossmatch.blazar_4lac
      - crossmatch.mangrove_2mass
      - crossmatch.mangrove_hyperleda
      - crossmatch.mangrove_distance
      - crossmatch.mangrove_luminosity_distance
      - crossmatch.ps1_distance
      - crossmatch.ps1_star_galaxy_score
      - ps1.nmatches
      - light_curve.g_features
      - light_curve.r_features
      - light_curve.first_detection_5sigma_mjd
      - light_curve.delta_time_first_detection
      - light_curve.magnitude_rate
      - light_curve.magnitude_rate_error
      - light_curve.rate_lower_percentile
      - light_curve.rate_upper_percentile
      - light_curve.delta_time_rate
      - light_curve.from_upper_limit
      - light_curve.detection_count
      
      # Cutouts - if withCutouts=true
      - cutouts.science
      - cutouts.template
      - cutouts.difference

  statistics:
    path: "/api/v1/statistics"
    method: GET
    description: "Get statistics about Fink and the ZTF alert stream"
    params:
      date:
        required: true
        type: string
        description: "Observing date. This can be either a given night (YYYYMMDD), month (YYYYMM), year (YYYY), or everything (empty string)."
      schema:
        required: false
        type: boolean
        description: "If True, return just the schema of statistics table instead of actual data"
      columns:
        required: false
        type: string
        description: "Comma-separated data columns to transfer, e.g. 'basic:sci,basic:date'. If not specified, transfer all columns."
      output-format:
        required: false
        type: string
        enum: ["json", "csv", "parquet", "votable"]
        default: "json"
        description: "Output format"
    output_type: single_object
    provides:
      - survey.date
      - survey.exposures
      - survey.fields
      - survey.raw_alerts
      - survey.science_alerts
      - survey.alerts_by_filter
      - survey.class_counts
      - survey.key
      - survey.timestamp
    notes: |
      - class_counts is a dynamic map containing all class:* fields
      - Class fields include SIMBAD types, Fink classes, and special categories

  resolver:
    path: "/api/v1/resolver"
    method: GET
    description: "Explore existing names for a given object"
    params:
      resolver:
        required: true
        type: string
        enum: ["simbad", "ssodnet", "tns"]
        description: "Resolver among: `simbad`, `ssodnet`, `tns`"
      name:
        required: true
        type: string
        description: "Object name to resolve."
      reverse:
        required: false
        type: boolean
        default: false
        description: "If True, resolve ZTF* name instead. Default is False."
      nmax:
        required: false
        type: integer
        default: 10
        description: "Maximum number of match to return. Default is 10."
      output-format:
        required: false
        type: string
        enum: ["json", "csv", "parquet", "votable"]
        default: "json"
        description: "Output format"
    output_type: array_of_objects
    provides:
      - resolver.catalog
      - resolver.external_id
      - resolver.type_code
      - resolver.position_string
      - position.ra
      - position.dec
      - resolver.external_name
      - resolver.redshift
      - resolver.reference_count
    notes: |
      - Returns array of matches from external catalog
      - position.ra and position.dec are extracted from jradeg/jdedeg
      - Different resolvers return different fields (some may be null)
