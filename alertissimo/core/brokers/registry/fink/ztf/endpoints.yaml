# brokers/fink/ztf/endpoints.yaml
broker: fink
origin: ztf
baseurl: https://api.ztf.fink-portal.org


endpoints:

  objects:
    path: "/api/v1/objects"
    method: GET
    description: "Retrieve object data from the Fink/ZTF database based on their name"
    params:
      objectId:
        required: true
        type: string
        description: "single ZTF Object ID, or a comma-separated list of object names, e.g. 'ZTF19acmdpyr,ZTF21aaxtctv'"
      withupperlim:
        required: false
        type: boolean
        description: "If True, retrieve also upper limit measurements, and bad quality measurements. Use the column `d:tag` in your results: valid, upperlim, badquality."
      withcutouts:
        required: false
        type: boolean
        description: "If True, retrieve also cutout data as 2D array. See also `cutout-kind`."
      cutout-kind:
        required: false
        type: string
        enum: ["Science", "Template", "Difference"]
        description: "`Science`, `Template`, or `Difference`. If not specified, returned all three."
      columns:
        required: false
        type: string
        description: "Comma-separated data columns to transfer, e.g. 'i:magpsf,i:jd'. If not specified, transfer all columns."
      output-format:
        required: false
        type: string
        enum: ["json", "csv", "parquet", "votable"]
        default: "json"
        description: "Output format"
    output_type: array_of_alerts
    provides:
      # Position
      - position.ra
      - position.dec
      - position.image_x
      - position.image_y
      - position.distance_to_edge
      
      # Photometry
      - photometry.psf_mag
      - photometry.psf_mag_error
      - photometry.mjd
      - photometry.filter
      - photometry.diff_mag_limit
      - photometry.zero_point
      - photometry.zero_point_rms
      - photometry.zero_point_uncertainty
      - photometry.exposure_time
      - photometry.aperture_mag
      - photometry.aperture_mag_big
      - photometry.aperture_mag_error
      - photometry.aperture_mag_big_error
      - photometry.mag_ap_minus_psf
      - photometry.mag_from_limit
      
      # Quality
      - quality.real_bogus
      - quality.rf_real_bogus
      - quality.psf_chisq
      - quality.star_galaxy
      - quality.fwhm
      - quality.elongation
      - quality.aimage
      - quality.bimage
      - quality.aimage_ratio
      - quality.bimage_ratio
      - quality.chinr
      - quality.sharpnr
      - quality.drb_version
      - quality.rb_version
      
      # Context
      - context.object_id
      - context.candid
      - context.field
      - context.night_id
      - context.program_id
      - context.publisher
      - context.broker_version
      - context.science_version
      - context.schema_version
      - context.pid
      - context.rfid
      - context.diffim_filename
      - context.too_flag
      
      # Detection
      - detection.is_positive
      - detection.upper_limit
      - detection.nbad_pixels
      - detection.nneg_pixels
      - detection.pixel_sum_ratio
      - detection.scorr
      - detection.ssnrms
      - detection.dsnrms
      - detection.dsdiff
      - detection.seeratio
      
      # History
      - history.detection_count
      - history.first_mjd
      - history.last_mjd
      
      # Reference
      - reference.nearest_distance
      - reference.nearest_magnitude
      - reference.nearest_magnitude_error
      - reference.nearest_ra
      - reference.nearest_dec
      - reference.first_mjd
      - reference.last_mjd
      - reference.nframes
      - reference.ncovhist
      
      # Calibration
      - calibration.color_coefficient
      - calibration.color_coefficient_uncertainty
      - calibration.color_median
      - calibration.color_rms
      - calibration.nmatches
      - calibration.zp_covariance
      - calibration.zp_median
      
      # Object Aggregates (L1)
      - object.first_detection
      - object.last_detection
      - object.timespan_days
      - object.constellation
      - photometry.magnitude_rate
      - photometry.magnitude_rate_error
      - color.g_minus_r
      - color.g_minus_r_error
      - color.g_minus_r_rate
      - color.g_minus_r_rate_error
      
      # Classification (L2)
      - classification.fink_class
      - classification.snia_prob
      - classification.sn_prob
      - classification.snia_vs_cc_prob
      - classification.kilonova_prob
      - classification.microlensing_prob
      - classification.slsn_score
      - classification.blazar_m0
      - classification.blazar_m1
      - classification.blazar_m2
      
      # Specialized (L3)
      - solar_system.roid
      - solar_system.mpc_name
      - solar_system.mpc_distance
      - solar_system.mpc_magnitude
      - tns.name
      - satellite.tracklet_id
      - gaia.distance
      - gaia.distance_bright
      - gaia.magnitude
      - gaia.magnitude_bright
      
      # Cross-Match (L4)
      - crossmatch.simbad_type
      - crossmatch.mangrove_2mass
      - crossmatch.mangrove_hyperleda
      - crossmatch.mangrove_distance
      - crossmatch.mangrove_luminosity_distance
      - crossmatch.ps1_object_id
      - crossmatch.ps1_distance
      - crossmatch.ps1_g_mag
      - crossmatch.ps1_r_mag
      - crossmatch.ps1_i_mag
      - crossmatch.ps1_star_galaxy_score
      - ps1.nmatches
      
      # Light Curve (L5)
      - light_curve.r_features
      - light_curve.magnitude_rate
      - light_curve.magnitude_rate_error
      - light_curve.rate_lower_percentile
      - light_curve.rate_upper_percentile
      - light_curve.detection_count
      
      # Cutouts (L6) - only if withcutouts=true
      - cutouts.science
      - cutouts.template
      - cutouts.difference
      

  conesearch:
    path: "/api/v1/conesearch"
    method: GET
    description: "Retrieve object data from the Fink/ZTF database based on their coordinates"
    params:
      ra:
        required: true
        type: number
        description: "Right Ascension, in decimal degree."
      dec:
        required: true
        type: number
        description: "Declination, in decimal degree."
      radius:
        required: true
        type: number
        description: "Conesearch radius in arcsec. Maximum is 18,000 arcseconds (5 degrees)."
      n:
        required: false
        type: integer
        default: 1000
        description: "Maximal number of alerts to return."
      startdate:
        required: false
        type: string
        default: "2019-11-01 00:00:00"
        description: "Starting date in UTC (iso, jd, or MJD). It restricts the search to alerts whose first detection was within the specified range of dates."
      stopdate:
        required: false
        type: string
        default: "now"
        description: "Stopping date in UTC (iso, jd, or MJD). It restricts the search to alerts whose first detection was within the specified range of dates."
      window:
        required: false
        type: number
        description: "Time window in days, may be used instead of stopdate."
      columns:
        required: false
        type: string
        description: "Comma-separated data columns to transfer, e.g. 'i:magpsf,i:jd'. If not specified, transfer all columns."
      output-format:
        required: false
        type: string
        enum: ["json", "csv", "parquet", "votable"]
        default: "json"
        description: "Output format"
    output_type: array_of_alerts
    provides:
      - position.ra
      - position.dec
      - position.cone_distance
      - photometry.psf_mag
      - photometry.psf_mag_error
      - photometry.mjd
      - photometry.filter
      - quality.real_bogus
      - context.object_id
      - context.candid
      - history.detection_count
      - history.first_mjd
      - crossmatch.simbad_type
      - light_curve.detection_count


  latests:
    path: "/api/v1/latests"
    method: GET
    description: "Retrieve object data from the Fink/ZTF database based on their Fink derived class"
    params:
      class:
        required: true
        type: string
        description: "Fink derived label. See https://api.ztf.fink-portal.org/api/v1/classes for available tags."
      trend:
        required: false
        type: string
        enum: ["rising", "fading", "low_state", "new_low_state"]
        description: "Desired trend among: rising, fading. For `class=(CTA) Blazar`, two specific trends are available: low_state, new_low_state."
      n:
        required: false
        type: integer
        default: 100
        description: "Last N alerts to transfer between stopping date and starting date."
      startdate:
        required: false
        type: string
        default: "2019-11-01 00:00:00"
        description: "Starting date in UTC (iso, jd, or MJD)."
      stopdate:
        required: false
        type: string
        default: "now"
        description: "Stopping date in UTC (iso, jd, or MJD)."
      color:
        required: false
        type: boolean
        default: false
        description: "If True, extract color information for the transient."
      columns:
        required: false
        type: string
        description: "Comma-separated data columns to transfer, e.g. 'i:magpsf,i:jd'. If not specified, transfer all columns."
      output-format:
        required: false
        type: string
        enum: ["json", "csv", "parquet", "votable"]
