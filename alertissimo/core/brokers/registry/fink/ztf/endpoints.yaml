      - gaia.distance
      - gaia.magnitude
      - crossmatch.simbad_type
      - crossmatch.gaia_dr3_id
      - crossmatch.gaia_parallax
      - crossmatch.gaia_parallax_error
      - crossmatch.gcvs_type
      - crossmatch.vsx_type
      - crossmatch.spicy_id
      - crossmatch.spicy_class
      - crossmatch.blazar_3hsp
      - crossmatch.blazar_4lac
      - crossmatch.mangrove_2mass
      - crossmatch.mangrove_hyperleda
      - crossmatch.mangrove_distance
      - crossmatch.mangrove_luminosity_distance
      - crossmatch.ps1_distance
      - crossmatch.ps1_star_galaxy_score
      - ps1.nmatches
      - light_curve.g_features
      - light_curve.r_features
      - light_curve.first_detection_5sigma_mjd
      - light_curve.delta_time_first_detection
      - light_curve.magnitude_rate
      - light_curve.magnitude_rate_error
      - light_curve.rate_lower_percentile
      - light_curve.rate_upper_percentile
      - light_curve.delta_time_rate
      - light_curve.from_upper_limit
      - light_curve.detection_count
      

