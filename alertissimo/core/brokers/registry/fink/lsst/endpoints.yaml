### brokers/fink/lsst/endpoints.yaml
broker: fink
origin: lsst
baseurl: https://api.lsst.fink-portal.org

endpoints:
  objects:
    path: "/api/v1/objects"
    method: GET
    description: "Retrieve Rubin/LSST object data based on diaObjectId"
    params:
      diaObjectId:
        required: true
        type: string
        description: "Single LSST diaObjectId or comma-separated list"
      withcutouts:
        required: false
        type: boolean
        description: "Include cutout data as 2D arrays"
      output-format:
        required: false
        type: string
        enum: ["json", "csv", "parquet", "votable"]
        default: "json"
    output_type: array_of_objects
    provides:
      - context.object_id
      - history.detection_count
      - position.ra
      - position.dec
      - position.ra_error
      - position.dec_error
      - position.ra_dec_covariance
      - history.first_mjd
      - history.last_mjd
      - summary.photometry.*
      - summary.forced_photometry.*
      - summary.fink.*

  conesearch:
    path: "/api/v1/conesearch"
    method: GET
    description: "Spatial query for the Rubin/LSST stream"
    params:
      ra:
        required: true
        type: number
      dec:
        required: true
        type: number
      radius:
        required: true
        type: number
        description: "Radius in arcseconds (max 18,000)"
    output_type: array_of_alerts
    provides:
      - position.ra
      - position.dec
      - position.cone_distance
      - photometry.mjd
      - photometry.filter
      - context.object_id
      - crossmatch.simbad_type

