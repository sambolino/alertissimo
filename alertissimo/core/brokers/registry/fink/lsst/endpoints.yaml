  sso:
    path: "/api/v1/sso"
    method: GET
    description: "Retrieve Solar System data with optional Miriade ephemerides"
    params:
      n_or_d:
        required: true
        type: string
        description: "IAU name, number, or provisional designation"
      withEphem:
        required: false
        type: boolean
        description: "Attach Miriade ephemerides (distance, phase, etc.)"
    output_type: array_of_alerts
    provides:
      - solar_system.ss_object_id
      - solar_system.roid
      - position.ra
      - position.dec
      - photometry.mjd
      - resolver.external_name
      - ephemeris.distance_earth
      - ephemeris.distance_sun
      - ephemeris.phase_angle
      - ephemeris.visual_mag

