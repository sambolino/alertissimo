  # Broker-specific object metadata for which the semantic recipe intentionally
  # leaves dynamic summary fields available.
  summary@lsst:fink.fink_is_cataloged:
    field: "f:is_cataloged"
    availability: [objects]
  summary@lsst:fink.fink_is_first:
    field: "f:is_first"
    availability: [objects]
  summary@lsst:fink.fink_is_sso:
    field: "f:is_sso"
    availability: [objects]
  summary@lsst:fink.fink_main_label_classifier:
    field: "f:main_label_classifier"
    availability: [objects]
  summary@lsst:fink.fink_main_label_crossmatch:
    field: "f:main_label_crossmatch"
    availability: [objects]
  summary@lsst:fink.fink_observation_reason:
    field: "r:observation_reason"
    availability: [objects]
  summary@lsst:fink.fink_target_name:
    field: "r:target_name"
    availability: [objects]
  summary@lsst:fink.fink_salt:
    field: "r:salt"
    availability: [objects]
  summary@lsst:fink.fink_validity_start_mjd:
    field: "r:validityStartMjdTai"
    availability: [objects]

  detection@lsst:fink.time.mjd:
    field: "r:midpointMjdTai"
    availability:
      - objects
      - conesearch
      - latests
      - sso

  detection@lsst:fink.photometry.{filter}:
    field: "r:band"
    availability:
      - objects
      - conesearch
      - latests
      - sso

  detection@lsst:fink.photometry.{filter}.psf.flux:
    field: "r:psfFlux"
    availability:
      - objects
      - conesearch
      - latests

  detection@lsst:fink.photometry.{filter}.psf.flux_error:
    field: "r:psfFluxErr"
    availability:
      - objects
      - conesearch
      - latests

  detection@lsst:fink.photometry.{filter}.psf.snr:
    field: "r:snr"
    availability:
      - objects
      - conesearch
      - latests

  # ==================== Solar System (moving objects) ====================
  detection@lsst:fink.solar_system.ss_object_id:
    field: "r:ssObjectId"
    availability:
      - sso

  detection@lsst:fink.solar_system.roid:
    field: "f:roid"
    availability:
      - objects
      - latests
      - sso
    status: unverified
    description: "Not present in the checked current LSST objects, conesearch, or SSO responses; retained for backward compatibility."

  # ==================== Media (binary data) ====================
  cutouts.science:
    field: "b:cutoutScience_stampData"
    availability:
      - cutouts

  cutouts.template:
    field: "b:cutoutTemplate_stampData"
    availability:
      - cutouts

  cutouts.difference:
    field: "b:cutoutDifference_stampData"
    availability:
      - cutouts

  # Canonical repeated data-product representation.  The legacy `cutouts.*`
  # mappings above remain for compatibility with existing endpoint consumers.
  data_product@lsst:fink.payload:
    instances:
      - role: science
        type: cutout
        format: fits
        content_encoding: base64
        field: "b:cutoutScience_stampData"
        availability: [cutouts]
      - role: template
        type: cutout
        format: fits
        content_encoding: base64
        field: "b:cutoutTemplate_stampData"
        availability: [cutouts]
      - role: difference
        type: cutout
        format: fits
        content_encoding: base64
        field: "b:cutoutDifference_stampData"
        availability: [cutouts]

  # ==================== Machine learning (ELAsTiCC) ====================
  classification@fink.best.class:
    field: "v:classification"
    availability:
      - objects
      - latests
      - sso

  classification@fink.assessment.cats_pure.score:
    field: "f:cats_pure_score"
    availability:
      - objects
      - latests

  classification@fink.assessment.rf_snia_vs_all.probability:
    field: "f:rf_snia_vs_all"
    availability:
      - objects
      - latests

  classification@fink.assessment.snn_snia_vs_all.probability:
    field: "f:snn_snia_vs_all"
    availability:
      - objects
      - latests

  classification@fink.assessment.rf_slsn_vs_all.probability:
    field: "f:rf_slsn_vs_all"
    availability:
      - objects
      - latests

  # Current LSST conesearch responses expose these classifier products under
  # `f:clf_*`.  They are separate from the older model-specific mappings above.
  classification@fink.assessment.cats.class:
    field: "f:clf_cats_class"
    availability: [conesearch]

  classification@fink.assessment.cats.score:
    field: "f:clf_cats_score"
    availability: [conesearch]

  classification@fink.assessment.early_snia.score:
    field: "f:clf_earlySNIa_score"
    availability: [conesearch]

  classification@fink.assessment.snn_sn_vs_others.score:
    field: "f:clf_snnSnVsOthers_score"
    availability: [conesearch]

  # ==================== Enrichment (crossmatch) ====================
  crossmatch@simbad:fink.classification.best.class:
    field: "f:xm_simbad_otype"
    fallback_field: "f:xm.cdsxmatch"
    availability:
      - objects
      - conesearch

  crossmatch@gaia:fink.identity.object_id:
    field: "f:xm_gaiadr3_DR3Name"
    fallback_field: "f:xm.DR3Name"
    availability:
      - objects

  # Miriade ephemeris values (target, delta, r, phase, mv) deliberately have
  # no mapping here: feature_catalog.yaml has no ephemeris semantic container.
  # Add that container before exposing these source-specific fields.
