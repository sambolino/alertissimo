### brokers/fink/lsst/mappings.yaml
broker: fink
origin: lsst

mappings:
  # ==================== L0: Portfolio (Object-Level) ====================
  context.object_id:
    field: "r:diaObjectId"
    availability:
      - objects
      - conesearch
      - latests
      - sso

  history.detection_count:
    field: "r:nDiaSources"
    availability:
      - objects
      - latests

  history.first_mjd:
    field: "r:firstDiaSourceMjdTai"
    availability:
      - objects

  history.last_mjd:
    field: "r:lastDiaSourceMjdTai"
    availability:
      - objects

  history.first_mjd_fink:
    field: "f:firstDiaSourceMjdTaiFink"
    availability:
      - objects

  # ==================== L1: Detection (Real-Time) ====================
  position.ra:
    field: "r:ra"
    availability:
      - objects
      - conesearch
      - latests
      - sso
  
  position.dec:
    field: "r:dec"
    availability:
      - objects
      - conesearch
      - latests
      - sso

  position.ra_error:
    field: "r:raErr"
