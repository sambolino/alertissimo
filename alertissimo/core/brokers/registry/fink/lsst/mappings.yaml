broker: fink
origin: lsst
sources:
  summary:
    endpoints:
    - objects
    payload_path: .
    record_scope:
    - summary
    status: observed
mappings:
  summary@lsst:fink:
    source: summary
    fields:
      identity.object_id:
        field: r:diaObjectId
      position.ra:
        field: r:ra
      position.dec:
        field: r:dec
