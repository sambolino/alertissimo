# brokers/fink/lsst/mappings.yaml
broker: fink
origin: lsst

mappings:
  # Prefer stable semantic paths.  Keep legacy feature IDs and add a new
  # mapping only when an exact semantic representation exists. Dynamic
  # `{filter}` entries bind dependent photometry paths.

  # ==================== Object-level portfolio ====================
  summary@lsst:fink.identity.object_id:
    field: "r:diaObjectId"
    availability:
      - objects
      - conesearch
      - latests
      - sso

  summary@lsst:fink.detection_count:
    field: "r:nDiaSources"
    availability:
      - objects
      - latests

  summary@lsst:fink.time.first_mjd:
    field: "r:firstDiaSourceMjdTai"
    availability:
      - objects

  summary@lsst:fink.time.last_mjd:
    field: "r:lastDiaSourceMjdTai"
    availability:
      - objects

  summary@lsst:fink.fink_first_mjd:
    field: "f:firstDiaSourceMjdTaiFink"
    availability:
      - objects

  # ==================== Real-time detections ====================
  detection@lsst:fink.position.ra:
    field: "r:ra"
    availability:
      - conesearch
      - latests
      - sso
  
  detection@lsst:fink.position.dec:
    field: "r:dec"
    availability:
      - conesearch
      - latests
      - sso

  summary@lsst:fink.position.ra:
    field: "r:ra"
    availability:
      - objects

  summary@lsst:fink.position.dec:
    field: "r:dec"
    availability:
      - objects

  summary@lsst:fink.position.ra_error:
    field: "r:raErr"
    availability:
      - objects

  summary@lsst:fink.position.dec_error:
    field: "r:decErr"
    availability:
      - objects

  summary@lsst:fink.position.ra_dec_covariance:
    field: "r:ra_dec_Cov"
    availability:
      - objects

  # ==================== Per-band object aggregates ====================
  # `psfFlux*` and `fpFlux*` are Fink's per-band summary statistics.  They
  # are object-level values, unlike the alert fields below.
  summary@lsst:fink.photometry.g.psf.flux_error_mean:
    field: "r:g_psfFluxErrMean"
    availability: [objects]
  summary@lsst:fink.photometry.g.psf.maximum:
    field: "r:g_psfFluxMax"
    availability: [objects]
  summary@lsst:fink.photometry.g.psf.maximum_slope:
    field: "r:g_psfFluxMaxSlope"
    availability: [objects]
  summary@lsst:fink.photometry.g.psf.mean:
    field: "r:g_psfFluxMean"
    availability: [objects]
  summary@lsst:fink.photometry.g.psf.mean_error:
    field: "r:g_psfFluxMeanErr"
    availability: [objects]
  summary@lsst:fink.photometry.g.psf.minimum:
    field: "r:g_psfFluxMin"
    availability: [objects]
  summary@lsst:fink.photometry.g.psf.measurement_count:
    field: "r:g_psfFluxNdata"
    availability: [objects]
  summary@lsst:fink.photometry.g.psf.sigma:
    field: "r:g_psfFluxSigma"
    availability: [objects]
  summary@lsst:fink.forced_photometry.g.psf.mean:
    field: "r:g_fpFluxMean"
    availability: [objects]
  summary@lsst:fink.forced_photometry.g.psf.mean_error:
