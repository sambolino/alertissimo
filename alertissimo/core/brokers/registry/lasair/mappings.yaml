# brokers/lasair/ztf/mappings.yaml
broker: lasair
origin: ztf

mappings:
### ==================== L0: Portfolio Aggregates (Aggregated Summary) ====================
  portfolio.id:
    field: "objectId"
    availability:
      - objects
      - streaming
  portfolio.detection_count:
    field: "objectData.ncand"
    availability:
      - objects
  portfolio.sg_score:
    field: "objectData.sgscore1"
    description: "Star/Galaxy score (0.0=galaxy, 1.0=star)"
    availability:
      - objects
  portfolio.first_mjd:
    field: "objectData.jdmin"
    transform: "jd_to_mjd"
    availability:
      - objects
  portfolio.last_mjd:
    field: "objectData.jdmax"
    transform: "jd_to_mjd"
    availability:
      - objects
  position.ra:
    field: "objectData.ramean"
    availability:
      - objects
  position.dec:
    field: "objectData.decmean"
    availability:
      - objects

### ==================== L1: Single Detection Parameters (Epoch Records) ====================
  position.ra:
    field: "ra"
    availability:
      - detections
      - streaming
  position.dec:
    field: "dec"
    availability:
      - detections
      - streaming
  photometry.psf_mag:
    field: "magpsf"
    availability:
      - detections
      - streaming
  photometry.psf_mag_error:
    field: "sigmapsf"
    availability:
      - detections
      - streaming
  photometry.mjd:
    field: "mjd" # API lightcurves() endpoint normalizes JD to MJD automatically
    availability:
      - detections
      - streaming
  photometry.filter:
    field: "filterName" # Confirmed available in High-Fidelity API snippet
    fallback_field: "fid"
    transform:
      1: "g"
      2: "r"
      3: "i"
    availability:
      - detections
      - streaming
  detection.is_positive:
    field: "isdiffpos"
    transform:
      "t": true
      "f": false
    availability:
      - detections

### ==================== L4: Light Curve Features (Parametric Fits) ====================
  lightcurve.flux_jump:
    field: "objectData.jump1"
    description: "Sigma significance of largest flux deviation (70d baseline)"
    availability:
      - objects
  lightcurve.flux_jump_secondary:
    field: "objectData.jump2"
    availability:
      - objects
  lightcurve.fit_model:
    field: "objectData.fit_model_type"
    description: "Winning regression template (Bazin or Linexp)"
    availability:
      - objects
  lightcurve.rise_rate:
    field: "objectData.rise_rate"
    unit: "mag/day"
    availability:
      - objects
  lightcurve.fall_rate:
    field: "objectData.fall_rate"
    unit: "mag/day"
    availability:
      - objects
  lightcurve.fitted_temperature:
    field: "objectData.fitted_temperature"
    unit: "Kelvin"
    availability:
      - objects
  lightcurve.chi2:
    field: "objectData.chi2_fit"
    availability:
      - objects

### ==================== L5: Machine Learning (NEEDLE Multi-Class) ====================
  classification.needle.sn_prob:
    field: "classjson.SN"
    transform: "float" # NEEDLE scores are string-encoded floats in raw JSON
    availability:
      - objects
      - streaming
    filter:
      topic: "NEEDLE"
  classification.needle.slsn_i_prob:
    field: 'classjson["SLSN-I"]'
    transform: "float"
    availability:
      - objects
      - streaming
    filter:
      topic: "NEEDLE"
  classification.needle.tde_prob:
    field: "classjson.TDE"
    transform: "float"
    availability:
      - objects
      - streaming
    filter:
      topic: "NEEDLE"
  classification.needle.agn_prob:
    field: "classjson.AGN"
    transform: "float"
    availability:
      - objects
      - streaming
    filter:
      topic: "NEEDLE"

### ==================== L6: Contextual Enrichment (Sherlock & TNS) ====================
  classification.sherlock.class:
    field: "sherlock.classification"
    description: "Contextual label (SN, NT, AGN, VS, CV, BS, ORPHAN)"
    availability:
      - objects
      - streaming
  crossmatch.tns.id:
    field: "tns.tns_name"
    description: "IAU designate (e.g., AT2021abc)"
    availability:
      - objects

# brokers/lasair/lsst/mappings.yaml
broker: lasair
origin: lsst

mappings:
### ==================== L1: Rubin/LSST Direct Detections ====================
  photometry.flux:
    field: "psfFlux"
    unit: "nJy"
    availability:
      - diaSources
  photometry.flux_error:
    field: "psfFluxErr"
    unit: "nJy"
    availability:
      - diaSources
  quality.snr:
    field: "snr"
    availability:
      - diaSources
  detection.is_extended:
    field: "extendedness"
    description: "0.0=point-like, 1.0=extended"
    availability:
      - diaSources

# brokers/lasair/solar_system/mappings.yaml
broker: lasair
origin: solar_system

mappings:
### ==================== L2: Solar System (APDB SSObject/SSSource) ====================
  solar_system.id:
    field: "ssObjectId"
    availability:
      - ssObjects
  solar_system.designation:
    field: "designation"
    availability:
      - ssObjects
      - mpc_orbits
  solar_system.orbit.semi_major_axis:
    field: "a"
    unit: "AU"
    availability:
      - mpc_orbits
  solar_system.orbit.eccentricity:
    field: "e"
    availability:
      - mpc_orbits
  solar_system.orbit.inclination:
    field: "i"
    unit: "deg"
    availability:
      - mpc_orbits
  solar_system.residual_ra:
    field: "ephOffsetRa"
    unit: "arcsec"
    availability:
      - ssSources

# brokers/lasair/ztf/endpoints.yaml
broker: lasair
origin: ztf
baseurl: https://lasair-ztf.lsst.ac.uk
endpoints:
  objects:
    path: "/api/object/"
    method: POST
    params:
      objectIds:
        required: true
        type: string
      token:
        required: true
        type: string
    output_type: array_of_objects
    provides:
      - portfolio.*
      - lightcurve.*
      - classification.needle.*
      - classification.sherlock.*
      - crossmatch.tns.*

  lightcurves:
    path: "/api/lightcurves/"
    method: POST
    params:
      objectIds:
        required: true
        type: string
      token:
        required: true
        type: string
    output_type: array_of_lightcurves
    provides:
      - photometry.*
      - position.*
      - detection.is_positive