# brokers/lasair/ztf/endpoints.yaml
broker: lasair
origin: ztf
baseurl: https://lasair-ztf.lsst.ac.uk
endpoints:
  objects:
    path: "/api/object/"
    method: POST
    description: "Retrieve comprehensive object metadata, including light curve features, Sherlock context, and ML scores."
    params:
      objectIds:
        required: true
        type: string
        description: "Comma-separated list of Lasair object IDs (e.g., 'ZTF21abcgnqn')."
      token:
        required: true
        type: string
        description: "API authentication token."
    output_type: array_of_objects
    provides:
      # L0 Portfolio
      - portfolio.id
      - portfolio.detection_count
      - portfolio.first_mjd
      - portfolio.last_mjd
      - position.ra
      - position.dec
      # L4 Light Curve Features (Nested in objectData)
      - lightcurve.flux_jump
      - lightcurve.flux_jump_secondary
      - lightcurve.ebv
      - lightcurve.fit_model
      - lightcurve.rise_rate
      - lightcurve.fall_rate
      - lightcurve.fitted_temperature
      - lightcurve.chi2
      # L5 Machine Learning (NEEDLE Flat classjson)
      - classification.needle.sn_prob
      - classification.needle.slsn_i_prob
      - classification.needle.tde_prob
      - classification.needle.agn_prob
      # L6 Enrichment
      - classification.sherlock.class
      - crossmatch.tns.id

  lightcurves:
    path: "/api/lightcurves/"
    method: POST
    description: "Retrieve streamlined, machine-readable photometric time-series normalized to MJD."
    params:
      objectIds:
        required: true
        type: string
      token:
        required: true
        type: string
    output_type: array_of_lightcurves
    provides:
      # L1 Detections
      - photometry.mjd
      - photometry.psf_mag
      - photometry.psf_mag_error
      - photometry.filter
      - detection.is_positive
      - position.ra
      - position.dec

  conesearch:
    path: "/api/cone/"
    method: POST
    description: "Search for objects within a specified radius of a sky position."
    params:
      ra:
        required: true
        type: number
      dec:
        required: true
        type: number
      radius:
        required: true
        type: number
        description: "Search radius in arcseconds (max 3600)."
      token:
        required: true
        type: string
    output_type: array_of_objects
    provides:
      - portfolio.id
      - position.ra
      - position.dec

# brokers/lasair/lsst/endpoints.yaml
broker: lasair
origin: lsst
baseurl: https://lasair.lsst.ac.uk
endpoints:
  diaObjects:
    path: "/api/object/"
    method: POST
    params:
      objectIds:
        required: true
        type: string
      token:
        required: true
        type: string
    output_type: array_of_objects
    provides:
      - portfolio.id
      - portfolio.detection_count
  diaSources:
    path: "/api/lightcurves/"
    method: POST
    params:
      objectIds:
        required: true
        type: string
      token:
        required: true
        type: string
    output_type: array_of_lightcurves
    provides:
      - photometry.filter
      - photometry.mjd