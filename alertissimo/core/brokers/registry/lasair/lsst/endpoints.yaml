# brokers/lasair/lsst/endpoints.yaml
# Physical contracts for the authenticated Lasair LSST REST API.
broker: lasair
origin: lsst
baseurl: https://api.lasair.lsst.ac.uk

endpoints:
  object:
    path: /api/object/
    method: POST
    description: Retrieve one Rubin/LSST diaObject and optional Lasair-added context.
    headers: &token_header
      Authorization:
        required: true
        type: string
        description: Lasair API token, formatted as 'Token <token>'.
    params:
      objectId:
        required: true
        type: string
        description: LSST diaObjectId.
      lasair_added:
        required: false
        type: boolean
        default: true
        description: Include Lasair-added Sherlock, TNS, annotation, and image-url context.
    output:
      type: object
      item: object_record
    operation_types: [object_lookup, object_summary, object_history]
    server_filters: [objectId, lasair_added]
    projection:
      supports_columns: false

  cone:
    path: /api/cone/
    method: POST
    description: Search LSST diaObjects around a sky position.
    headers: *token_header
    params: &cone_params
      ra:
        required: true
        type: number
        unit: deg
        description: Right ascension in decimal degrees.
      dec:
        required: true
        type: number
        unit: deg
        description: Declination in decimal degrees.
      radius:
        required: true
        type: number
        unit: arcsec
        description: Angular cone radius in arcseconds; maximum 1000 arcseconds.
      requestType:
        required: true
        type: string
        enum: [nearest, all, count]
        default: all
        description: 'Cone request type: nearest, all, or count.'
    output:
      type: array
      item: cone_result
    operation_types: [spatial_search, object_search]
    server_filters: [ra, dec, radius, requestType]
    projection:
      supports_columns: false

  query:
    path: /api/query/
    method: POST
    description: Run an authenticated SQL SELECT over Lasair LSST tables.
    headers: *token_header
    params: &query_params
      selected:
        required: true
        type: string
        description: Comma-separated list of attributes to return.
      tables:
        required: true
        type: string
        description: Comma-separated or joined Lasair table expression.
      conditions:
        required: true
        type: string
        description: SQL WHERE criteria without the WHERE keyword.
      limit:
        required: false
        type: integer
        default: 1000
        description: Maximum number of records to return.
      offset:
        required: false
        type: integer
        default: 0
        description: Offset of the first returned record.
    output:
      type: array
      item: query_row
    operation_types: [sql_query, object_search, table_query]
    server_filters: [selected, tables, conditions, limit, offset]
    projection:
      supports_columns: true
      param: selected

  sherlock_object:
    path: /api/sherlock/object/
    method: POST
    description: Retrieve Sherlock classification and catalogue context for one LSST object.
    headers: *token_header
    params:
      objectId:
        required: true
        type: string
        description: Object identifier for Sherlock context lookup.
      lite:
        required: false
        type: boolean
        default: true
        description: Return lite Sherlock context when true.
    output:
      type: object
      item: sherlock_context
    operation_types: [sherlock_lookup, crossmatch_lookup, classification_lookup]
    server_filters: [objectId, lite]
    projection:
      supports_columns: false

  sherlock_position:
    path: /api/sherlock/position/
    method: POST
    description: Retrieve Sherlock classification and catalogue context at an LSST sky position.
    headers: *token_header
    params: &sherlock_position_params
      ra:
        required: true
        type: number
        unit: deg
        description: Right ascension in decimal degrees.
      dec:
        required: true
        type: number
        unit: deg
        description: Declination in decimal degrees.
      lite:
        required: false
        type: boolean
        default: true
        description: Return lite Sherlock context when true.
    output:
      type: object
      item: sherlock_context
    operation_types: [sherlock_position_lookup, crossmatch_lookup, classification_lookup]
    server_filters: [ra, dec, lite]
    projection:
      supports_columns: false
