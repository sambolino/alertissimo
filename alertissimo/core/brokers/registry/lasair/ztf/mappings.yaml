# Source paths verified against authenticated Lasair ZTF REST API responses.
broker: lasair
origin: ztf
description: Minimal payload references for Lasair's REST-first ZTF registry.
notes: Dynamic Sherlock catalogue producers are represented by the existing {producer} semantic qualifier.
payloads:
  object: {endpoint: object, path: "."}
  objects: {endpoint: objects, path: "[]"}
  query: {endpoint: query, path: "[]"}
  cone: {endpoint: cone, path: "[]"}
  candidates: {endpoint: object, path: "candidates[]"}
  lightcurve_candidates: {endpoint: lightcurves, path: "[].candidates[]"}
  sherlock: {endpoint: object, path: "sherlock[]"}
  tns: {endpoint: object, path: "TNS[]"}

mappings:
  summary@ztf:lasair.identity.object_id: [object#objectId, objects#objectId]
  summary@ztf:lasair.detection_count: [object#objectData.ncand, objects#objectData.ncand]
  summary@ztf:lasair.time.first_mjd: [object#objectData.jdmin, objects#objectData.jdmin]
  summary@ztf:lasair.time.last_mjd: [object#objectData.jdmax, objects#objectData.jdmax]
  summary@ztf:lasair.position.ra: [object#objectData.ramean, objects#objectData.ramean]
  summary@ztf:lasair.position.dec: [object#objectData.decmean, objects#objectData.decmean]
  detection@ztf:lasair.identity.source_id: [candidates#candid, lightcurve_candidates#candid]
  detection@ztf:lasair.time.mjd: [candidates#jd, lightcurve_candidates#jd]
  detection@ztf:lasair.position.ra: [candidates#ra]
  detection@ztf:lasair.position.dec: [candidates#dec]
  detection@ztf:lasair.photometry.{filter}: [candidates#fid, lightcurve_candidates#fid]
  detection@ztf:lasair.photometry.{filter}.psf.mag: [candidates#magpsf, lightcurve_candidates#magpsf]
  detection@ztf:lasair.photometry.{filter}.psf.mag_error: [candidates#sigmapsf, lightcurve_candidates#sigmapsf]
  detection@ztf:lasair.reference_image.nearest_source.photometry.{filter}.mag: [candidates#magnr, lightcurve_candidates#magnr]
  detection@ztf:lasair.reference_image.nearest_source.photometry.{filter}.mag_error: [candidates#sigmagnr, lightcurve_candidates#sigmagnr]
  detection@ztf:lasair.calibration.{filter}.zero_point: [candidates#magzpsci, lightcurve_candidates#magzpsci]
  detection@ztf:lasair.quality.real_bogus: [candidates#drb]
  detection@ztf:lasair.image_metrics.is_positive: [candidates#isdiffpos, lightcurve_candidates#isdiffpos]
  classification@lasair.assessment.sherlock.class: [sherlock#classification]
  classification@lasair.assessment.sherlock.score: [sherlock#classificationReliability]
  classification@tns:lasair.best.class: [tns#type]
  crossmatch@{producer}:lasair.identity.object_id: [sherlock#catalogue_object_id]
  crossmatch@{producer}:lasair.position.ra: [sherlock#raDeg]
  crossmatch@{producer}:lasair.position.dec: [sherlock#decDeg]
  crossmatch@{producer}:lasair.separation.total: [sherlock#separationArcsec]
  crossmatch@tns:lasair.identity.object_id: [tns#name]
  crossmatch@tns:lasair.position.ra: [tns#ra]
  crossmatch@tns:lasair.position.dec: [tns#decl]
  crossmatch@tns:lasair.redshift.value: [tns#z]

transforms:
  summary@ztf:lasair.time.first_mjd:
    object#objectData.jdmin: {type: jd_to_mjd}
    objects#objectData.jdmin: {type: jd_to_mjd}
  summary@ztf:lasair.time.last_mjd:
    object#objectData.jdmax: {type: jd_to_mjd}
    objects#objectData.jdmax: {type: jd_to_mjd}
  detection@ztf:lasair.time.mjd:
    candidates#jd: {type: jd_to_mjd}
    lightcurve_candidates#jd: {type: jd_to_mjd}
  detection@ztf:lasair.photometry.{filter}:
    candidates#fid: &fid_map
      type: value_map
      map: {1: g, 2: r, 3: i}
    lightcurve_candidates#fid: *fid_map
  detection@ztf:lasair.image_metrics.is_positive:
    candidates#isdiffpos: &polarity_map
      type: value_map
      map: {t: true, f: false}
    lightcurve_candidates#isdiffpos: *polarity_map
