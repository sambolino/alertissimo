# brokers/lasair/ztf/endpoints.yaml
# Verified against the authenticated Lasair ZTF REST API.
broker: lasair
origin: ztf
baseurl: https://lasair-ztf.lsst.ac.uk

endpoints:
  object:
    path: "/api/object/"
    method: POST
    description: "Retrieve one ZTF object with its summary, candidate history, Sherlock/TNS context, and cutout URLs."
    headers:
      Authorization:
        required: true
        type: string
        description: "Lasair ZTF API token, formatted as 'Token <token>'."
    params:
      objectId: {required: true, type: string}
      lasair_added:
        required: false
        type: boolean
        default: true
        description: "Include Lasair-added context such as Sherlock, TNS, and image URLs."
      lite: {required: false, type: boolean, default: false}
    output_type: ztf_object
    provides:
      - summary@ztf:lasair.*
      - detection@ztf:lasair.*
      - classification@lasair.assessment.*
      - crossmatch@{producer}:lasair.*
      - data_product@ztf:lasair

  objects:
    path: "/api/objects/"
    method: POST
    description: "Retrieve machine-readable records for a comma-separated list of ZTF object IDs."
    headers:
      Authorization:
        required: true
        type: string
        description: "Lasair ZTF API token, formatted as 'Token <token>'."
    params:
      objectIds:
        required: true
        type: string
        description: "Comma-separated ZTF object IDs."
    output_type: array_of_ztf_objects
    provides:
      - summary@ztf:lasair.*
      - detection@ztf:lasair.*

  lightcurves:
    path: "/api/lightcurves/"
    method: POST
    description: "Retrieve ZTF candidate light curves for one or more object IDs. Magnitudes are difference magnitudes."
    headers:
      Authorization:
        required: true
        type: string
        description: "Lasair ZTF API token, formatted as 'Token <token>'."
    params:
      objectIds: {required: true, type: string}
    output_type: array_of_ztf_lightcurves
    provides:
      - detection@ztf:lasair.*
      - lightcurve@ztf:lasair.*

  conesearch:
    path: "/api/cone/"
    method: POST
    description: "Search ZTF objects around a sky position; returns object identifiers and angular separations."
    headers:
      Authorization:
        required: true
        type: string
        description: "Lasair ZTF API token, formatted as 'Token <token>'."
    params:
      ra: {required: true, type: number}
      dec: {required: true, type: number}
      radius:
        required: true
        type: number
        description: "Cone radius in arcseconds (maximum 1000)."
      requestType:
        required: false
        type: string
        enum: [nearest, all, count]
        default: all
    output_type: cone_search_result
    provides:
      - summary@ztf:lasair.identity.object_id

  query:
    path: "/api/query/"
    method: POST
    description: "Run an authenticated SQL SELECT over Lasair ZTF tables. Returned fields are selected by the caller."
    headers:
      Authorization:
        required: true
        type: string
        description: "Lasair ZTF API token, formatted as 'Token <token>'."
    params:
      selected: {required: true, type: string}
      tables: {required: true, type: string}
      conditions: {required: true, type: string}
      limit: {required: false, type: integer, default: 1000}
      offset: {required: false, type: integer, default: 0}
    output_type: array_of_query_rows
    provides:
      - summary@ztf:lasair.*
      - crossmatch@{producer}:lasair.*

  sherlock_object:
    path: "/api/sherlock/object/"
    method: POST
    description: "Retrieve Sherlock classification and catalog-context candidates for one ZTF object."
    headers:
      Authorization:
        required: true
        type: string
        description: "Lasair ZTF API token, formatted as 'Token <token>'."
    params:
      objectId: {required: true, type: string}
      lite: {required: false, type: boolean, default: true}
    output_type: sherlock_context
    provides:
      - classification@lasair.assessment.sherlock.*
      - crossmatch@{producer}:lasair.*
