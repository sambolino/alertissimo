broker: antares
origin: ztf
sources:
  summary:
    endpoints: &id001
    - get_by_id
    - cone_search
    - get_by_ztf_object_id
    - search
    payload_path: .
    record_scope:
    - summary
    status: declared
  alert:
    endpoints: *id001
    payload_path: alerts[]
    record_scope:
    - detection
    status: declared_lazy
mappings:
  summary@ztf:antares:
    source: summary
    fields:
      identity.object_id:
        field: locus_id
      position.ra:
        field: ra
      position.dec:
        field: dec
  detection@ztf:antares:
    source: alert
    fields:
      identity.alert_id:
        field: alert_id
      time.mjd:
        field: mjd
dynamic:
  summary@ztf:antares.properties.{field}:
    source: summary
    field: properties.{field}
    status: raw_extension
  detection@ztf:antares.properties.{field}:
    source: alert
    field: properties.{field}
    status: raw_extension
