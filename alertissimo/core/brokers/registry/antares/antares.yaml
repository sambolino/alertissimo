# brokers/antares/multi_messenger/mappings.yaml
broker: antares
origin: multi_messenger

mappings:
  ### ==================== L8: External Notices ====================

  notice.id:
    field: "gracedb_id"
    availability:
      - notice

  notice.type:
    field: "notice_type"
    availability:
      - notice

  notice.skymap:
    field: "skymap_base64"
    availability:
      - notice

  notice.time:
    field: "event_datetime"
    availability:
      - notice

  ### ==================== L6: Multi-Messenger Enrichment ====================

  enrichment.coincident_alerts:
    field: "get_coincident_loci()"
    availability:
      - notice

