### brokers/antares/ztf/endpoints.yaml
broker: antares
origin: ztf
baseurl: https://antares.noirlab.edu/api/v1

endpoints:
  locus_detail:
    path: "/loci/{locus_id}"
    method: GET
    description: "Retrieve complete portfolio for an object (Locus view)."
    params:
      locus_id: { required: true, type: string }
    output_type: single_object
    provides:
      - portfolio.id
      - portfolio.ztf_id
      - portfolio.detection_count
      - lightcurve.features
      - crossmatch.catalogs

  search:
    path: "/loci"
    method: GET
    description: "Elasticsearch-based search for scientific criteria."
    params:
      query: { required: true, type: json }
    output_type: array_of_objects
    provides:
      - position.ra
      - position.dec
      - photometry.psf_mag
      - classification.antares_tags

  streaming_kafka:
    path: "kafka.antares.noirlab.edu:9092"
    method: STREAM
    description: "Real-time alert redistribution by science tags."
    topics:
      - "antares_public"
      - "high_snr"
    provides:
      - portfolio.last_mjd
      - quality.real_bogus

  thumbnails:
    path: "/alerts/{alert_id}/thumbnails"
    method: GET
    description: "Retrieve FITS cutout postage stamps."
    params:
      alert_id: { required: true, type: string }
    output_type: binary_blob
    provides:
      - cutouts.stamps

  statistics:
    path: "/loci/statistics"
    method: GET
    description: "Retrieve aggregate tag and alert counts."
    output_type: single_object
    provides:
      - survey.class_distribution

  resolver:
    path: "/loci"
    method: GET
    description: "Resolve external survey IDs to ANTARES Loci."
    params:
      ztf_object_id: { required: false, type: string }
      lsst_dia_object_id: { required: false, type: string }
    output_type: single_object
    provides:
      - portfolio.id

  watchlists:
    path: "/watchlists"
    method: GET
    description: "Access user-defined regions of interest."
    output_type: array_of_objects
    provides:
      - portfolio.id