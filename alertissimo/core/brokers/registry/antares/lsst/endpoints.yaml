# brokers/antares/lsst/endpoints.yaml
# ANTARES uses the same JSON:API v1 service for ZTF and Rubin/LSST.  LSST
# loci are selected with properties.survey.lsst.dia_object_id.
broker: antares
origin: lsst
baseurl: https://api.antares.noirlab.edu/v1

endpoints:
  loci:
    path: "/loci"
    method: GET
    description: "Search Rubin/LSST locus summaries with an Elasticsearch locus-listing query. Filter on properties.survey.lsst.dia_object_id to restrict results to LSST."
    params:
      elasticsearch_query[locus_listing]:
        required: true
        type: json
        description: "JSON Elasticsearch query. For one object use a term query on properties.survey.lsst.dia_object_id."
      sort:
        required: false
        type: string
        default: "-properties.newest_alert_observation_time"
    output_type: array_of_locus_summaries
    provides:
      - summary@lsst:antares.*

  locus:
    path: "/loci/{locus_id}"
    method: GET
    description: "Retrieve one Rubin/LSST ANTARES locus and its object-level metadata."
    params:
      locus_id: {required: true, type: string}
    output_type: locus
    provides:
      - summary@lsst:antares.*

  locus_alerts:
    path: "/loci/{locus_id}/alerts"
    method: GET
    description: "Retrieve the individual Rubin/LSST diaSource-derived alert records associated with a locus."
    params:
      locus_id: {required: true, type: string}
    output_type: array_of_alerts
    provides:
      - detection@lsst:antares.*

  catalog_matches:
    path: "/loci/{locus_id}/catalog-matches"
    method: GET
    description: "Retrieve external-catalog matches associated with a Rubin/LSST locus."
    params:
      locus_id: {required: true, type: string}
    output_type: array_of_catalog_matches
    provides:
      - crossmatch@{producer}:antares.*

  thumbnails:
    path: "/alerts/{alert_id}/thumbnails"
    method: GET
    description: "List binary thumbnail products for one LSST alert; alert IDs have the lsst:<diaSourceId> form."
    params:
      alert_id: {required: true, type: string}
    output_type: array_of_data_products
    provides:
      - data_product@lsst:antares

  statistics:
    path: "/loci/statistics"
    method: GET
    description: "Retrieve aggregate ANTARES tag counts, including the combined broker store."
    output_type: tag_statistics
    provides:
      - survey@lsst:antares.class_distribution
